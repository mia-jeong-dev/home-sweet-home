<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>인형뽑기</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background:#0a0a1a;
      font-family:'Arial',sans-serif;
      overflow:hidden;
      position:fixed; width:100%; height:100%;
      touch-action:none; user-select:none; -webkit-user-select:none;
    }
    canvas { display:block; }

    /* ── HUD ── */
    #hud {
      position:fixed; top:0; left:0; right:0;
      display:flex; justify-content:space-between; align-items:flex-start;
      padding:14px 16px;
      padding-top:calc(14px + env(safe-area-inset-top));
      pointer-events:none; z-index:10; gap:8px;
    }
    .hud-box {
      background:rgba(0,0,0,0.65);
      border:2px solid #a78bfa;
      border-radius:12px;
      padding:8px 14px;
      color:#fff; font-size:13px; font-weight:bold;
      white-space:nowrap;
    }
    #coin-display { border-color:#f59e0b; color:#fcd34d; }

    /* ── 조작 힌트 ── */
    #hint {
      position:fixed; bottom:20px; left:50%;
      transform:translateX(-50%);
      background:rgba(0,0,0,0.6);
      border:1px solid #555;
      border-radius:10px;
      padding:8px 16px;
      color:#aaa; font-size:11px; text-align:center;
      pointer-events:none; z-index:10;
      line-height:1.8;
    }
    @media (pointer:coarse) { #hint { display:none; } }

    /* ── 터치 컨트롤 ── */
    #touch-ui {
      position:fixed; bottom:0; left:0; right:0;
      display:none;
      justify-content:space-between;
      align-items:flex-end;
      padding:20px 28px;
      padding-bottom:calc(20px + env(safe-area-inset-bottom));
      pointer-events:none; z-index:20;
    }
    @media (pointer:coarse) { #touch-ui { display:flex; } }
    #joystick-zone {
      position:relative; width:120px; height:120px;
      pointer-events:all; touch-action:none;
    }
    #joy-base {
      position:absolute; inset:0;
      background:rgba(255,255,255,0.08);
      border:2px solid rgba(255,255,255,0.25);
      border-radius:50%;
    }
    #joy-knob {
      position:absolute;
      width:48px; height:48px;
      background:rgba(167,139,250,0.75);
      border:2px solid #a78bfa;
      border-radius:50%;
      top:50%; left:50%;
      transform:translate(-50%,-50%);
    }
    #drop-btn {
      width:88px; height:88px;
      background:rgba(239,68,68,0.7);
      border:3px solid #f87171;
      border-radius:50%;
      color:#fff; font-size:13px; font-weight:bold;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      gap:2px;
      pointer-events:all; touch-action:none;
      box-shadow:0 0 20px rgba(239,68,68,0.5);
      -webkit-tap-highlight-color:transparent;
    }
    #drop-btn:active { transform:scale(0.93); }

    /* ── 오버레이 ── */
    #overlay {
      position:fixed; inset:0;
      background:rgba(0,0,0,0.88);
      display:flex; flex-direction:column;
      align-items:center; justify-content:flex-start;
      overflow-y:auto; -webkit-overflow-scrolling:touch;
      padding:24px 0;
      padding-top:calc(24px + env(safe-area-inset-top));
      padding-bottom:calc(24px + env(safe-area-inset-bottom));
      z-index:100; color:#fff;
    }
    .panel {
      background:rgba(15,10,30,0.95);
      border:2px solid #a78bfa;
      border-radius:18px;
      padding:24px 20px;
      width:400px; max-width:96vw;
    }
    .panel h2 { font-size:22px; font-weight:bold; text-align:center; margin-bottom:6px; }
    .panel .sub { color:#aaa; font-size:12px; text-align:center; margin-bottom:16px; }
    .btn {
      width:100%; border:none; border-radius:30px;
      font-size:16px; font-weight:bold;
      padding:12px 0; cursor:pointer;
      margin-bottom:10px;
      transition:transform 0.1s;
      -webkit-tap-highlight-color:transparent;
    }
    .btn:hover { transform:scale(1.02); }
    .btn-purple { background:linear-gradient(135deg,#7c3aed,#a78bfa); color:#fff; }
    .btn-gray   { background:rgba(255,255,255,0.1); color:#ccc; border:1px solid #555; }
    .btn-red    { background:linear-gradient(135deg,#dc2626,#ef4444); color:#fff; }
    .coin-bar {
      background:rgba(245,158,11,0.15);
      border:1px solid #f59e0b;
      border-radius:8px;
      padding:8px 12px;
      color:#fcd34d; font-size:14px; font-weight:bold;
      text-align:center; margin-bottom:14px;
    }

    /* ── 결과 배너 ── */
    #result-banner {
      position:fixed; top:50%; left:50%;
      transform:translate(-50%,-50%);
      background:rgba(0,0,0,0.9);
      border:3px solid #ffd700;
      border-radius:20px;
      padding:24px 40px;
      text-align:center; z-index:80;
      display:none; pointer-events:none;
    }
    #result-banner h2 { font-size:28px; margin-bottom:6px; }
    #result-banner p  { color:#ccc; font-size:14px; }

    /* ── 컬렉션 ── */
    .collection-grid {
      display:grid; grid-template-columns:repeat(4,1fr);
      gap:8px; margin-top:12px;
    }
    .doll-card {
      background:rgba(255,255,255,0.06);
      border:1px solid #333;
      border-radius:10px;
      padding:8px 4px;
      text-align:center; font-size:22px;
    }
    .doll-card .doll-name { font-size:10px; color:#aaa; margin-top:3px; }
    .doll-count { font-size:10px; color:#a78bfa; font-weight:bold; }
  </style>
</head>
<body>

<div id="hud">
  <div class="hud-box" id="coin-display">🪙 <span id="coin-num">0</span></div>
  <div class="hud-box" id="state-display">대기 중</div>
  <div class="hud-box" style="pointer-events:all; cursor:pointer;" onclick="showCollection()">🧸 컬렉션</div>
</div>

<div id="hint">
  WASD / 방향키: 집게 이동&nbsp;&nbsp;|&nbsp;&nbsp;SPACE: 뽑기 (5코인)
</div>

<div id="touch-ui">
  <div id="joystick-zone">
    <div id="joy-base"></div>
    <div id="joy-knob"></div>
  </div>
  <div id="drop-btn">⬇<br><span style="font-size:10px">뽑기</span><br><span style="font-size:10px;color:#fca5a5">5🪙</span></div>
</div>

<div id="result-banner">
  <h2 id="result-title"></h2>
  <p id="result-sub"></p>
</div>

<div id="overlay"><!-- JS로 렌더링 --></div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.165.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// ── 상수 ──
const COIN_KEY  = 'ditto_coins';
const COL_KEY   = 'claw_collection';
const PLAY_COST = 5;

const MW = 12, MD = 10, MH = 14;  // 기계 크기
const CLAW_TOP    =  MH / 2 - 1.2;
const CLAW_BOTTOM = -MH / 2 + 2.2;
const MAX_X = 4.2, MAX_Z = 3.2;

// ── 동물 정의 ──
const ANIMALS = [
  { id:'dog',     name:'강아지', emoji:'🐶', bodyCol:0xc9a96e, headCol:0xd4b483, earCol:0xa0784a },
  { id:'cat',     name:'고양이', emoji:'🐱', bodyCol:0xf4a460, headCol:0xf4a460, earCol:0xe8956d },
  { id:'rabbit',  name:'토끼',   emoji:'🐰', bodyCol:0xf5f0eb, headCol:0xf5f0eb, earCol:0xffb6c1 },
  { id:'bear',    name:'곰',     emoji:'🐻', bodyCol:0x8b6347, headCol:0x9b7357, earCol:0x7a5230 },
  { id:'panda',   name:'판다',   emoji:'🐼', bodyCol:0xffffff, headCol:0xffffff, earCol:0x222222 },
  { id:'fox',     name:'여우',   emoji:'🦊', bodyCol:0xe8763a, headCol:0xe8763a, earCol:0xe8763a },
  { id:'koala',   name:'코알라', emoji:'🐨', bodyCol:0x9e9e9e, headCol:0xb0b0b0, earCol:0x7a7a7a },
  { id:'hamster', name:'햄스터', emoji:'🐹', bodyCol:0xf5c98a, headCol:0xfad9a8, earCol:0xf0b090 },
];

// ── localStorage ──
function getCoins()    { return parseInt(localStorage.getItem(COIN_KEY) || '0'); }
function setCoins(n)   { localStorage.setItem(COIN_KEY, String(n)); }
function getCollection(){ try { return JSON.parse(localStorage.getItem(COL_KEY)) || {}; } catch { return {}; } }

// ── 무료 코인 지급 ──
const LS_WELCOME = 'ditto_welcome_given';
const LS_DAILY   = 'ditto_daily_coins_date';
function todayStr() { return new Date().toLocaleDateString('ko-KR'); }
function claimFreeCoins() {
  let msg = null;
  let bonus = 0;
  if (!localStorage.getItem(LS_WELCOME)) {
    localStorage.setItem(LS_WELCOME, '1');
    bonus += 30;
    msg = '🎉 첫 방문 환영! +30🪙 웰컴 코인이 지급되었어요.';
  }
  if (localStorage.getItem(LS_DAILY) !== todayStr()) {
    localStorage.setItem(LS_DAILY, todayStr());
    bonus += 15;
    msg = msg ? '🎉 첫 방문 환영! +30🪙 웰컴 코인 & 오늘의 무료 코인 +15🪙 지급!' : '🪙 오늘의 무료 코인 +15🪙 지급!';
  }
  if (bonus > 0) {
    setCoins(getCoins() + bonus);
    return msg;
  }
  return null;
}

function showFreeCoinsToast(msg) {
  const toast = document.createElement('div');
  toast.style.cssText = `
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    background:rgba(10,5,30,0.96); border:2px solid #f59e0b;
    border-radius:16px; padding:20px 28px; text-align:center;
    color:#fcd34d; font-size:15px; font-weight:bold;
    z-index:9999; max-width:88vw; line-height:1.6;
    box-shadow:0 0 30px rgba(245,158,11,0.4);
    animation:fadeInPop 0.3s ease;
  `;
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => {
    toast.style.transition = 'opacity 0.5s';
    toast.style.opacity = '0';
    setTimeout(() => toast.remove(), 500);
  }, 2800);
}
function addToCollection(id) {
  const col = getCollection();
  col[id] = (col[id] || 0) + 1;
  localStorage.setItem(COL_KEY, JSON.stringify(col));
}

// ── 씬 설정 ──
const scene    = new THREE.Scene();
scene.fog      = new THREE.FogExp2(0x0a0a1a, 0.025);
const camera   = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 200);
camera.position.set(16, 12, 16);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
const isMobile = 'ontouchstart' in window;
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, isMobile ? 1.5 : 2));
renderer.shadowMap.enabled = !isMobile;
renderer.setClearColor(0x0a0a1a);
document.body.appendChild(renderer.domElement);

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// 조명
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dir = new THREE.DirectionalLight(0xffffff, 1.0);
dir.position.set(10, 20, 10);
scene.add(dir);
const interior = new THREE.PointLight(0xffeedd, 1.5, 25);
interior.position.set(0, MH / 2 - 2, 0);
scene.add(interior);
const neonL = new THREE.PointLight(0xa78bfa, 2, 20);
neonL.position.set(-MW / 2, 2, 0);
scene.add(neonL);
const neonR = new THREE.PointLight(0xf472b6, 2, 20);
neonR.position.set(MW / 2, 2, 0);
scene.add(neonR);

// ── 기계 만들기 ──
function buildMachine() {
  // 바닥
  const floor = new THREE.Mesh(
    new THREE.BoxGeometry(MW, 0.4, MD),
    new THREE.MeshStandardMaterial({ color: 0x1e1b4b, roughness: 0.6 })
  );
  floor.position.y = -MH / 2;
  scene.add(floor);

  // 유리 패널 (4면)
  const glassMat = new THREE.MeshStandardMaterial({
    color: 0x88ccff, transparent: true, opacity: 0.12,
    roughness: 0, metalness: 0.1, side: THREE.DoubleSide
  });
  const panels = [
    { w: MW, h: MH, d: 0.15, x: 0,       y: 0, z:  MD / 2 },
    { w: MW, h: MH, d: 0.15, x: 0,       y: 0, z: -MD / 2 },
    { w: 0.15, h: MH, d: MD, x:  MW / 2, y: 0, z: 0 },
    { w: 0.15, h: MH, d: MD, x: -MW / 2, y: 0, z: 0 },
  ];
  panels.forEach(p => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(p.w, p.h, p.d), glassMat);
    m.position.set(p.x, p.y, p.z);
    scene.add(m);
  });

  // 프레임 (모서리)
  const frameMat = new THREE.MeshStandardMaterial({ color: 0xc0c0c0, metalness: 0.9, roughness: 0.2 });
  const edges = [
    [-MW/2, -MW/2,  MD/2, -MD/2],
    [ MW/2,  MW/2,  MD/2, -MD/2],
  ];
  const framePositions = [
    [-MW/2, 0,  MD/2], [MW/2, 0,  MD/2],
    [-MW/2, 0, -MD/2], [MW/2, 0, -MD/2],
  ];
  framePositions.forEach(([x, y, z]) => {
    const bar = new THREE.Mesh(new THREE.BoxGeometry(0.3, MH, 0.3), frameMat);
    bar.position.set(x, y, z);
    scene.add(bar);
  });

  // 상단 지붕
  const roof = new THREE.Mesh(
    new THREE.BoxGeometry(MW + 0.3, 0.5, MD + 0.3),
    new THREE.MeshStandardMaterial({ color: 0x7c3aed, roughness: 0.5, metalness: 0.3 })
  );
  roof.position.y = MH / 2 + 0.25;
  scene.add(roof);

  // 네온 사인
  const signMat = new THREE.MeshStandardMaterial({ color: 0xffd700, emissive: 0xffd700, emissiveIntensity: 1 });
  const sign = new THREE.Mesh(new THREE.BoxGeometry(MW * 0.6, 0.8, 0.2), signMat);
  sign.position.set(0, MH / 2 + 1.1, MD / 2 + 0.1);
  scene.add(sign);

  // 경품 투출구 (오른쪽)
  const chuteMat = new THREE.MeshStandardMaterial({ color: 0x374151, roughness: 0.8 });
  const chute = new THREE.Mesh(new THREE.BoxGeometry(2.5, 2, 0.3), chuteMat);
  chute.position.set(MW / 2 + 1.1, -MH / 2 + 1, 0);
  scene.add(chute);

  // 배경 장식 별
  const starGeo = new THREE.BufferGeometry();
  const sp = [];
  for (let i = 0; i < 800; i++)
    sp.push((Math.random()-0.5)*300, (Math.random()-0.5)*300, (Math.random()-0.5)*300);
  starGeo.setAttribute('position', new THREE.Float32BufferAttribute(sp, 3));
  scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color:0xffffff, size:0.5 })));
}

// ── 동물 인형 만들기 ──
function buildAnimal(def) {
  const g = new THREE.Group();
  const mk = (geo, col, emit = 0) => new THREE.Mesh(geo,
    new THREE.MeshStandardMaterial({ color: col, roughness: 0.8,
      emissive: emit ? col : 0x000000, emissiveIntensity: emit }));

  // 몸통
  const body = mk(new THREE.SphereGeometry(0.7, 12, 10), def.bodyCol);
  body.scale.y = 1.1;
  g.add(body);

  // 머리
  const head = mk(new THREE.SphereGeometry(0.55, 12, 10), def.headCol);
  head.position.set(0, 0.85, 0.25);
  g.add(head);

  // 눈
  const eyeM = new THREE.MeshStandardMaterial({ color: 0x111111 });
  const eyeG = new THREE.SphereGeometry(0.07, 8, 8);
  [-0.16, 0.16].forEach(ex => {
    const e = new THREE.Mesh(eyeG, eyeM);
    e.position.set(ex, 0.92, 0.76);
    g.add(e);
  });

  // 코
  const nose = mk(new THREE.SphereGeometry(0.05, 6, 6), def.id === 'panda' ? 0x111111 : 0xff8899);
  nose.position.set(0, 0.8, 0.8);
  g.add(nose);

  // 동물별 귀
  if (def.id === 'rabbit') {
    // 긴 귀
    [-0.22, 0.22].forEach(ex => {
      const ear = mk(new THREE.CylinderGeometry(0.1, 0.12, 0.9, 8), def.headCol);
      ear.position.set(ex, 1.65, 0.2);
      ear.rotation.z = ex < 0 ? 0.15 : -0.15;
      g.add(ear);
      const inner = mk(new THREE.CylinderGeometry(0.05, 0.06, 0.7, 8), def.earCol);
      inner.position.set(ex, 1.65, 0.22);
      inner.rotation.z = ex < 0 ? 0.15 : -0.15;
      g.add(inner);
    });
  } else if (def.id === 'bear' || def.id === 'panda' || def.id === 'koala' || def.id === 'hamster') {
    // 둥근 귀
    [-0.4, 0.4].forEach(ex => {
      const ear = mk(new THREE.SphereGeometry(0.18, 8, 8), def.earCol);
      ear.position.set(ex, 1.32, 0.1);
      g.add(ear);
    });
  } else if (def.id === 'cat' || def.id === 'fox') {
    // 뾰족 귀
    [-0.35, 0.35].forEach(ex => {
      const ear = mk(new THREE.ConeGeometry(0.14, 0.3, 6), def.earCol);
      ear.position.set(ex, 1.4, 0.08);
      ear.rotation.z = ex < 0 ? 0.3 : -0.3;
      g.add(ear);
    });
  } else {
    // 강아지: 처진 귀
    [-0.48, 0.48].forEach(ex => {
      const ear = mk(new THREE.SphereGeometry(0.22, 8, 6), def.earCol);
      ear.position.set(ex, 1.05, 0.05);
      ear.scale.set(0.7, 1.1, 0.5);
      g.add(ear);
    });
  }

  // 판다 눈 무늬
  if (def.id === 'panda') {
    [-0.16, 0.16].forEach(ex => {
      const patch = mk(new THREE.SphereGeometry(0.13, 8, 8), 0x222222);
      patch.position.set(ex, 0.93, 0.72);
      g.add(patch);
    });
  }
  // 여우 흰 뺨
  if (def.id === 'fox') {
    const cheekM = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.9 });
    const cheek  = new THREE.Mesh(new THREE.SphereGeometry(0.22, 8, 8), cheekM);
    cheek.position.set(0, 0.77, 0.7);
    cheek.scale.set(1, 0.6, 0.5);
    g.add(cheek);
  }

  g.userData = { animalId: def.id, animalName: def.name, animalEmoji: def.emoji };
  return g;
}

// ── 인형 배치 ──
const dolls = [];
function spawnDolls() {
  dolls.forEach(d => scene.remove(d));
  dolls.length = 0;
  const usedDefs = [...ANIMALS].sort(() => Math.random() - 0.5).slice(0, 8);
  usedDefs.forEach((def, i) => {
    const doll = buildAnimal(def);
    const col  = i % 4, row = Math.floor(i / 4);
    doll.position.set(
      -3.5 + col * 2.4 + (Math.random() - 0.5) * 0.8,
      -MH / 2 + 1.2,
      -2.5 + row * 3.2 + (Math.random() - 0.5) * 0.8
    );
    doll.rotation.y = Math.random() * Math.PI * 2;
    scene.add(doll);
    dolls.push(doll);
  });
}

// ── 집게(클로) ──
const clawGroup = new THREE.Group();
scene.add(clawGroup);
let clawX = 0, clawZ = 0;
let clawY = CLAW_TOP;
const clawArms = [];

function buildClaw() {
  // 수평 레일 X
  const railMatX = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, metalness: 0.9, roughness: 0.2 });
  const railX = new THREE.Mesh(new THREE.BoxGeometry(MW - 0.5, 0.2, 0.2), railMatX);
  railX.position.set(0, MH / 2 - 0.5, 0);
  scene.add(railX);

  // 수평 레일 Z
  const railZ = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, MD - 0.5), railMatX);
  railZ.position.y = MH / 2 - 0.5;
  scene.add(railZ);
  window._railZ = railZ;

  // 집게 몸통
  const body = new THREE.Mesh(
    new THREE.CylinderGeometry(0.3, 0.25, 0.6, 10),
    new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.9, roughness: 0.2 })
  );
  clawGroup.add(body);

  // 케이블
  const cable = new THREE.Mesh(
    new THREE.CylinderGeometry(0.05, 0.05, 1, 6),
    new THREE.MeshStandardMaterial({ color: 0x555555 })
  );
  cable.position.y = 0.8;
  clawGroup.add(cable);
  window._cable = cable;

  // 집게 팔 3개
  const armMat = new THREE.MeshStandardMaterial({ color: 0x999999, metalness: 0.8, roughness: 0.3 });
  for (let i = 0; i < 3; i++) {
    const arm = new THREE.Group();
    const seg = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.55, 0.1), armMat);
    seg.position.y = -0.55;
    arm.add(seg);
    const tip = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.1, 0.25), armMat);
    tip.position.set(0, -0.85, 0.12);
    arm.add(tip);
    arm.rotation.y = (i / 3) * Math.PI * 2;
    arm.position.set(Math.cos((i/3)*Math.PI*2)*0.35, -0.3, Math.sin((i/3)*Math.PI*2)*0.35);
    clawGroup.add(arm);
    clawArms.push(arm);
  }
}

function updateClawTransform() {
  clawGroup.position.set(clawX, clawY, clawZ);
  if (window._railZ) window._railZ.position.set(clawX, MH/2 - 0.5, 0);
  // 케이블 길이
  if (window._cable) {
    const cableLen = CLAW_TOP - clawY + 0.5;
    window._cable.scale.y = Math.max(0.1, cableLen);
    window._cable.position.y = cableLen / 2 + 0.3;
  }
}

function setClawOpen(open) {
  clawArms.forEach((arm, i) => {
    const angle = (i / 3) * Math.PI * 2;
    const spread = open ? 0.5 : 0.15;
    arm.position.set(Math.cos(angle) * spread, -0.3, Math.sin(angle) * spread);
    arm.rotation.z = open ? 0.4 : 0;
  });
}

// ── 게임 상태 ──
let state = 'idle'; // idle | moving | dropping | grabbing | raising | depositing | result
let stateTimer = 0;
let grabbedDoll = null;
let dropOriginY = CLAW_TOP;

const DURATIONS = { dropping:1.6, grabbing:0.5, raising:1.2, depositing:1.0, result:2.2 };

const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') { e.preventDefault(); tryDrop(); }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

function tryDrop() {
  if (state !== 'idle') return;
  if (getCoins() < PLAY_COST) {
    showResultBanner('❌ 코인 부족!', `코인이 ${PLAY_COST}개 필요합니다.`, '#ef4444');
    return;
  }
  setCoins(getCoins() - PLAY_COST);
  updateCoinUI();
  state = 'dropping';
  stateTimer = 0;
  dropOriginY = clawY;
  setClawOpen(true);
  setStateDisplay('내려가는 중...');
}

function findNearestDoll() {
  let best = null, bestDist = Infinity;
  dolls.forEach(d => {
    if (d.userData.grabbed) return;
    const dx = d.position.x - clawX;
    const dz = d.position.z - clawZ;
    const dist = Math.sqrt(dx*dx + dz*dz);
    if (dist < bestDist) { bestDist = dist; best = d; }
  });
  return { doll: best, dist: bestDist };
}

// ── 터치 ──
let touchMove = null;
(function setupTouch() {
  const zone    = document.getElementById('joystick-zone');
  const knob    = document.getElementById('joy-knob');
  const dropBtn = document.getElementById('drop-btn');
  let joyId = null, joyOrigin = { x:0, y:0 };
  const DEAD = 10, MAX_R = 52;

  zone.addEventListener('touchstart', e => {
    e.preventDefault();
    const t = e.changedTouches[0];
    joyId = t.identifier;
    const r = zone.getBoundingClientRect();
    joyOrigin = { x: r.left + r.width/2, y: r.top + r.height/2 };
  }, { passive:false });

  zone.addEventListener('touchmove', e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      if (t.identifier !== joyId) continue;
      const dx = t.clientX - joyOrigin.x, dy = t.clientY - joyOrigin.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const clamped = Math.min(dist, MAX_R);
      const angle = Math.atan2(dy, dx);
      knob.style.transform = `translate(calc(-50% + ${Math.cos(angle)*clamped}px), calc(-50% + ${Math.sin(angle)*clamped}px))`;
      touchMove = dist > DEAD ? { x: dx/dist, y: dy/dist } : null;
    }
  }, { passive:false });

  const endJoy = e => {
    for (const t of e.changedTouches) {
      if (t.identifier === joyId) {
        joyId = null; touchMove = null;
        knob.style.transform = 'translate(-50%,-50%)';
      }
    }
  };
  zone.addEventListener('touchend', endJoy);
  zone.addEventListener('touchcancel', endJoy);

  dropBtn.addEventListener('touchstart', e => { e.preventDefault(); tryDrop(); }, { passive:false });
})();

// ── UI 업데이트 ──
function updateCoinUI() {
  document.getElementById('coin-num').textContent = getCoins();
}
function setStateDisplay(txt) {
  document.getElementById('state-display').textContent = txt;
}

let resultTimeout = null;
function showResultBanner(title, sub, color = '#ffd700') {
  const b = document.getElementById('result-banner');
  document.getElementById('result-title').textContent = title;
  document.getElementById('result-title').style.color = color;
  document.getElementById('result-sub').textContent = sub;
  b.style.display = 'block';
  clearTimeout(resultTimeout);
  resultTimeout = setTimeout(() => { b.style.display = 'none'; }, DURATIONS.result * 1000);
}

// ── 화면 렌더링 ──
function showTitle() {
  const coins = getCoins();
  const overlay = document.getElementById('overlay');
  overlay.style.display = 'flex';
  overlay.innerHTML = `
    <div class="panel">
      <h2>🕹️ 인형뽑기</h2>
      <p class="sub">집게를 조종해서 귀여운 동물 인형을 뽑아보세요!</p>
      <div class="coin-bar">🪙 보유 코인: ${coins} &nbsp;|&nbsp; 1회 ${PLAY_COST}코인</div>
      ${coins < PLAY_COST ? `<div style="background:rgba(239,68,68,0.15);border:1px solid #ef4444;border-radius:8px;padding:8px 12px;color:#fca5a5;font-size:12px;text-align:center;margin-bottom:10px">코인이 부족해요!<br>점프맵에서 코인을 모으거나 내일 무료 코인을 받아보세요 🪙</div>` : ''}
      <button class="btn btn-purple" onclick="window.startClaw()">시작하기</button>
      <button class="btn btn-gray" onclick="window.showCollection()">🧸 내 컬렉션</button>
      <div style="text-align:center;color:#666;font-size:11px;margin-top:6px;margin-bottom:2px">매일 무료 🪙15코인 지급 · 첫 방문 🪙30코인</div>
      <a href="index.html" style="display:block;text-align:center;color:#888;font-size:12px;margin-top:4px;text-decoration:none">← 점프맵으로 돌아가기</a>
    </div>`;
}

window.showCollection = function() {
  const col = getCollection();
  const overlay = document.getElementById('overlay');
  overlay.style.display = 'flex';
  const cards = ANIMALS.map(a => `
    <div class="doll-card" style="${col[a.id] ? '' : 'opacity:0.3'}">
      <div style="font-size:26px">${a.emoji}</div>
      <div class="doll-name">${a.name}</div>
      <div class="doll-count">${col[a.id] ? `×${col[a.id]}` : '미획득'}</div>
    </div>`).join('');
  overlay.innerHTML = `
    <div class="panel">
      <h2>🧸 내 컬렉션</h2>
      <p class="sub">총 ${Object.values(col).reduce((a,b)=>a+b,0)}개 획득</p>
      <div class="collection-grid">${cards}</div>
      <div style="margin-top:14px"></div>
      <button class="btn btn-purple" onclick="window.startClaw()">계속 뽑기</button>
      <button class="btn btn-gray" onclick="window.showTitle()">← 타이틀로</button>
    </div>`;
};

window.showTitle = showTitle;
window.startClaw = function() {
  document.getElementById('overlay').style.display = 'none';
  updateCoinUI();
  setStateDisplay(`이동 후 SPACE로 뽑기`);
};

// ── 게임 루프 ──
const clock = new THREE.Clock();
let wobble = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  wobble += dt;

  // 인형 귀여운 흔들림
  dolls.forEach((d, i) => {
    if (!d.userData.grabbed)
      d.rotation.y += Math.sin(wobble + i) * 0.003;
  });

  // 조이스틱 / 키보드 이동
  if (state === 'idle') {
    const spd = 3.5 * dt;
    let mx = 0, mz = 0;
    if (keys['ArrowLeft']  || keys['KeyA']) mx -= spd;
    if (keys['ArrowRight'] || keys['KeyD']) mx += spd;
    if (keys['ArrowUp']    || keys['KeyW']) mz -= spd;
    if (keys['ArrowDown']  || keys['KeyS']) mz += spd;
    if (touchMove) { mx += touchMove.x * spd * 1.5; mz += touchMove.y * spd * 1.5; }
    clawX = Math.max(-MAX_X, Math.min(MAX_X, clawX + mx));
    clawZ = Math.max(-MAX_Z, Math.min(MAX_Z, clawZ + mz));
  }

  // 상태 머신
  stateTimer += dt;

  if (state === 'dropping') {
    const t = Math.min(stateTimer / DURATIONS.dropping, 1);
    clawY = THREE.MathUtils.lerp(CLAW_TOP, CLAW_BOTTOM, t);
    if (t >= 1) {
      state = 'grabbing'; stateTimer = 0;
      setStateDisplay('집는 중...');
      const { doll, dist } = findNearestDoll();
      const success = doll && dist < 2.2 && Math.random() < (1 - dist * 0.3);
      if (success) {
        grabbedDoll = doll;
        grabbedDoll.userData.grabbed = true;
        setClawOpen(false);
      } else {
        setClawOpen(false);
        setTimeout(() => setClawOpen(true), 300);
      }
    }
  } else if (state === 'grabbing') {
    if (stateTimer >= DURATIONS.grabbing) {
      state = 'raising'; stateTimer = 0;
      setStateDisplay('올라가는 중...');
    }
  } else if (state === 'raising') {
    const t = Math.min(stateTimer / DURATIONS.raising, 1);
    clawY = THREE.MathUtils.lerp(CLAW_BOTTOM, CLAW_TOP, t);
    if (grabbedDoll) {
      grabbedDoll.position.set(clawX, clawY - 1.2, clawZ);
    }
    if (t >= 1) {
      if (grabbedDoll) { state = 'depositing'; stateTimer = 0; setStateDisplay('투출 중...'); }
      else {
        state = 'idle'; setClawOpen(true); setStateDisplay('이동 후 SPACE로 뽑기');
        showResultBanner('😢 아쉽다!', '다시 도전해 보세요!', '#f87171');
      }
    }
  } else if (state === 'depositing') {
    const t = Math.min(stateTimer / DURATIONS.depositing, 1);
    clawX = THREE.MathUtils.lerp(clawX, MW / 2 + 1, t * 0.08);
    if (grabbedDoll) grabbedDoll.position.set(clawX, clawY - 1.2, clawZ);
    if (stateTimer >= DURATIONS.depositing) {
      const d = grabbedDoll;
      addToCollection(d.userData.animalId);
      scene.remove(d);
      dolls.splice(dolls.indexOf(d), 1);
      grabbedDoll = null;
      setClawOpen(true);
      state = 'idle';
      clawX = 0; clawZ = 0;
      setStateDisplay('이동 후 SPACE로 뽑기');
      showResultBanner(`${d.userData.animalEmoji} ${d.userData.animalName} 획득!`, '컬렉션에 추가됐어요!', '#ffd700');
      // 인형이 다 없어지면 리스폰
      if (dolls.length === 0) setTimeout(spawnDolls, 1500);
    }
  }

  updateClawTransform();
  renderer.render(scene, camera);
}

// ── 초기화 ──
buildMachine();
buildClaw();
spawnDolls();
setClawOpen(true);
updateClawTransform();
const _freeMsg = claimFreeCoins();
updateCoinUI();
animate();
showTitle();
if (_freeMsg) setTimeout(() => showFreeCoinsToast(_freeMsg), 800);
</script>
