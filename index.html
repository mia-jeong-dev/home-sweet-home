<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>동글이의 점프맵 어드벤처</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      overflow: hidden;
      font-family: 'Arial', sans-serif;
      /* iOS 고무줄 스크롤 방지 */
      position: fixed; width: 100%; height: 100%;
      touch-action: none;
      -webkit-user-select: none; user-select: none;
    }
    canvas { display: block; touch-action: none; }

    /* ── 상단 HUD ── */
    #ui {
      position: fixed;
      top: 0; left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 14px 16px;
      padding-top: calc(14px + env(safe-area-inset-top));
      padding-left:  calc(16px + env(safe-area-inset-left));
      padding-right: calc(16px + env(safe-area-inset-right));
      pointer-events: none;
      z-index: 10;
      gap: 8px;
    }

    #hp-container {
      background: rgba(0,0,0,0.6);
      border: 2px solid #fff;
      border-radius: 10px;
      padding: 8px 12px;
      min-width: 0;
      flex: 1 1 0;
      max-width: 180px;
    }
    #hp-label { color: #fff; font-size: 10px; margin-bottom: 4px; letter-spacing: 1px; }
    #hp-bar-bg { background: #333; border-radius: 5px; height: 13px; overflow: hidden; }
    #hp-bar {
      height: 100%;
      background: linear-gradient(90deg, #ff4444, #ff8800);
      border-radius: 5px;
      transition: width 0.2s, background 0.3s;
    }
    #hp-text { color: #fff; font-size: 9px; margin-top: 3px; text-align: right; }

    #stage-info {
      background: rgba(0,0,0,0.6);
      border: 2px solid #fff;
      border-radius: 10px;
      padding: 8px 10px;
      text-align: center;
      flex-shrink: 0;
    }
    #stage-text { color: #fff; font-size: 15px; font-weight: bold; }
    #stage-sub { color: #aaa; font-size: 10px; margin-top: 1px; }

    /* 점수 + 조작 힌트를 우측에 세로로 쌓기 */
    #ui-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      flex-shrink: 0;
    }
    #score-ui {
      background: rgba(0,0,0,0.6);
      border: 2px solid #7c3aed;
      border-radius: 10px;
      padding: 7px 12px;
      color: #a78bfa;
      font-size: 12px;
      font-weight: bold;
      pointer-events: none;
      display: none;
      white-space: nowrap;
    }
    #controls-hint {
      background: rgba(0,0,0,0.6);
      border: 2px solid #555;
      border-radius: 10px;
      padding: 7px 10px;
      color: #ccc;
      font-size: 10px;
      line-height: 1.8;
    }
    @media (pointer: coarse) { #controls-hint { display: none; } }

    /* ── 터치 컨트롤 ── */
    #touch-controls {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      display: none;
      justify-content: space-between;
      align-items: flex-end;
      padding: 20px 28px;
      padding-bottom: calc(20px + env(safe-area-inset-bottom));
      padding-left:   calc(28px + env(safe-area-inset-left));
      padding-right:  calc(28px + env(safe-area-inset-right));
      pointer-events: none;
      z-index: 20;
    }
    @media (pointer: coarse) { #touch-controls { display: flex; } }

    #joystick-zone {
      position: relative;
      width: 120px; height: 120px;
      pointer-events: all;
      touch-action: none;
    }
    #joystick-base {
      position: absolute; inset: 0;
      background: rgba(255,255,255,0.08);
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
    }
    #joystick-knob {
      position: absolute;
      width: 48px; height: 48px;
      background: rgba(167,139,250,0.75);
      border: 2px solid #a78bfa;
      border-radius: 50%;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      transition: background 0.1s;
    }

    #jump-btn {
      width: 84px; height: 84px;
      background: rgba(124,58,237,0.65);
      border: 3px solid #a78bfa;
      border-radius: 50%;
      color: #fff;
      font-size: 26px;
      display: flex; align-items: center; justify-content: center;
      pointer-events: all;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      box-shadow: 0 0 20px rgba(124,58,237,0.5);
      -webkit-tap-highlight-color: transparent;
    }
    #jump-btn:active { background: rgba(167,139,250,0.85); transform: scale(0.93); }

    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 24px 0;
      padding-top:    calc(24px + env(safe-area-inset-top));
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
      z-index: 100;
      color: #fff;
    }
    #start-btn {
      background: linear-gradient(135deg, #7c3aed, #a78bfa);
      border: none;
      color: #fff;
      font-size: 20px;
      padding: 14px 40px;
      border-radius: 30px;
      cursor: pointer;
      pointer-events: all;
      transition: transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 4px 20px rgba(124,58,237,0.6);
      -webkit-tap-highlight-color: transparent;
    }
    #start-btn:hover { transform: scale(1.05); box-shadow: 0 6px 30px rgba(124,58,237,0.8); }

    #damage-flash {
      position: fixed;
      inset: 0;
      background: rgba(255,0,0,0.35);
      pointer-events: none;
      z-index: 50;
      opacity: 0;
      transition: opacity 0.1s;
    }
    #poison-flash {
      position: fixed;
      inset: 0;
      background: rgba(0,200,80,0.28);
      pointer-events: none;
      z-index: 51;
      opacity: 0;
      transition: opacity 0.15s;
    }
    #poison-indicator {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #44ff44;
      font-size: 14px;
      font-weight: bold;
      pointer-events: none;
      z-index: 55;
      display: none;
      text-shadow: 0 0 8px #00ff44;
    }

    #level-banner {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.8);
      border-radius: 16px;
      padding: 20px 50px;
      text-align: center;
      z-index: 60;
      display: none;
      pointer-events: none;
    }
    #level-banner h2 { font-size: 36px; font-weight: bold; margin-bottom: 6px; }
    #level-banner p { font-size: 16px; color: #ddd; }

    /* ── 랭킹보드 ── */
    .panel {
      background: rgba(15,10,30,0.95);
      border: 2px solid #a78bfa;
      border-radius: 18px;
      padding: 24px 20px;
      width: 420px;
      max-width: 96vw;
    }
    .panel h2 { font-size: 22px; font-weight: bold; margin-bottom: 6px; text-align: center; }
    .panel .sub { color: #aaa; font-size: 12px; text-align: center; margin-bottom: 16px; }

    @media (max-width: 480px) {
      .panel { padding: 18px 14px; border-radius: 14px; }
      .panel h2 { font-size: 19px; }
      .ranking-table th { font-size: 10px; padding: 5px 5px; }
      .ranking-table td { font-size: 12px; padding: 7px 5px; }
      .rank-medal { font-size: 15px; }
      .name-input { font-size: 16px; padding: 10px 12px; }
      .btn { font-size: 15px; padding: 12px 0; }
      #score-display .score-big { font-size: 28px; }
    }

    .name-input {
      width: 100%;
      background: rgba(255,255,255,0.07);
      border: 2px solid #7c3aed;
      border-radius: 10px;
      color: #fff;
      font-size: 18px;
      padding: 10px 14px;
      outline: none;
      margin-bottom: 14px;
      text-align: center;
      letter-spacing: 1px;
    }
    .name-input:focus { border-color: #a78bfa; box-shadow: 0 0 10px rgba(167,139,250,0.4); }

    .btn {
      width: 100%;
      border: none;
      border-radius: 30px;
      font-size: 17px;
      font-weight: bold;
      padding: 12px 0;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.2s;
      margin-bottom: 10px;
    }
    .btn:hover { transform: scale(1.03); }
    .btn-purple { background: linear-gradient(135deg,#7c3aed,#a78bfa); color:#fff; box-shadow:0 4px 18px rgba(124,58,237,0.5); }
    .btn-red    { background: linear-gradient(135deg,#dc2626,#ef4444); color:#fff; box-shadow:0 4px 18px rgba(220,38,38,0.5); }
    .btn-gray   { background: rgba(255,255,255,0.1); color:#ccc; border:1px solid #555; }

    .ranking-table { width: 100%; border-collapse: collapse; margin-top: 6px; }
    .ranking-table th {
      color: #a78bfa; font-size: 12px; letter-spacing: 1px;
      padding: 6px 8px; border-bottom: 1px solid #333; text-align: left;
    }
    .ranking-table td { padding: 9px 8px; font-size: 14px; border-bottom: 1px solid #1e1e2e; color: #eee; }
    .ranking-table tr.me td { color: #ffd700; font-weight: bold; }
    .rank-medal { font-size: 18px; }
    .score-val { color: #a78bfa; font-weight: bold; }
    .no-record { text-align:center; color:#555; padding: 20px 0; font-size:14px; }
    .rank-tabs { display:flex; gap:6px; margin-bottom:8px; }
    .rank-tab {
      flex:1; padding:6px 0; border:1px solid #444; border-radius:8px;
      background:rgba(255,255,255,0.05); color:#888; font-size:13px; cursor:pointer;
    }
    .rank-tab.active { background:rgba(124,58,237,0.3); border-color:#7c3aed; color:#c4b5fd; font-weight:bold; }

    #score-display {
      background: rgba(0,0,0,0.5);
      border: 1px solid #555;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 18px;
      text-align: center;
    }
    #score-display .score-big { font-size: 36px; font-weight: bold; color: #a78bfa; }
    #score-display .score-breakdown { font-size: 12px; color: #888; margin-top: 4px; }

    /* ── 코인 HUD ── */
    #coin-ui {
      background: rgba(0,0,0,0.6);
      border: 2px solid #f59e0b;
      border-radius: 10px;
      padding: 7px 12px;
      color: #fcd34d;
      font-size: 13px;
      font-weight: bold;
      pointer-events: none;
      display: none;
      white-space: nowrap;
    }

    /* ── 상점 ── */
    .shop-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 14px 0;
    }
    .color-card {
      border-radius: 12px;
      border: 2px solid #333;
      padding: 10px 6px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.1s;
      background: rgba(255,255,255,0.04);
      position: relative;
    }
    .color-card:hover { transform: scale(1.04); }
    .color-card.owned  { border-color: #a78bfa; }
    .color-card.active { border-color: #ffd700; box-shadow: 0 0 10px rgba(255,215,0,0.4); }
    .color-swatch {
      width: 40px; height: 40px;
      border-radius: 50%;
      margin: 0 auto 6px;
      border: 2px solid rgba(255,255,255,0.2);
    }
    .color-name  { font-size: 11px; color: #ccc; margin-bottom: 4px; }
    .color-price { font-size: 11px; color: #fcd34d; font-weight: bold; }
    .color-owned { font-size: 10px; color: #a78bfa; }
    .color-active-badge {
      position: absolute; top: 4px; right: 4px;
      font-size: 10px; background: #ffd700;
      color: #000; border-radius: 4px; padding: 1px 4px; font-weight: bold;
    }
    .shop-coin-bar {
      background: rgba(245,158,11,0.15);
      border: 1px solid #f59e0b;
      border-radius: 8px;
      padding: 8px 12px;
      color: #fcd34d;
      font-size: 14px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 14px;
    }
    @media (max-width: 420px) {
      .shop-grid { grid-template-columns: repeat(3, 1fr); gap: 7px; }
      .color-swatch { width: 32px; height: 32px; }
      .color-name { font-size: 10px; }
    }

    .coupon-section-title {
      color: #f59e0b; font-size: 13px; font-weight: bold;
      letter-spacing: 1px; margin: 18px 0 10px;
    }
    .coupon-card {
      display: flex; align-items: center; gap: 12px;
      background: rgba(255,255,255,0.04);
      border: 2px solid #333; border-radius: 12px;
      padding: 12px 14px; cursor: pointer;
      transition: border-color 0.15s, transform 0.1s;
      margin-bottom: 8px; position: relative;
    }
    .coupon-card:hover { transform: scale(1.02); }
    .coupon-card.owned  { border-color: #a78bfa; }
    .coupon-card.active { border-color: #f59e0b; box-shadow: 0 0 10px rgba(245,158,11,0.4); }
    .coupon-icon  { font-size: 24px; flex-shrink: 0; }
    .coupon-name  { font-size: 14px; color: #eee; font-weight: bold; margin-bottom: 3px; }
    .coupon-info  { flex: 1; }
    .coupon-status-badge {
      position: absolute; top: 6px; right: 8px;
      font-size: 10px; background: #f59e0b;
      color: #000; border-radius: 4px; padding: 1px 5px; font-weight: bold;
    }
  </style>
</head>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';

// ── 공유 랭킹 (Google Sheets) ──
const SHEET_API = 'https://script.google.com/macros/s/AKfycbxFyl1lKgcoQXmlrJYdc58sBUmI0Y8fEu0Zc284MKHuzDsnwqbcCWzeN4jsHrDHcMat/exec';
let sharedRankings = [];

// ─────────────────────────────────────────────
// SOUND ENGINE (Web Audio API 합성음)
// ─────────────────────────────────────────────
const SFX = (() => {
  let ctx = null;
  function ac() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function osc(freq, type, gainVal, duration, freqEnd, startTime) {
    const c = ac();
    const t = startTime ?? c.currentTime;
    const g = c.createGain();
    g.gain.setValueAtTime(gainVal, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + duration);
    g.connect(c.destination);
    const o = c.createOscillator();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd, t + duration);
    o.connect(g);
    o.start(t);
    o.stop(t + duration + 0.05);
  }
  function noise(gainVal, duration, startTime) {
    const c = ac();
    const t = startTime ?? c.currentTime;
    const buf = c.createBuffer(1, c.sampleRate * duration, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = c.createBufferSource();
    src.buffer = buf;
    const g = c.createGain();
    g.gain.setValueAtTime(gainVal, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + duration);
    const filt = c.createBiquadFilter();
    filt.type = 'bandpass';
    filt.frequency.value = 200;
    src.connect(filt);
    filt.connect(g);
    g.connect(c.destination);
    src.start(t);
    src.stop(t + duration + 0.05);
  }
  return {
    jump() {
      osc(280, 'sine', 0.25, 0.18, 520);
    },
    land() {
      noise(0.18, 0.07);
      osc(90, 'sine', 0.3, 0.12, 50);
    },
    damage() {
      osc(180, 'sawtooth', 0.35, 0.12, 80);
      osc(120, 'square',   0.2,  0.18, 60, ac().currentTime + 0.05);
    },
    stageClear() {
      const c = ac();
      const notes = [523, 659, 784, 1047];
      notes.forEach((f, i) => osc(f, 'sine', 0.3, 0.3, null, c.currentTime + i * 0.13));
    },
    gameClear() {
      const c = ac();
      const melody = [523,659,784,659,784,1047,784,1047,1319];
      melody.forEach((f, i) => osc(f, 'sine', 0.28, 0.35, null, c.currentTime + i * 0.12));
    },
    gameOver() {
      const c = ac();
      const notes = [392, 330, 294, 220];
      notes.forEach((f, i) => osc(f, 'triangle', 0.3, 0.4, f * 0.7, c.currentTime + i * 0.18));
    },
    coin() {
      osc(880, 'sine', 0.18, 0.1, 1200);
      osc(1200, 'sine', 0.12, 0.08, null, ac().currentTime + 0.06);
    },
    heal() {
      osc(523, 'sine', 0.22, 0.15, 784);
      osc(784, 'sine', 0.18, 0.18, 1047, ac().currentTime + 0.12);
      osc(1047, 'sine', 0.14, 0.2, null, ac().currentTime + 0.24);
    },
    poison() {
      osc(100, 'triangle', 0.18, 0.45, 60);
      osc(240, 'sine', 0.09, 0.35, 120, ac().currentTime + 0.12);
    },
  };
})();

// ─────────────────────────────────────────────
// GLOBALS
// ─────────────────────────────────────────────
let scene, camera, renderer;
let player, playerBody;
let platforms = [];
let hazards = [];
let spikePositions = [];
let coinMeshes = [];     // 씬에 놓인 코인 목록
let sessionCoins = 0;    // 이번 게임에서 모은 코인
let potionMeshes = [];   // 씬에 놓인 물약 목록
let flagGroup = null;
let flagBanner = null;
const flagBasePos = new THREE.Vector3();
const goalPlatformPos = new THREE.Vector3();

const LS_RANK_DAILY   = 'ditto_rank_daily';
async function fetchSharedRankings() {
  try {
    const ctrl = new AbortController();
    const tid = setTimeout(() => ctrl.abort(), 5000);
    const res = await fetch(SHEET_API, { signal: ctrl.signal });
    clearTimeout(tid);
    sharedRankings = await res.json();
  } catch(e) { console.warn('랭킹 불러오기 실패', e); }
}
function getDailyRankings() {
  const start = new Date(); start.setHours(0,0,0,0);
  return sharedRankings.filter(r => r.ts >= start.getTime()).sort((a,b)=>b.score-a.score).slice(0,20);
}
function getWeeklyRankings() {
  const start = new Date(); start.setDate(start.getDate() - start.getDay()); start.setHours(0,0,0,0);
  return sharedRankings.filter(r => r.ts >= start.getTime()).sort((a,b)=>b.score-a.score).slice(0,20);
}
function getMonthlyRankings() {
  const start = new Date(); start.setDate(1); start.setHours(0,0,0,0);
  return sharedRankings.filter(r => r.ts >= start.getTime()).sort((a,b)=>b.score-a.score).slice(0,20);
}
async function addRanking(name, score, stage) {
  const ts = Date.now();
  const date = new Date().toLocaleDateString('ko-KR');
  sharedRankings = [...sharedRankings, { name, score, stage, date, ts }];
  try {
    const params = new URLSearchParams({ action: 'add', name, score, stage, date, ts });
    await fetch(SHEET_API + '?' + params);
  } catch(e) { console.warn('랭킹 저장 실패', e); }
  return { daily: getDailyRankings(), weekly: getWeeklyRankings(), monthly: getMonthlyRankings() };
}
function calcScore() {
  const elapsed = Math.max(1, (Date.now() - stageStartTime) / 1000);
  const stageBonus = (currentStage - 1) * 1000;
  const hpBonus = hp * 5;
  const timeBonus = Math.floor(Math.max(0, 300 - elapsed) * 3);
  return stageBonus + hpBonus + timeBonus;
}

function medal(rank) {
  if (rank === 0) return '🥇';
  if (rank === 1) return '🥈';
  if (rank === 2) return '🥉';
  return `${rank + 1}.`;
}

function rankingRows(list, highlightName) {
  if (!list.length) return `<tr><td colspan="4" class="no-record">기록 없음</td></tr>`;
  return list.map((r, i) => `
    <tr class="${r.name === highlightName && i === list.findIndex(x=>x.name===highlightName&&x.score===r.score) ? 'me' : ''}">
      <td><span class="rank-medal">${medal(i)}</span></td>
      <td>${r.name}</td>
      <td class="score-val">${r.score.toLocaleString()}</td>
      <td style="color:#666;font-size:12px">${r.date}</td>
    </tr>`).join('');
}

  const count = loadGlasses();
  if (count <= 0) return;
  saveGlasses(count - 1);
  glassesActive = true;
  glassesTimer = 600; // 10초 (60fps 기준)
  // 숨겨진 블록 X선 효과로 표시
  portalBlocks.forEach(b => {

    b.material.color.setHex(b.userData.isPortal ? 0xff6600 : 0x00e5ff);
    b.material.emissive.setHex(b.userData.isPortal ? 0xff3300 : 0x00aacc);
    b.material.emissiveIntensity = 1.0;
    b.material.opacity = 0.5;
  });

  if (el) { el.style.color = '#ffffff'; }
  SFX.coin();
}

window.onCouponClick = function(id, price) {
  const owned = loadOwnedCoupons();
  if ((owned[id] || 0) > 0) {
    // 보유 — 토글 (적용/해제)
    saveActiveCoupon(loadActiveCoupon() === id ? null : id);
    showShop();
    SFX.coin();
  } else {
    // 구매 → 3회 충전
    const coins = loadCoins();
    if (coins < price) {
      document.getElementById('shop-coin-count').style.color = '#ef4444';
      setTimeout(() => { document.getElementById('shop-coin-count').style.color = ''; }, 600);
      return;
    }
    saveCoins(coins - price);
    owned[id] = 3;
    saveOwnedCoupons(owned);
    saveActiveCoupon(id);
    showShop();
    SFX.stageClear();
  }
};

window.onShopClick = function(id, price) {
  const owned = loadOwned();
  const activeId = loadActiveColor();
  if (owned.includes(id)) {
    // 이미 보유 — 착용
    if (id === activeId) return;
    saveActiveColor(id);
    applyCharacterColor(id);
    showShop();
    SFX.coin();
  } else {
    // 구매
    const coins = loadCoins();
    if (coins < price) {
      // 코인 부족 — 버튼 흔들기
      document.getElementById('shop-coin-count').style.color = '#ef4444';
      setTimeout(() => { document.getElementById('shop-coin-count').style.color = ''; }, 600);
      return;
    }
    saveCoins(coins - price);
    const newOwned = [...owned, id];
    saveOwned(newOwned);
    saveActiveColor(id);
    applyCharacterColor(id);
    showShop();
    SFX.stageClear();
  }
};

function applyCharacterColor(id) {
  if (!playerBody) return;
  if (id === 'ghost') {
    playerBody.material.transparent = true;
    playerBody.material.depthWrite = false;
    playerBody.material.opacity = 0.13;
    playerBody.material.color.setHex(0xffffff);
    playerBody.material.emissive.setHex(0x000000);
    playerBody.material.emissiveIntensity = 0;
  } else {
    const col = SHOP_COLORS.find(c => c.id === id) || SHOP_COLORS[0];
    playerBody.material.transparent = false;
    playerBody.material.depthWrite = true;
    playerBody.material.opacity = 1;
    playerBody.material.color.setHex(col.color);
    playerBody.material.emissive.setHex(col.emissive);
    playerBody.material.emissiveIntensity = 0.3;
  }
}

function updateCoins() {
  for (const c of coinMeshes) {
    if (c.collected) continue;
    c.mesh.rotation.y += 0.06;
    c.mesh.position.y += Math.sin(Date.now() * 0.003 + c.mesh.position.x) * 0.003;
    const dx = player.position.x - c.mesh.position.x;
    const dy = player.position.y - c.mesh.position.y;
    const dz = player.position.z - c.mesh.position.z;
    if (dx*dx + dy*dy + dz*dz < 0.8 * 0.8) {
      c.collected = true;
      scene.remove(c.mesh);
      sessionCoins++;
      const total = loadCoins() + 1;
      saveCoins(total);
      updateCoinUI();
      SFX.coin();
    }
  }
}

  document.getElementById('coin-val-ui').textContent = loadCoins();

function updateBgAnimations() {
  const t = Date.now() * 0.001;
  bgObjects.forEach((o, i) => {
    // 수정(OctahedronGeometry) 천천히 회전
    if (o.geometry && o.geometry.type === 'OctahedronGeometry') {
      o.rotation.y += 0.008;
      o.position.y += Math.sin(t + i) * 0.005;
    }
    // 용암 불꽃 위아래 흔들림
    if (o.geometry && o.geometry.type === 'SphereGeometry' && o.material.color && o.material.color.getHex() === 0xff6600) {
      o.position.y += Math.sin(t * 2 + i) * 0.02;
    }
    // 구름 천천히 이동
    if (o.geometry && o.geometry.type === 'SphereGeometry' && o.material.emissive && o.material.emissive.getHex() === 0xccddff) {
      o.position.x += Math.sin(t * 0.1 + i) * 0.01;
    }
  });
}

function updateScoreUI() {
  const live = sessionScore + calcScore();
  document.getElementById('score-val-ui').textContent = live.toLocaleString();
}

// ── 터치 컨트롤 ──
(function setupTouch() {
  const zone   = document.getElementById('joystick-zone');
  const knob   = document.getElementById('joystick-knob');
  const jumpEl = document.getElementById('jump-btn');

  let joyId = null;
  let joyOrigin = { x: 0, y: 0 };
  const DEAD = 10, MAX_R = 52;

  // 조이스틱
  zone.addEventListener('touchstart', e => {
    e.preventDefault();
    const t = e.changedTouches[0];
    joyId = t.identifier;
    const rect = zone.getBoundingClientRect();
    joyOrigin.x = rect.left + rect.width / 2;
    joyOrigin.y = rect.top  + rect.height / 2;
  }, { passive: false });

  zone.addEventListener('touchmove', e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      if (t.identifier !== joyId) continue;
      const dx = t.clientX - joyOrigin.x;
      const dy = t.clientY - joyOrigin.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const clamped = Math.min(dist, MAX_R);
      const angle = Math.atan2(dy, dx);
      knob.style.transform = `translate(calc(-50% + ${Math.cos(angle)*clamped}px), calc(-50% + ${Math.sin(angle)*clamped}px))`;

      if (dist > DEAD) {
        const nx = dx / dist, ny = dy / dist;
        // nx: 좌우, ny: 앞뒤 (-ny = 앞)
        window._touchMove = { x: nx, y: ny };
      } else {
        window._touchMove = null;
      }
    }
  }, { passive: false });

  const endJoy = e => {
    for (const t of e.changedTouches) {
      if (t.identifier === joyId) {
        joyId = null;
        knob.style.transform = 'translate(-50%, -50%)';
        window._touchMove = null;
      }
    }
  };
  zone.addEventListener('touchend', endJoy);
  zone.addEventListener('touchcancel', endJoy);

  // 점프 버튼
  jumpEl.addEventListener('touchstart', e => {
    e.preventDefault();
    keys['Space'] = true;
  }, { passive: false });
  jumpEl.addEventListener('touchend',   e => { keys['Space'] = false; });

  // 카메라 스와이프 (조이스틱·점프 영역 제외한 곳)
  let camId = null, camPrev = { x: 0, y: 0 };
  document.addEventListener('touchstart', e => {
    for (const t of e.changedTouches) {
      if (camId !== null) continue;
      if (zone.contains(e.target) || jumpEl.contains(e.target)) continue;
      camId = t.identifier;
      camPrev = { x: t.clientX, y: t.clientY };
    }
  });
  document.addEventListener('touchmove', e => {
    for (const t of e.changedTouches) {
      if (t.identifier !== camId) continue;
      cameraYaw   -= (t.clientX - camPrev.x) * 0.004;
      cameraPitch -= (t.clientY - camPrev.y) * 0.004;
      cameraPitch = Math.max(-0.8, Math.min(1.0, cameraPitch));
      camPrev = { x: t.clientX, y: t.clientY };
    }
  });
  document.addEventListener('touchend', e => {
    for (const t of e.changedTouches) {
      if (t.identifier === camId) camId = null;
    }
  });
})();

function useCoupon() {
  const id = loadActiveCoupon();
  if (!id || id === 'teleport') return; // 순간이동권은 게임 중 별도 사용
  const owned = loadOwnedCoupons();
  if ((owned[id] || 0) <= 0) return;
  owned[id]--;
  if (owned[id] <= 0) {
    delete owned[id];
    saveActiveCoupon(null);
  }
  saveOwnedCoupons(owned);
}

function getStartStage() {
  const c = loadActiveCoupon();
  if (!c || c === 'teleport') return 1;
  const owned = loadOwnedCoupons();
  if ((owned[c] || 0) <= 0) return 1;
  const coupon = SHOP_COUPONS.find(x => x.id === c);
  return coupon ? coupon.stage : 1;
}

function init() {
  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x0f172a, 0.018);

  camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 300);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  const isMobile = 'ontouchstart' in window;
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobile ? 1.5 : 2));
  renderer.shadowMap.enabled = !isMobile;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;
  document.body.appendChild(renderer.domElement);

  // Lights
  const ambient = new THREE.AmbientLight(0xffffff, 0.5);
  scene.add(ambient);

  const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
  dirLight.position.set(20, 40, 20);
  dirLight.castShadow = true;
  dirLight.shadow.mapSize.set(2048, 2048);
  dirLight.shadow.camera.near = 0.5;
  dirLight.shadow.camera.far = 200;
  dirLight.shadow.camera.left = -80;
  dirLight.shadow.camera.right = 80;
  dirLight.shadow.camera.top = 80;
  dirLight.shadow.camera.bottom = -80;
  scene.add(dirLight);

  const pointLight = new THREE.PointLight(0xa78bfa, 2, 50);
  scene.add(pointLight);
  window._pointLight = pointLight;

  buildStars();
  buildPlayer();
  buildStage(1);

  window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'KeyT' && gameActive) { e.preventDefault(); useTeleportCoupon(); }
    if (e.code === 'KeyG' && gameActive) { e.preventDefault(); useGlasses(); }
    if (e.code === 'KeyM') { e.preventDefault(); gameActive ? openShopDuringGame() : showShop(); }
  });
  window.addEventListener('keyup', e => { keys[e.code] = false; });
  window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  renderer.domElement.addEventListener('mousedown', () => {
    renderer.domElement.requestPointerLock();
  });
  document.addEventListener('mousemove', e => {
    if (document.pointerLockElement === renderer.domElement) {
      cameraYaw -= e.movementX * 0.003;
      cameraPitch -= e.movementY * 0.003;
      cameraPitch = Math.max(-0.8, Math.min(1.0, cameraPitch));
    }
  });
}

function buildStars() {
  const geo = new THREE.BufferGeometry();
  const positions = [];
  for (let i = 0; i < 2000; i++) {
    positions.push((Math.random() - 0.5) * 600, (Math.random() - 0.5) * 600, (Math.random() - 0.5) * 600);
  }
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  const mat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.4, sizeAttenuation: true });
  scene.add(new THREE.Points(geo, mat));
}

function buildPlayer() {
  player = new THREE.Group();

  // Body - 저장된 색상 적용
  const activeId = loadActiveColor();
  const activeCol = SHOP_COLORS.find(c => c.id === activeId) || SHOP_COLORS[0];
  const bodyGeo = new THREE.SphereGeometry(0.55, 20, 20);
  const bodyMat = new THREE.MeshStandardMaterial({
    color: activeCol.color,
    roughness: 0.3,
    metalness: 0.1,
    emissive: activeCol.emissive,
    emissiveIntensity: 0.3,
  });
  playerBody = new THREE.Mesh(bodyGeo, bodyMat);
  playerBody.castShadow = true;
  player.add(playerBody);

  // Eyes
  const eyeGeo = new THREE.SphereGeometry(0.1, 12, 12);
  const eyeMat = new THREE.MeshStandardMaterial({ color: 0x000000 });
  const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
  leftEye.position.set(-0.18, 0.12, 0.46);
  player.add(leftEye);
  const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
  rightEye.position.set(0.18, 0.12, 0.46);
  player.add(rightEye);

  // Eye shine
  const shineGeo = new THREE.SphereGeometry(0.04, 8, 8);
  const shineMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 1 });
  const ls = new THREE.Mesh(shineGeo, shineMat);
  ls.position.set(-0.14, 0.16, 0.5);
  player.add(ls);
  const rs = new THREE.Mesh(shineGeo, shineMat);
  rs.position.set(0.22, 0.16, 0.5);
  player.add(rs);

  // Mouth curve
  const mouthCurve = new THREE.QuadraticBezierCurve3(
    new THREE.Vector3(-0.15, -0.08, 0.5),
    new THREE.Vector3(0, -0.22, 0.52),
    new THREE.Vector3(0.15, -0.08, 0.5)
  );
  const mouthPoints = mouthCurve.getPoints(12);
  const mouthGeo = new THREE.BufferGeometry().setFromPoints(mouthPoints);
  const mouthMat = new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 2 });
  player.add(new THREE.Line(mouthGeo, mouthMat));

  player.position.set(0, 2, 0);
  scene.add(player);
}

let bgObjects = [];

function clearBackground() {
  bgObjects.forEach(o => scene.remove(o));
  bgObjects = [];
}

function addBg(mesh) { scene.add(mesh); bgObjects.push(mesh); }

function buildBackground(stage) {
  clearBackground();
  // 플랫폼이 Z 음방향으로 펼쳐지므로 배경도 그 범위에 분포
  const spread = (fn) => {
    for (let i = 0; i < 28; i++) {
      const side = (Math.random() > 0.5 ? 1 : -1);
      fn(
        side * (18 + Math.random() * 22),           // x
        Math.random() * 80,                          // y (높이)
        -(Math.random() * 160)                       // z (맵 길이 방향)
      );
    }
  };

  if (stage === 1) {
    // ── 초록 숲: 나무 ──
    const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5c3d1e, roughness: 0.9 });
    const leafMat  = new THREE.MeshStandardMaterial({ color: 0x27ae60, roughness: 0.8, emissive: 0x0d3b1e, emissiveIntensity: 0.2 });
    spread((x, y, z) => {
      const h = 4 + Math.random() * 5;
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.5, h, 7), trunkMat);
      trunk.position.set(x, y, z);
      addBg(trunk);
      const leaf = new THREE.Mesh(new THREE.ConeGeometry(2.5 + Math.random(), h * 0.9, 7), leafMat);
      leaf.position.set(x, y + h * 0.8, z);
      addBg(leaf);
    });

  } else if (stage === 2) {
    // ── 파란 하늘: 구름 ──
    const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, emissive: 0xccddff, emissiveIntensity: 0.15 });
    spread((x, y, z) => {
      const baseY = 30 + Math.random() * 50;
      const count = 3 + Math.floor(Math.random() * 4);
      for (let c = 0; c < count; c++) {
        const r = 2 + Math.random() * 2;
        const puff = new THREE.Mesh(new THREE.SphereGeometry(r, 8, 6), cloudMat);
        puff.position.set(x + c * r * 1.2 - count * r * 0.6, baseY + Math.random() * 1.5, z + (Math.random() - 0.5) * 3);
        addBg(puff);
      }
    });
    // 작은 새 (V자 라인)
    for (let b = 0; b < 12; b++) {
      const birdGeo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(-1, 0, 0), new THREE.Vector3(0, 0.4, 0), new THREE.Vector3(1, 0, 0)
      ]);
      const bird = new THREE.Line(birdGeo, new THREE.LineBasicMaterial({ color: 0x1a1a2e }));
      bird.position.set((Math.random() - 0.5) * 80, 30 + Math.random() * 40, -(Math.random() * 160));
      bird.scale.setScalar(0.6 + Math.random() * 0.8);
      addBg(bird);
    }

  } else if (stage === 3) {
    // ── 사막: 선인장 + 모래언덕 ──
    const cactMat  = new THREE.MeshStandardMaterial({ color: 0x4a7c3f, roughness: 0.8 });
    const duneMat  = new THREE.MeshStandardMaterial({ color: 0xc8a96e, roughness: 1 });
    spread((x, y, z) => {
      const h = 3 + Math.random() * 5;
      const body = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.5, h, 7), cactMat);
      body.position.set(x, y, z);
      addBg(body);
      // 팔
      const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.3, h * 0.4, 6), cactMat);
      arm.rotation.z = Math.PI / 2.2;
      arm.position.set(x + 0.9, y + h * 0.35, z);
      addBg(arm);
    });
    // 모래언덕
    for (let d = 0; d < 14; d++) {
      const dune = new THREE.Mesh(new THREE.SphereGeometry(6 + Math.random() * 8, 10, 5), duneMat);
      dune.scale.y = 0.3;
      dune.position.set((Math.random() - 0.5) * 100, -3, -(Math.random() * 160));
      addBg(dune);
    }

  } else if (stage === 4) {
    // ── 마법 왕국: 수정 + 빛기둥 ──
    const crystalColors = [0xc084fc, 0x818cf8, 0xe879f9, 0x67e8f9];
    spread((x, y, z) => {
      const col = crystalColors[Math.floor(Math.random() * crystalColors.length)];
      const mat = new THREE.MeshStandardMaterial({ color: col, emissive: col, emissiveIntensity: 0.5, roughness: 0.1, metalness: 0.3 });
      const h = 3 + Math.random() * 7;
      const crystal = new THREE.Mesh(new THREE.OctahedronGeometry(1 + Math.random() * 1.2), mat);
      crystal.scale.y = h;
      crystal.position.set(x, y, z);
      crystal.rotation.y = Math.random() * Math.PI;
      addBg(crystal);
    });
    // 빛기둥
    for (let p = 0; p < 10; p++) {
      const pillarMat = new THREE.MeshStandardMaterial({ color: 0xe879f9, emissive: 0xe879f9, emissiveIntensity: 0.4, transparent: true, opacity: 0.18 });
      const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 80, 8), pillarMat);
      pillar.position.set((Math.random() - 0.5) * 80, 20, -(Math.random() * 160));
      addBg(pillar);
    }

  } else if (stage === 5) {
    // ── 용암 지옥: 용암기둥 + 불기둥 ──
    const lavaMat  = new THREE.MeshStandardMaterial({ color: 0xff4500, emissive: 0xff2200, emissiveIntensity: 0.8, roughness: 0.4 });
    const darkMat  = new THREE.MeshStandardMaterial({ color: 0x1a0000, roughness: 1 });
    spread((x, y, z) => {
      const h = 5 + Math.random() * 15;
      const pillar = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.8, h, 7), darkMat);
      pillar.position.set(x, y - 10, z);
      addBg(pillar);
      const top = new THREE.Mesh(new THREE.SphereGeometry(1.5, 8, 6), lavaMat);
      top.position.set(x, y - 10 + h / 2, z);
      addBg(top);
    });
    for (let f = 0; f < 40; f++) {
      const fireMat = new THREE.MeshBasicMaterial({ color: f % 2 === 0 ? 0xff6600 : 0xffcc00 });
      const fire = new THREE.Mesh(new THREE.SphereGeometry(0.3 + Math.random() * 0.4, 5, 4), fireMat);
      fire.position.set((Math.random() - 0.5) * 80, Math.random() * 40, -(Math.random() * 160));
      addBg(fire);
    }

  } else if (stage === 6) {
    // ── 얼음 동굴: 고드름 + 얼음 결정 ──
    const iceMat = new THREE.MeshStandardMaterial({ color: 0xaee8f8, emissive: 0x00a8cc, emissiveIntensity: 0.3, roughness: 0.1, metalness: 0.4, transparent: true, opacity: 0.85 });
    const stalMat = new THREE.MeshStandardMaterial({ color: 0xdff4ff, roughness: 0.2, metalness: 0.1 });
    spread((x, y, z) => {
      // 고드름 (아래로 뾰족한 원뿔)
      const h = 3 + Math.random() * 7;
      const icicle = new THREE.Mesh(new THREE.ConeGeometry(0.4 + Math.random() * 0.3, h, 6), stalMat);
      icicle.rotation.z = Math.PI; // 아래 방향
      icicle.position.set(x, y + 20, z);
      addBg(icicle);
    });
    // 얼음 결정 기둥
    for (let c = 0; c < 20; c++) {
      const h = 4 + Math.random() * 10;
      const crystal = new THREE.Mesh(new THREE.OctahedronGeometry(0.8 + Math.random() * 0.6), iceMat);
      crystal.scale.y = h;
      crystal.position.set((Math.random() - 0.5) * 80, Math.random() * 40, -(Math.random() * 160));
      crystal.rotation.y = Math.random() * Math.PI;
      addBg(crystal);
    }
    // 눈 입자
    for (let s = 0; s < 60; s++) {
      const snowMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      const snow = new THREE.Mesh(new THREE.SphereGeometry(0.08 + Math.random() * 0.08, 4, 4), snowMat);
      snow.position.set((Math.random() - 0.5) * 80, Math.random() * 60, -(Math.random() * 160));
      addBg(snow);
    }

  } else if (stage === 7) {
    // ── 우주 정거장: 행성 + 소행성 ──
    const planetColors = [0x6366f1, 0xf59e0b, 0x10b981, 0xef4444, 0xa78bfa];
    for (let p = 0; p < 6; p++) {
      const col = planetColors[p % planetColors.length];
      const planetMat = new THREE.MeshStandardMaterial({ color: col, roughness: 0.7 });
      const r = 4 + Math.random() * 8;
      const planet = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), planetMat);
      planet.position.set((Math.random() - 0.5) * 120, 20 + Math.random() * 60, -(Math.random() * 200));
      addBg(planet);
      // 링
      if (Math.random() > 0.5) {
        const ringMat = new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.35, side: THREE.DoubleSide });
        const ring = new THREE.Mesh(new THREE.RingGeometry(r * 1.4, r * 2.2, 32), ringMat);
        ring.rotation.x = Math.PI / 3;
        ring.position.copy(planet.position);
        addBg(ring);
      }
    }
    // 소행성 군집
    const rockMat = new THREE.MeshStandardMaterial({ color: 0x6b7280, roughness: 1 });
    spread((x, y, z) => {
      const rock = new THREE.Mesh(new THREE.IcosahedronGeometry(0.5 + Math.random() * 1.2, 0), rockMat);
      rock.position.set(x, y, z);
      rock.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
      addBg(rock);
    });

  } else if (stage === 8) {
    // ── 심해: 해파리 + 해초 + 기포 ──
    const jellyColors = [0xff69b4, 0x00e5ff, 0x7c3aed, 0x10b981];
    spread((x, y, z) => {
      const col = jellyColors[Math.floor(Math.random() * jellyColors.length)];
      const jellyMat = new THREE.MeshStandardMaterial({ color: col, emissive: col, emissiveIntensity: 0.4, transparent: true, opacity: 0.6 });
      const body = new THREE.Mesh(new THREE.SphereGeometry(1.2 + Math.random(), 10, 8), jellyMat);
      body.scale.y = 0.6;
      body.position.set(x, y, z);
      addBg(body);
    });
    // 해초
    const seaweedMat = new THREE.MeshStandardMaterial({ color: 0x065f46, roughness: 0.9 });
    for (let w = 0; w < 30; w++) {
      const h = 5 + Math.random() * 12;
      const weed = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.25, h, 5), seaweedMat);
      weed.rotation.z = (Math.random() - 0.5) * 0.4;
      weed.position.set((Math.random() - 0.5) * 80, -5, -(Math.random() * 160));
      addBg(weed);
    }
    // 기포
    const bubbleMat = new THREE.MeshStandardMaterial({ color: 0x7dd3fc, transparent: true, opacity: 0.3, roughness: 0, metalness: 0.5 });
    for (let b = 0; b < 50; b++) {
      const bubble = new THREE.Mesh(new THREE.SphereGeometry(0.1 + Math.random() * 0.3, 8, 6), bubbleMat);
      bubble.position.set((Math.random() - 0.5) * 80, Math.random() * 60, -(Math.random() * 160));
      addBg(bubble);
    }

  } else if (stage === 9) {
    // ── 천상: 황금 기둥 + 구름 + 후광 ──
    const goldMat = new THREE.MeshStandardMaterial({ color: 0xffd700, emissive: 0xff8c00, emissiveIntensity: 0.5, roughness: 0.1, metalness: 0.9 });
    const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, emissive: 0xfffacd, emissiveIntensity: 0.3 });
    // 황금 기둥
    for (let c = 0; c < 16; c++) {
      const h = 10 + Math.random() * 20;
      const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.8, h, 8), goldMat);
      pillar.position.set((Math.random() - 0.5) * 80, Math.random() * 30, -(Math.random() * 160));
      addBg(pillar);
      const cap = new THREE.Mesh(new THREE.SphereGeometry(1.1, 10, 8), goldMat);
      cap.position.set(pillar.position.x, pillar.position.y + h / 2, pillar.position.z);
      addBg(cap);
    }
    // 구름
    spread((x, y, z) => {
      const baseY = 20 + Math.random() * 50;
      for (let c = 0; c < 5; c++) {
        const r = 2.5 + Math.random() * 2;
        const puff = new THREE.Mesh(new THREE.SphereGeometry(r, 8, 6), cloudMat);
        puff.position.set(x + c * r * 1.1, baseY + Math.random() * 2, z);
        addBg(puff);
      }
    });
    // 빛 후광
    for (let h = 0; h < 8; h++) {
      const haloMat = new THREE.MeshBasicMaterial({ color: 0xffff99, transparent: true, opacity: 0.12, side: THREE.DoubleSide });
      const halo = new THREE.Mesh(new THREE.RingGeometry(5, 7, 32), haloMat);
      halo.rotation.x = Math.PI / 2;
      halo.position.set((Math.random() - 0.5) * 80, 30 + Math.random() * 40, -(Math.random() * 160));
      addBg(halo);
    }

  } else if (stage === 10) {
    // ── 혼돈: 파편 + 에너지 구체 + 균열 ──
    const chaosColors = [0xff00ff, 0x00ffff, 0xff4500, 0x7c3aed, 0xffd700];
    spread((x, y, z) => {
      const col = chaosColors[Math.floor(Math.random() * chaosColors.length)];
      const mat = new THREE.MeshStandardMaterial({ color: col, emissive: col, emissiveIntensity: 0.8, roughness: 0.1 });
      const orb = new THREE.Mesh(new THREE.SphereGeometry(0.8 + Math.random() * 1.5, 8, 6), mat);
      orb.position.set(x, y, z);
      addBg(orb);
    });
    // 파편들
    const shardMat = new THREE.MeshStandardMaterial({ color: 0x1e1b4b, roughness: 0.8 });
    for (let s = 0; s < 40; s++) {
      const shard = new THREE.Mesh(new THREE.TetrahedronGeometry(0.5 + Math.random() * 1.5), shardMat);
      shard.rotation.set(Math.random() * Math.PI * 2, Math.random() * Math.PI * 2, Math.random() * Math.PI * 2);
      shard.position.set((Math.random() - 0.5) * 80, Math.random() * 60, -(Math.random() * 160));
      addBg(shard);
    }
    // 균열 라인
    for (let l = 0; l < 15; l++) {
      const col = chaosColors[l % chaosColors.length];
      const lineMat = new THREE.LineBasicMaterial({ color: col });
      const pts = [];
      let lx = (Math.random() - 0.5) * 60, ly = Math.random() * 50, lz = -(Math.random() * 160);
      for (let p = 0; p < 6; p++) {
        pts.push(new THREE.Vector3(lx, ly, lz));
        lx += (Math.random() - 0.5) * 6;
        ly += (Math.random() - 0.5) * 6;
      }
      const lineGeo = new THREE.BufferGeometry().setFromPoints(pts);
      addBg(new THREE.Line(lineGeo, lineMat));
    }
  }
}

// ─────────────────────────────────────────────
// STAGE BUILDER
// ─────────────────────────────────────────────
function clearStage() {
  platforms.forEach(p => scene.remove(p));
  hazards.forEach(h => scene.remove(h));
  platforms = [];
  hazards = [];
  spikePositions = [];
  poisonSpikePositions = [];
  movingPlatforms = [];
  playerOnMovingPlatform = null;
  poisonActive = false;
  poisonTicksRemaining = 0;
  poisonTickTimer = 0;
  poisonContactCooldown = 0;
  coinMeshes.forEach(c => scene.remove(c.mesh));
  coinMeshes = [];
  potionMeshes.forEach(p => scene.remove(p.group));
  potionMeshes = [];
  particles.forEach(p => scene.remove(p.mesh));
  particles = [];
  if (flagGroup) { scene.remove(flagGroup); flagGroup = null; flagBanner = null; }
  portalBlocks.forEach(b => scene.remove(b));
  portalBlocks = [];
  portalTriggered = false;
  glassesActive = false;
  glassesTimer = 0;
  clearBackground();
}

function buildStage(stage) {
  clearStage();
  const s = stage - 1;
  const palette = STAGE_COLORS[Math.min(s, STAGE_COLORS.length - 1)];

  scene.fog.color.setHex(palette.sky2);
  renderer.setClearColor(palette.sky2);

  const platformCount = 18 + stage * 2;
  const hGap = 2.9 + stage * 0.25 - (stage > 5 ? 0.3 : 0) - (stage >= 7 ? 0.6 : 0);   // 수평 간격 (7단계~는 추가로 좁힘)
  const vStep = 1.2 + stage * 0.1;  // 높이 상승 (완만하게)
  const hazardChance = 0.15 + stage * 0.08;
  const poisonChance = stage >= 4 ? Math.min(0.38, 0.08 * (stage - 1)) : 0;
  const platformMinSize = Math.max(2.8, 4.8 - stage * 0.25);

  // Start platform
  addPlatform(0, 0, 0, 6, 0.5, 6, palette.platform, false);

  // Z축 방향(앞쪽)으로 주로 전진, 좌우는 약간만 흔들림
  let x = 0, y = 0, z = 0;
  let prevX = 0, prevY = 0, prevZ = 0;
  for (let i = 0; i < platformCount; i++) {
    prevX = x; prevY = y; prevZ = z;
    const lateralJitter = (Math.random() - 0.5) * hGap * 0.8;
    x += lateralJitter;
    z -= hGap * (0.8 + Math.random() * 0.4); // Z 음방향으로 전진
    y += vStep * (0.5 + Math.random() * 0.5);

    const w = platformMinSize + Math.random() * 1.5;
    const d = platformMinSize + Math.random() * 1.5;
    const isHazard = Math.random() < hazardChance && i > 2;
    const isPoisonHazard = !isHazard && stage >= 4 && Math.random() < poisonChance && i > 2;
    addPlatform(x, y, z, w, 0.4, d, palette.platform, isHazard, false, isPoisonHazard);
  }

  // Goal platform at top
  const goalY = y + vStep * 2;
  preFinalPlatformPos.set(prevX, prevY + 0.75, prevZ); // 순간이동 목적지: 골 2칸 전 블록
  goalPlatformPos.set(x, goalY, z);
  if (stage === 10) {
    addPlatform(x, goalY, z, 8, 0.5, 8, 0xffd700, false, false);
    buildFlag(x, goalY + 0.25, z);
  } else {
    addPlatform(x, goalY, z, 6, 0.5, 6, 0xffd700, false, true);
  }

  buildCoins();
  if (stage >= 6) {
    buildPotion(0.25);
    buildPotion(0.5);
    buildPotion(0.75);
  } else {
    buildPotion(0.5);
  }
  buildMovingPlatforms(stage);
  buildBackground(stage);
  if (stage === 1) buildSecretBlocks();
  updateStageUI(stage, palette);
}

function buildCoins() {
  const coinGeo  = new THREE.CylinderGeometry(0.28, 0.28, 0.12, 16);
  const coinMat  = new THREE.MeshStandardMaterial({
    color: 0xffd700, emissive: 0xffa500, emissiveIntensity: 0.6,
    roughness: 0.2, metalness: 0.8,
  });
  // 플랫폼 중 일반 플랫폼(가시 없는 큰 것)마다 일부에 코인 배치
  const eligible = platforms.filter(p => p.userData.w && p.userData.w > 2 && !p.userData.isGoal);
  eligible.forEach((plat, i) => {
    if (i % 3 !== 1) return; // 3개 중 1개에만 배치
    const mesh = new THREE.Mesh(coinGeo, coinMat);
    mesh.position.set(
      plat.position.x + (Math.random() - 0.5) * (plat.userData.w * 0.4),
      plat.position.y + plat.userData.h / 2 + 0.5,
      plat.position.z + (Math.random() - 0.5) * (plat.userData.d * 0.4)
    );
    mesh.castShadow = false;
    scene.add(mesh);
    coinMeshes.push({ mesh, collected: false });
  });
}

function buildPotion(fraction = 0.5) {
  const eligible = platforms.filter(p => p.userData.w && p.userData.w >= 2 && !p.userData.isGoal && !p.userData.isHazard && !p.userData.isPoisonHazard);
  if (!eligible.length) return;
  const plat = eligible[Math.floor(eligible.length * fraction)];

  const group = new THREE.Group();

  // 병 몸통 (초록 유리병 느낌)
  const bottleMat = new THREE.MeshStandardMaterial({
    color: 0x22c55e, emissive: 0x16a34a, emissiveIntensity: 0.7,
    roughness: 0.1, metalness: 0.1, transparent: true, opacity: 0.85,
  });
  const bottle = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.28, 0.55, 10), bottleMat);
  bottle.position.set(0, 0.28, 0);
  group.add(bottle);

  // 병 목
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.18, 0.22, 8), bottleMat);
  neck.position.set(0, 0.66, 0);
  group.add(neck);

  // 코르크 마개
  const corkMat = new THREE.MeshStandardMaterial({ color: 0x92400e, roughness: 0.9 });
  const cork = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.12, 8), corkMat);
  cork.position.set(0, 0.83, 0);
  group.add(cork);

  // 내부 빛 (하트 느낌의 발광 구)
  const glowMat = new THREE.MeshBasicMaterial({ color: 0x86efac, transparent: true, opacity: 0.6 });
  const glow = new THREE.Mesh(new THREE.SphereGeometry(0.16, 10, 8), glowMat);
  glow.position.set(0, 0.25, 0);
  group.add(glow);

  // 십자(+) 표시 — 두 개의 얇은 박스
  const crossMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const barH = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.06, 0.04), crossMat);
  barH.position.set(0, 0.28, 0.3);
  group.add(barH);
  const barV = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.3, 0.04), crossMat);
  barV.position.set(0, 0.28, 0.3);
  group.add(barV);

  group.position.set(
    plat.position.x,
    plat.position.y + plat.userData.h / 2 + 0.05,
    plat.position.z
  );
  scene.add(group);
  potionMeshes.push({ group, collected: false });
}

function buildMovingPlatforms(stage) {
  const count = stage >= 5 ? Math.min(2, stage - 4) : 0;
  if (count === 0) return;

  const eligible = platforms.filter(p =>
    p.userData.w && p.userData.w >= 2 &&
    !p.userData.isGoal && !p.userData.isHazard &&
    !p.userData.isPoisonHazard && !p.userData.isSpinning
  );
  if (eligible.length < 3) return;

  for (let i = 0; i < count; i++) {
    const fraction = (i + 1) / (count + 1);
    const plat = eligible[Math.floor(fraction * eligible.length)];
    const speed = 0.016 + i * 0.003;

    // 기존 플랫폼을 눈에 띄는 색으로 바꾸고 회전 표시
    plat.material = new THREE.MeshStandardMaterial({
      color: 0x00ccff, emissive: 0x0077cc, emissiveIntensity: 0.5,
      roughness: 0.3, metalness: 0.3,
    });
    plat.userData.isSpinning = true;

    movingPlatforms.push({ mesh: plat, speed, angle: Math.random() * Math.PI * 2 });
  }
}

function updateMovingPlatforms() {
  for (const mp of movingPlatforms) {
    mp.angle += mp.speed;
    mp.mesh.rotation.z = mp.angle; // Z축 기준 위→아래 회전
  }
}

function buildSecretBlocks() {
  portalTriggered = false;
  // 시작 플랫폼(x=3 끝) 옆으로 5개 숨겨진 블록
  // 1~4번: 일반 발판, 5번째: 포탈 트리거
  const geo = new THREE.BoxGeometry(2, 0.5, 2);
  const mat = new THREE.MeshStandardMaterial({ transparent: true, opacity: 0 });
  const xPositions = [5, 8, 11, 14, 17];
  xPositions.forEach((x, i) => {
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x, 0, 0);
    mesh.visible = false;
    mesh.userData = { w: 2, h: 0.5, d: 2, isHazard: false, isGoal: false, isPortal: i === 4 };
    scene.add(mesh);
    platforms.push(mesh);
    portalBlocks.push(mesh);
  });
}

function updatePotions() {
  const t = Date.now() * 0.002;
  for (const p of potionMeshes) {
    if (p.collected) continue;
    // 위아래 둥실 + 회전
    p.group.position.y += Math.sin(t + p.group.position.x) * 0.004;
    p.group.rotation.y += 0.02;

    const dx = player.position.x - p.group.position.x;
    const dy = player.position.y - p.group.position.y;
    const dz = player.position.z - p.group.position.z;
    if (dx*dx + dy*dy + dz*dz < 1.0 * 1.0) {
      p.collected = true;
      scene.remove(p.group);
      hp = Math.min(maxHp, hp + 30);
      updateHpBar();
      SFX.heal();
      spawnHealParticles(p.group.position.clone());
    }
  }
}

function spawnHealParticles(pos) {
  for (let i = 0; i < 12; i++) {
    const geo = new THREE.SphereGeometry(0.07, 6, 6);
    const mat = new THREE.MeshBasicMaterial({ color: 0x4ade80 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.copy(pos);
    scene.add(mesh);
    particles.push({
      mesh,
      vel: new THREE.Vector3((Math.random() - 0.5) * 0.25, Math.random() * 0.3 + 0.08, (Math.random() - 0.5) * 0.25),
      life: 50,
    });
  }
}

function addPlatform(x, y, z, w, h, d, color, isHazard, isGoal = false, isPoisonHazard = false) {
  const geo = new THREE.BoxGeometry(w, h, d);

  let mat;
  if (isGoal) {
    mat = new THREE.MeshStandardMaterial({
      color: 0xffd700,
      emissive: 0xffa500,
      emissiveIntensity: 0.6,
      roughness: 0.2,
      metalness: 0.5,
    });
  } else {
    mat = new THREE.MeshStandardMaterial({
      color,
      roughness: 0.6,
      metalness: 0.1,
    });
  }

  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.userData = { w, h, d, isHazard, isGoal, isPoisonHazard };
  scene.add(mesh);

  // hazard 블록도 밟을 수 있는 일반 플랫폼처럼 등록 (대미지는 가시로만)
  platforms.push(mesh);

  // 일반 가시 (빨간)
  if (isHazard) {
    const spikeMat = new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0xff2200, emissiveIntensity: 0.8 });
    const spacing = 1.1;
    const cols = Math.max(1, Math.floor(w / spacing));
    const rows = Math.max(1, Math.floor(d / spacing));
    for (let ci = 0; ci < cols; ci++) {
      for (let ri = 0; ri < rows; ri++) {
        const sx = x - w / 2 + (ci + 0.5) * (w / cols);
        const sy = y + h / 2 + 0.225;
        const sz = z - d / 2 + (ri + 0.5) * (d / rows);
        const spikeGeo = new THREE.ConeGeometry(0.15, 0.45, 6);
        const spike = new THREE.Mesh(spikeGeo, spikeMat);
        spike.position.set(sx, sy, sz);
        scene.add(spike);
        platforms.push(spike);
        spikePositions.push(new THREE.Vector3(sx, sy, sz));
      }
    }
  }

  // 독 가시 (초록) — 닿으면 10 즉시 + 초당 3씩 4초 독
  if (isPoisonHazard) {
    const poisonMat = new THREE.MeshStandardMaterial({ color: 0x44ff44, emissive: 0x00cc22, emissiveIntensity: 1.0 });
    const spacing = 1.1;
    const cols = Math.max(1, Math.floor(w / spacing));
    const rows = Math.max(1, Math.floor(d / spacing));
    for (let ci = 0; ci < cols; ci++) {
      for (let ri = 0; ri < rows; ri++) {
        const sx = x - w / 2 + (ci + 0.5) * (w / cols);
        const sy = y + h / 2 + 0.225;
        const sz = z - d / 2 + (ri + 0.5) * (d / rows);
        const spikeGeo = new THREE.ConeGeometry(0.15, 0.45, 6);
        const spike = new THREE.Mesh(spikeGeo, poisonMat);
        spike.position.set(sx, sy, sz);
        scene.add(spike);
        platforms.push(spike);
        poisonSpikePositions.push(new THREE.Vector3(sx, sy, sz));
      }
    }
  }
}

function updateStageUI(stage, palette) {
  document.getElementById('stage-text').textContent = `STAGE ${stage}`;
  document.getElementById('stage-sub').textContent = `난이도: ${palette.diff}`;
}

function buildFlag(x, y, z) {
  flagGroup = new THREE.Group();
  flagBasePos.set(x, y, z);

  // 기둥
  const poleMat = new THREE.MeshStandardMaterial({ color: 0xd1d5db, metalness: 0.8, roughness: 0.2 });
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.12, 8, 8), poleMat);
  pole.position.set(0, 4, 0);
  flagGroup.add(pole);

  // 깃발 천
  const bannerMat = new THREE.MeshStandardMaterial({
    color: 0xff1111, emissive: 0xff0000, emissiveIntensity: 0.4, roughness: 0.7, side: THREE.DoubleSide,
  });
  flagBanner = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 1.4), bannerMat);
  flagBanner.position.set(1.2, 7.3, 0);
  flagGroup.add(flagBanner);

  // 깃발에 흰 별 데칼 (작은 원 두 개로 눈 모양 대신 별 느낌)
  const starDeco = new THREE.Mesh(
    new THREE.CircleGeometry(0.35, 5),
    new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide })
  );
  starDeco.position.set(1.2, 7.3, 0.01);
  flagGroup.add(starDeco);

  // 꼭대기 구슬
  const ballMat = new THREE.MeshStandardMaterial({ color: 0xffd700, emissive: 0xffaa00, emissiveIntensity: 1.0, metalness: 0.7, roughness: 0.1 });
  const ball = new THREE.Mesh(new THREE.SphereGeometry(0.28, 12, 10), ballMat);
  ball.position.set(0, 8.2, 0);
  flagGroup.add(ball);

  // 발광 후광 (바닥)
  const glowMat = new THREE.MeshBasicMaterial({ color: 0xffd700, transparent: true, opacity: 0.18, side: THREE.DoubleSide });
  const glow = new THREE.Mesh(new THREE.RingGeometry(1.2, 2.2, 32), glowMat);
  glow.rotation.x = -Math.PI / 2;
  glow.position.set(0, 0.05, 0);
  flagGroup.add(glow);

  flagGroup.position.set(x, y, z);
  scene.add(flagGroup);
}

// ─────────────────────────────────────────────
// GAME LOOP
// ─────────────────────────────────────────────
function startGame() {
  document.getElementById('overlay').style.display = 'none';
  document.getElementById('score-ui').style.display = 'block';
  document.getElementById('coin-ui').style.display = 'block';
  document.getElementById('shop-hud-btn').style.display = 'block';
  updateCoinUI();
  updateGlassesUI();
  gameActive = true;
  currentStage = getStartStage();
  useCoupon();
  sessionScore = 0;
  sessionCoins = 0;
  spikeDamageTimer = 0;
  poisonActive = false;
  poisonTicksRemaining = 0;
  poisonTickTimer = 0;
  poisonContactCooldown = 0;
  hp = maxHp;
  updateHpBar();
  buildStage(currentStage);
  applyCharacterColor(loadActiveColor());
  updateTeleportUI();
  player.position.set(0, 2, 0);
  velocity.set(0, 0, 0);
  stageStartTime = Date.now();
  // 데스크탑에서만 포인터 락 (모바일은 미지원)
  if (!('ontouchstart' in window)) renderer.domElement.requestPointerLock();
  if (!animating) { animating = true; animate(); }
}
window.startGame = startGame;

function showLevelBanner(stage, palette) {
  const banner = document.getElementById('level-banner');
  document.getElementById('level-banner-title').textContent = `🎉 STAGE ${stage}`;
  document.getElementById('level-banner-title').style.color = `#${palette.platform.toString(16).padStart(6, '0')}`;
  document.getElementById('level-banner-sub').textContent = `${palette.name} — ${palette.diff}`;
  banner.style.display = 'block';
  setTimeout(() => { banner.style.display = 'none'; }, 2200);
}

function animate() {
  requestAnimationFrame(animate);
  if (!gameActive) return;

  dittoWobble += 0.08;
  playerBody.scale.y = 1 + Math.sin(dittoWobble) * 0.04;
  playerBody.scale.x = 1 - Math.sin(dittoWobble) * 0.02;

  // 레인보우 색상 순환
  if (loadActiveColor() === 'rainbow') {
    const hue = (Date.now() * 0.1) % 360;
    playerBody.material.color.setHSL(hue / 360, 1, 0.55);
    playerBody.material.emissive.setHSL(hue / 360, 1, 0.2);
  }
  if (loadActiveColor() === 'ghost') {
    playerBody.material.opacity = 0.07 + Math.abs(Math.sin(Date.now() * 0.002)) * 0.1;
  }

  updatePlayer();
  updateMovingPlatforms();
  updateCoins();
  updatePotions();
  updateBgAnimations();
  updateParticles();
  updateCamera();
  updateScoreUI();

  // 안경 타이머
  if (glassesActive) {
    glassesTimer--;
    const el = document.getElementById('glasses-ui');
    if (glassesTimer <= 0) {
      portalBlocks.forEach(b => { b.visible = false; b.material.opacity = 0; });
      glassesActive = false;
      updateGlassesUI();
    } else if (el) {
      el.textContent = `🥽 ${Math.ceil(glassesTimer / 60)}s`;
    }
  }

  // 깃발 애니메이션
  if (flagGroup) {
    const t = Date.now() * 0.003;
    if (flagBanner) flagBanner.rotation.y = Math.sin(t * 1.8) * 0.35;
    // 꼭대기 구슬 발광 맥동
    const ball = flagGroup.children.find(c => c.geometry && c.geometry.type === 'SphereGeometry');
    if (ball) ball.material.emissiveIntensity = 0.6 + Math.sin(t * 3) * 0.4;
    // 후광 회전
    const ring = flagGroup.children.find(c => c.geometry && c.geometry.type === 'RingGeometry');
    if (ring) ring.rotation.z += 0.01;
  }

  window._pointLight.position.copy(player.position);
  renderer.render(scene, camera);
}

// ─────────────────────────────────────────────
// PLAYER PHYSICS
// ─────────────────────────────────────────────
function updatePlayer() {
  if (invincibleTimer > 0) invincibleTimer--;

  // Input direction in camera space
  const forward = new THREE.Vector3(-Math.sin(cameraYaw), 0, -Math.cos(cameraYaw));
  const right = new THREE.Vector3(Math.cos(cameraYaw), 0, -Math.sin(cameraYaw));

  let move = new THREE.Vector3();
  if (keys['KeyW'] || keys['ArrowUp']) move.add(forward);
  if (keys['KeyS'] || keys['ArrowDown']) move.sub(forward);
  if (keys['KeyA'] || keys['ArrowLeft']) move.sub(right);
  if (keys['KeyD'] || keys['ArrowRight']) move.add(right);
  // 터치 조이스틱
  if (window._touchMove) {
    move.add(forward.clone().multiplyScalar(-window._touchMove.y));
    move.add(right.clone().multiplyScalar(window._touchMove.x));
  }
  if (move.lengthSq() > 0) move.normalize().multiplyScalar(MOVE_SPEED);

  velocity.x = move.x;
  velocity.z = move.z;

  // Gravity
  velocity.y += GRAVITY;

  // Jump
  if ((keys['Space'] || keys['KeyW']) && onGround) {
    velocity.y = JUMP_FORCE;
    onGround = false;
    keys['Space'] = false;
    SFX.jump();
  }

  // Move player
  player.position.add(velocity);

  // Face direction
  if (move.lengthSq() > 0) {
    const angle = Math.atan2(move.x, move.z);
    player.rotation.y = angle;
  }

  // Platform collision
  const wasOnGround = onGround;
  onGround = false;
  playerOnMovingPlatform = null;
  const pBox = new THREE.Box3().setFromCenterAndSize(
    player.position,
    new THREE.Vector3(0.9, 1.0, 0.9)
  );

  for (const plat of platforms) {
    if (!plat.userData.w) continue; // 가시 메시 등 userData 없는 것 스킵
    if (plat.userData.isSpinning) continue; // 회전 플랫폼은 별도 처리
    const { w, h, d } = plat.userData;
    const platBox = new THREE.Box3().setFromCenterAndSize(
      plat.position, new THREE.Vector3(w, h, d)
    );

    if (pBox.intersectsBox(platBox)) {
      const playerBottom = player.position.y - 0.5;
      const platTop = plat.position.y + h / 2;
      const overlapY = platTop - playerBottom;

      if (overlapY > 0 && overlapY < 0.7 && velocity.y <= 0) {
        player.position.y = platTop + 0.5;
        velocity.y = 0;
        onGround = true;
        if (!wasOnGround) SFX.land();
        if (plat.userData.isMoving) {
          playerOnMovingPlatform = movingPlatforms.find(m => m.mesh === plat) || null;
        }

        if (plat.userData.isGoal) {
          nextStage();
          return;
        }
        if (plat.userData.isPortal && !portalTriggered) {
          portalTriggered = true;
          currentStage = 10;
          buildStage(10);
          applyCharacterColor(loadActiveColor());
          updateTeleportUI();
          player.position.set(preFinalPlatformPos.x, preFinalPlatformPos.y, preFinalPlatformPos.z);
          velocity.set(0, 0, 0);
          SFX.stageClear();
          showDamageFlash();
          return;
        }
      }
    }
  }

  // 회전 플랫폼 전용 충돌 — 기울어진 면의 실제 높이를 수학적으로 계산
  for (const plat of platforms) {
    if (!plat.userData.isSpinning) continue;
    const angle = plat.rotation.z;
    const cosA = Math.cos(angle);
    if (Math.abs(cosA) < 0.4) continue; // 너무 가파르면 스킵

    const { w, h, d } = plat.userData;
    const relX = player.position.x - plat.position.x;
    const relZ = player.position.z - plat.position.z;

    // Z 범위 체크
    if (Math.abs(relZ) > d / 2 + 0.45) continue;

    // 플레이어가 플랫폼의 로컬 X 범위 안에 있는지 확인
    const sinA = Math.sin(angle);
    const localX = (relX + h / 2 * sinA) / cosA;
    if (Math.abs(localX) > w / 2 + 0.45) continue;

    // 플레이어 X 위치에서 기울어진 표면의 실제 Y 높이
    const surfaceY = plat.position.y + relX * (sinA / cosA) + h / (2 * cosA);
    const playerBottom = player.position.y - 0.5;
    const overlapY = surfaceY - playerBottom;

    if (overlapY > 0 && overlapY < 0.9 && velocity.y <= 0) {
      player.position.y = surfaceY + 0.5;
      velocity.y = 0;
      onGround = true;
      if (!wasOnGround) SFX.land();
    }
  }

  // 10단계 깃발 충돌 — 깃발에 닿으면 게임 클리어
  if (currentStage === 10 && flagGroup) {
    const dx = player.position.x - flagBasePos.x;
    const dz = player.position.z - flagBasePos.z;
    if (dx * dx + dz * dz < 1.6 * 1.6) {
      nextStage();
      return;
    }
  }

  // Spike collision — 가시 접촉 중 1초(60프레임)마다 독립 틱 대미지
  let onSpike = false;
  for (const sp of spikePositions) {
    const dx = player.position.x - sp.x;
    const dy = player.position.y - sp.y;
    const dz = player.position.z - sp.z;
    if (dx*dx + dy*dy + dz*dz < 0.55 * 0.55) { onSpike = true; break; }
  }
  if (onSpike) {
    spikeDamageTimer++;
    if (spikeDamageTimer >= 30) {
      spikeDamageTimer = 0;
      // invincibleTimer 무시하고 가시 대미지만 별도 처리
      const amount = 15;
      hp = Math.max(0, hp - amount);
      updateHpBar();
      showDamageFlash();
      spawnDamageParticles();
      SFX.damage();
      if (hp <= 0) { gameOver(); return; }
    }
  } else {
    spikeDamageTimer = 0;
  }

  // 독 가시 충돌 — 접촉 시 즉시 10 대미지 + 4초 독 (초당 3)
  let onPoisonSpike = false;
  for (const sp of poisonSpikePositions) {
    const dx = player.position.x - sp.x;
    const dy = player.position.y - sp.y;
    const dz = player.position.z - sp.z;
    if (dx*dx + dy*dy + dz*dz < 0.55 * 0.55) { onPoisonSpike = true; break; }
  }
  if (onPoisonSpike && poisonContactCooldown <= 0) {
    hp = Math.max(0, hp - 10);
    updateHpBar();
    showDamageFlash();
    spawnPoisonParticles();
    SFX.damage();
    poisonActive = true;
    poisonTicksRemaining = 4;
    poisonTickTimer = 60;
    poisonContactCooldown = 90;
    updatePoisonIndicator();
    if (hp <= 0) { gameOver(); return; }
  }
  if (poisonContactCooldown > 0) poisonContactCooldown--;

  // 독 지속 틱 대미지
  if (poisonActive) {
    poisonTickTimer--;
    if (poisonTickTimer <= 0) {
      poisonTickTimer = 60;
      hp = Math.max(0, hp - 3);
      updateHpBar();
      showPoisonFlash();
      spawnPoisonParticles();
      SFX.poison();
      poisonTicksRemaining--;
      if (poisonTicksRemaining <= 0) {
        poisonActive = false;
        updatePoisonIndicator();
      }
      if (hp <= 0) { gameOver(); return; }
    }
  }

  // Fall death
  if (player.position.y < MAX_FALL) {
    SFX.damage();
    takeDamage(30);
    respawn();
  }
}

function respawn() {
  player.position.set(0, 2, 0);
  velocity.set(0, 0, 0);
  poisonActive = false;
  poisonTicksRemaining = 0;
  poisonTickTimer = 0;
  poisonContactCooldown = 0;
  updatePoisonIndicator();
}

function takeDamage(amount) {
  if (invincibleTimer > 0) return;
  hp = Math.max(0, hp - amount);
  invincibleTimer = 60;
  SFX.damage();
  updateHpBar();
  showDamageFlash();
  spawnDamageParticles();
  if (hp <= 0) gameOver();
}

function updateHpBar() {
  const pct = (hp / maxHp) * 100;
  document.getElementById('hp-bar').style.width = pct + '%';
  document.getElementById('hp-text').textContent = `${hp} / ${maxHp}`;
  const r = Math.round(255 * (1 - hp / maxHp));
  const g = Math.round(200 * (hp / maxHp));
  document.getElementById('hp-bar').style.background =
    `linear-gradient(90deg, rgb(${255},${g},0), rgb(${200},${g + 50},0))`;
}

function showDamageFlash() {
  const flash = document.getElementById('damage-flash');
  flash.style.opacity = '1';
  clearTimeout(damageFlashTimeout);
  damageFlashTimeout = setTimeout(() => { flash.style.opacity = '0'; }, 150);
}

function showPoisonFlash() {
  const flash = document.getElementById('poison-flash');
  flash.style.opacity = '1';
  setTimeout(() => { flash.style.opacity = '0'; }, 200);
}

function updatePoisonIndicator() {
  const el = document.getElementById('poison-indicator');
  if (!el) return;
  el.style.display = poisonActive ? 'block' : 'none';
}

function spawnPoisonParticles() {
  for (let i = 0; i < 8; i++) {
    const geo = new THREE.SphereGeometry(0.07, 6, 6);
    const mat = new THREE.MeshBasicMaterial({ color: 0x44ff44 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.copy(player.position);
    scene.add(mesh);
    particles.push({
      mesh,
      vel: new THREE.Vector3((Math.random() - 0.5) * 0.25, Math.random() * 0.25 + 0.05, (Math.random() - 0.5) * 0.25),
      life: 45,
    });
  }
}

function spawnDamageParticles() {
  for (let i = 0; i < 10; i++) {
    const geo = new THREE.SphereGeometry(0.08, 6, 6);
    const mat = new THREE.MeshBasicMaterial({ color: 0xff3333 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.copy(player.position);
    scene.add(mesh);
    particles.push({
      mesh,
      vel: new THREE.Vector3((Math.random() - 0.5) * 0.3, Math.random() * 0.3 + 0.1, (Math.random() - 0.5) * 0.3),
      life: 40
    });
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.vel.y -= 0.01;
    p.mesh.position.add(p.vel);
    p.life--;
    p.mesh.material.opacity = p.life / 40;
    if (p.life <= 0) {
      scene.remove(p.mesh);
      particles.splice(i, 1);
    }
  }
}

function nextStage() {
  sessionScore += calcScore();

  if (currentStage >= 10) {
    gameClear();
    return;
  }

  currentStage++;
  stageStartTime = Date.now();
  const palette = STAGE_COLORS[Math.min(currentStage - 1, STAGE_COLORS.length - 1)];
  SFX.stageClear();
  buildStage(currentStage);
  player.position.set(0, 2, 0);
  velocity.set(0, 0, 0);
  hp = maxHp;
  updateHpBar();
  showLevelBanner(currentStage, palette);
}

async function gameClear() {
  gameActive = false;
  _shopOpenedDuringGame = false;
  document.exitPointerLock();
  document.getElementById('score-ui').style.display = 'none';
  document.getElementById('coin-ui').style.display = 'none';
  document.getElementById('shop-hud-btn').style.display = 'none';
  document.getElementById('teleport-ui').style.display = 'none';
  document.getElementById('glasses-ui').style.display = 'none';
  SFX.gameClear();
  saveCoins(loadCoins() + 15);
  const finalScore = sessionScore;
  const rankings = await addRanking(playerName, finalScore, 10);
  const myIdx = rankings.daily.findIndex(r => r.name === playerName && r.score === finalScore);
  const overlay = document.getElementById('overlay');
  overlay.style.display = 'flex';
  overlay.innerHTML = `
    <div class="panel">
      <h2 style="color:#ffd700">🎉 게임 클리어! 🎉</h2>
      <p class="sub">모든 10단계를 완주했습니다! · ${playerName}</p>
      <div style="background:rgba(245,158,11,0.15);border:1px solid #f59e0b;border-radius:8px;padding:8px 12px;color:#fcd34d;font-size:14px;font-weight:bold;text-align:center;margin-bottom:12px">🎁 완주 보상 +15 코인 획득!</div>
      <div id="score-display">
        <div class="score-big">${finalScore.toLocaleString()}</div>
        <div class="score-breakdown">최종 점수</div>
      </div>
      ${myIdx >= 0 ? `<div style="color:#ffd700;text-align:center;margin-bottom:14px;font-size:14px">🏆 ${myIdx+1}위 등록!</div>` : ''}
      <div style="margin-bottom:18px">
        ${rankTabsHtml(rankings.daily, rankings.weekly, rankings.monthly, playerName)}
      </div>
      <button class="btn btn-purple" onclick="onClickRestart()">다시 도전</button>
      <button class="btn btn-gray" onclick="onClickChangeName()">이름 변경</button>
    </div>`;
}

async function gameOver() {
  gameActive = false;
  document.exitPointerLock();
  document.getElementById('score-ui').style.display = 'none';
  document.getElementById('coin-ui').style.display = 'none';
  document.getElementById('shop-hud-btn').style.display = 'none';
  document.getElementById('teleport-ui').style.display = 'none';
  document.getElementById('glasses-ui').style.display = 'none';
  _shopOpenedDuringGame = false;
  SFX.gameOver();
  const finalScore = sessionScore + calcScore();
  const rankings = await addRanking(playerName, finalScore, currentStage);
  showGameOverScreen(finalScore, rankings);
}

// ─────────────────────────────────────────────
// CAMERA
// ─────────────────────────────────────────────
function updateCamera() {
  const dist = 9;
  const cx = player.position.x + Math.sin(cameraYaw) * Math.cos(cameraPitch) * dist;
  const cy = player.position.y + Math.sin(cameraPitch) * dist + 1;
  const cz = player.position.z + Math.cos(cameraYaw) * Math.cos(cameraPitch) * dist;
  camera.position.lerp(new THREE.Vector3(cx, cy, cz), 0.12);
  camera.lookAt(player.position.x, player.position.y + 0.5, player.position.z);
}

init();
showTitleScreen();
