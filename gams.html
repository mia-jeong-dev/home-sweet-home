<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>💳 감스</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    /* ── Three-column wrapper ── */
    #layout {
      display: flex;
      width: 100%;
      max-width: 1200px;
      align-items: flex-start;
      justify-content: center;
      gap: 28px;
      padding: 0 16px;
    }

    /* ── Side panels ── */
    .side-panel {
      display: none;
      width: 200px;
      flex-shrink: 0;
      padding-top: 36px;
      position: sticky;
      top: 36px;
    }

    @media (min-width: 780px) {
      #right-panel { display: block; }
    }
    @media (min-width: 1080px) {
      #left-panel { display: block; }
    }

    /* ── Left stats panel ── */
    .stat-block {
      background: rgba(255,255,255,0.04);
      border: 1px solid #1e293b;
      border-radius: 14px;
      padding: 16px 18px;
      margin-bottom: 12px;
    }
    .stat-block h3 {
      font-size: 11px;
      font-weight: 600;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 10px;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      padding: 4px 0;
      border-bottom: 1px solid #1e293b;
    }
    .stat-row:last-child { border-bottom: none; }
    .stat-row .label { color: #64748b; }
    .stat-row .val { font-weight: 700; }
    .stat-row .val.pos { color: #34d399; }
    .stat-row .val.neg { color: #f87171; }
    .stat-row .val.neu { color: #94a3b8; }

    /* ── Right potato panel ── */
    #right-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .potato-label {
      font-size: 13px;
      color: #64748b;
      font-weight: 600;
      text-align: center;
      line-height: 1.5;
    }
    .potato-label span {
      display: block;
      color: #94a3b8;
      font-size: 11px;
      font-weight: 400;
    }

    /* ── Main app ── */
    #app {
      width: 100%;
      max-width: 440px;
      flex-shrink: 0;
      padding-bottom: 40px;
    }

    /* ── Header ── */
    .top-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 20px 20px 12px;
      border-bottom: 1px solid #1e293b;
      margin-bottom: 4px;
    }
    .top-bar h1 {
      font-size: 22px;
      font-weight: 800;
      background: linear-gradient(135deg, #22d3ee, #67e8f9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .top-bar .sub { font-size: 12px; color: #64748b; margin-left: auto; }
    .back-btn {
      background: none; border: none; color: #94a3b8;
      font-size: 20px; cursor: pointer; padding: 2px 6px;
      border-radius: 6px; line-height: 1;
    }
    .back-btn:hover { background: rgba(255,255,255,0.07); }

    /* ── Screens ── */
    .screen { display: none; padding: 16px 20px; }
    .screen.active { display: block; }

    /* ── People list ── */
    .people-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
    .person-card {
      cursor: pointer;
      background: rgba(34,211,238,0.06);
      border: 1px solid #164e63;
      border-radius: 14px;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.15s, border-color 0.15s;
    }
    .person-card:hover { background: rgba(34,211,238,0.12); border-color: #0e7490; }
    .person-card .name { font-size: 16px; font-weight: 700; color: #e2e8f0; }
    .person-card .bal { font-size: 15px; font-weight: 700; }
    .bal.pos { color: #34d399; }
    .bal.neg { color: #f87171; }
    .empty-hint { text-align: center; color: #475569; font-size: 14px; padding: 40px 0; }

    /* ── Buttons ── */
    .btn-primary {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg, #0891b2, #22d3ee);
      border: none; border-radius: 12px;
      color: #fff; font-size: 15px; font-weight: 700;
      cursor: pointer; margin-bottom: 10px; transition: opacity 0.15s;
    }
    .btn-primary:hover { opacity: 0.88; }
    .btn-secondary {
      width: 100%; padding: 12px;
      background: rgba(255,255,255,0.06);
      border: 1px solid #334155; border-radius: 12px;
      color: #94a3b8; font-size: 14px; cursor: pointer; margin-bottom: 8px;
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.10); }
    .btn-danger {
      width: 100%; padding: 12px;
      background: rgba(239,68,68,0.10);
      border: 1px solid #7f1d1d; border-radius: 12px;
      color: #f87171; font-size: 14px; cursor: pointer; margin-bottom: 8px;
    }
    .btn-danger:hover { background: rgba(239,68,68,0.18); }

    /* ── Input ── */
    .field-label { font-size: 12px; color: #64748b; margin-bottom: 6px; }
    input[type="text"], input[type="number"], input[type="password"] {
      width: 100%; padding: 12px 14px;
      background: rgba(255,255,255,0.06);
      border: 1px solid #334155; border-radius: 10px;
      color: #e2e8f0; font-size: 15px; outline: none; margin-bottom: 14px;
    }
    input:focus { border-color: #22d3ee; }
    input::placeholder { color: #475569; }

    /* ── Section title ── */
    .section-title {
      font-size: 13px; font-weight: 600; color: #22d3ee;
      text-transform: uppercase; letter-spacing: 0.08em; margin: 18px 0 10px;
    }

    /* ── Transaction list ── */
    .tx-list { display: flex; flex-direction: column; }
    .tx-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 11px 2px; border-bottom: 1px solid #1e293b;
    }
    .tx-row:last-child { border-bottom: none; }
    .tx-left { display: flex; flex-direction: column; gap: 2px; }
    .tx-type { font-size: 13px; font-weight: 600; }
    .tx-type.in { color: #34d399; }
    .tx-type.out { color: #f87171; }
    .tx-memo { font-size: 12px; color: #475569; }
    .tx-right { text-align: right; }
    .tx-amount { font-size: 14px; font-weight: 700; }
    .tx-amount.in { color: #34d399; }
    .tx-amount.out { color: #f87171; }
    .tx-date { font-size: 11px; color: #475569; margin-top: 2px; }

    /* ── Type toggle ── */
    .type-toggle { display: flex; gap: 8px; margin-bottom: 14px; }
    .type-btn {
      flex: 1; padding: 11px; border: 2px solid transparent;
      border-radius: 10px; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: all 0.15s;
    }
    .type-btn.out-active  { background: #ef4444; color: #fff; }
    .type-btn.out-inactive { background: rgba(239,68,68,0.10); color: #94a3b8; }
    .type-btn.in-active   { background: #10b981; color: #fff; }
    .type-btn.in-inactive  { background: rgba(52,211,153,0.10); color: #94a3b8; }

    /* ── Error ── */
    .err-msg { color: #ef4444; font-size: 12px; text-align: center; min-height: 18px; margin-bottom: 10px; }

    input#pw-input { text-align: center; letter-spacing: 8px; font-size: 22px; }

    /* ── Confirm dialog ── */
    .confirm-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.6);
      align-items: center; justify-content: center; z-index: 100;
    }
    .confirm-overlay.show { display: flex; }
    .confirm-box {
      background: #1e293b; border: 1px solid #334155;
      border-radius: 16px; padding: 24px 24px 18px;
      max-width: 300px; width: 88%; text-align: center;
    }
    .confirm-box h3 { font-size: 16px; margin-bottom: 8px; }
    .confirm-box p { font-size: 13px; color: #64748b; margin-bottom: 18px; }
    .confirm-actions { display: flex; gap: 8px; }
    .confirm-actions button { flex: 1; padding: 10px; border-radius: 8px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; }
    .confirm-cancel { background: rgba(255,255,255,0.07); color: #94a3b8; }
    .confirm-ok { background: #ef4444; color: #fff; }
  </style>
</head>
<body>
<div id="layout">

  <!-- ── Left: 계정 목록 사이드바 ── -->
  <div id="left-panel" class="side-panel">
    <div class="stat-block">
      <h3>💳 계정</h3>
      <div id="left-people-list" style="display:flex;flex-direction:column;gap:6px;margin-top:2px"></div>
      <button onclick="goAddPerson()" style="width:100%;margin-top:10px;padding:8px;background:linear-gradient(135deg,#0891b2,#22d3ee);border:none;border-radius:8px;color:#fff;font-size:12px;font-weight:700;cursor:pointer;">+ 추가</button>
    </div>
  </div>

  <!-- ── Center: 앱 ── -->
  <div id="app">
    <!-- 메인: 인물 목록 -->
    <div id="screen-main" class="screen active">
      <div class="top-bar">
        <h1>💳 감스</h1>
        <span class="sub">신용 카드 잔액 기록부</span>
      </div>
      <div style="padding:16px 20px">
        <div class="people-list" id="people-list"></div>
        <button class="btn-primary" onclick="goAddPerson()">+ 추가하기</button>
      </div>
    </div>

    <!-- 사람 추가 -->
    <div id="screen-add-person" class="screen">
      <div class="top-bar">
        <button class="back-btn" onclick="go('main')">‹</button>
        <h1>👤 사람 추가</h1>
      </div>
      <div style="padding:16px 20px">
        <div class="field-label">이름</div>
        <input type="text" id="add-name-input" maxlength="20" placeholder="이름 입력"/>
        <button class="btn-primary" onclick="confirmAddPerson()">추가</button>
        <button class="btn-secondary" onclick="go('main')">취소</button>
      </div>
    </div>

    <!-- 인물 상세 -->
    <div id="screen-person" class="screen">
      <div class="top-bar">
        <button class="back-btn" onclick="go('main')">‹</button>
        <div style="display:flex;align-items:baseline;gap:10px;flex:1;min-width:0">
          <h1 id="person-title" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">—</h1>
          <span id="person-balance-inline" style="font-size:15px;font-weight:700;white-space:nowrap"></span>
        </div>
      </div>
      <div style="padding:16px 20px">
        <button class="btn-primary" onclick="goAddTx()">💳 거래 추가</button>
        <div class="section-title">거래 내역</div>
        <div class="tx-list" id="tx-list"></div>
        <div style="margin-top:20px">
          <button class="btn-danger" onclick="askDeletePerson()">🗑 삭제</button>
        </div>
      </div>
    </div>

    <!-- 암호 입력 -->
    <div id="screen-pw" class="screen">
      <div class="top-bar">
        <button class="back-btn" id="pw-back-btn">‹</button>
        <h1>🔑 암호 입력</h1>
      </div>
      <div style="padding:24px 20px">
        <input type="password" id="pw-input" maxlength="10" placeholder="• • • •"/>
        <div class="err-msg" id="pw-err"></div>
        <button class="btn-primary" onclick="checkPw()">확인</button>
        <button class="btn-secondary" id="pw-cancel-btn">취소</button>
      </div>
    </div>

    <!-- 거래 입력 -->
    <div id="screen-tx" class="screen">
      <div class="top-bar">
        <button class="back-btn" onclick="goPersonScreen()">‹</button>
        <h1>💳 거래 입력</h1>
      </div>
      <div style="padding:16px 20px">
        <div class="type-toggle">
          <button id="btn-out" class="type-btn out-active" onclick="setTxType('out')">나간 돈</button>
          <button id="btn-in"  class="type-btn in-inactive" onclick="setTxType('in')">들어온 돈</button>
        </div>
        <div class="field-label">금액 (원)</div>
        <input type="number" id="tx-amount" min="0" placeholder="0"/>
        <div class="field-label">메모 (선택)</div>
        <input type="text" id="tx-memo" maxlength="30" placeholder="메모"/>
        <button class="btn-primary" onclick="submitTx()">추가</button>
        <button class="btn-secondary" onclick="goPersonScreen()">취소</button>
      </div>
    </div>
  </div>

  <!-- ── Right: 감자 ── -->
  <div id="right-panel" class="side-panel">
    <!-- 감자신: 스프라우트 + 총 (게임 3D 코드 기반 2D 재현) -->
    <svg width="180" height="240" viewBox="0 0 180 240" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Sprout stem -->
      <path d="M80 96 L80 64" stroke="#2a8030" stroke-width="5.5" stroke-linecap="round"/>
      <!-- Leaf left (rz=-0.38) -->
      <ellipse cx="64" cy="58" rx="13" ry="3.5" fill="#38c040" transform="rotate(-22 64 58)"/>
      <!-- Leaf right (rz=0.38) -->
      <ellipse cx="96" cy="58" rx="13" ry="3.5" fill="#38c040" transform="rotate(22 96 58)"/>
      <!-- Leaf top center -->
      <ellipse cx="80" cy="47" rx="13" ry="3.5" fill="#38c040"/>

      <!-- Shadow -->
      <ellipse cx="80" cy="196" rx="48" ry="7" fill="#000" opacity="0.20"/>

      <!-- Arm: horizontal, starts inside body, extends right -->
      <rect x="108" y="131" width="30" height="10" rx="5" fill="#b07838"/>

      <!-- Body (scale x:1.10, y:0.88 → wider than tall) -->
      <ellipse cx="78" cy="130" rx="50" ry="40" fill="#b07838"/>
      <!-- Highlight -->
      <ellipse cx="63" cy="116" rx="22" ry="14" fill="#e0a868" opacity="0.28"/>

      <!-- Spots (3개, _buildPotatoBody 위치 기반) -->
      <circle cx="111" cy="122" r="5.5" fill="#5a2c08" opacity="0.72"/>
      <circle cx="50"  cy="140" r="5.5" fill="#5a2c08" opacity="0.65"/>
      <circle cx="87"  cy="157" r="5.5" fill="#5a2c08" opacity="0.60"/>

      <!-- Eyes (black sphere) -->
      <circle cx="62" cy="121" r="8.5" fill="#111111"/>
      <circle cx="94" cy="121" r="8.5" fill="#111111"/>
      <!-- Eye shine (shmat, white emissive) -->
      <circle cx="65" cy="117" r="3.5" fill="#ffffff"/>
      <circle cx="97" cy="117" r="3.5" fill="#ffffff"/>

      <!-- Gun: barrel face (BoxGeometry depth=0.22 → seen from front as cross-section) -->
      <rect x="134" y="131" width="12" height="10" rx="2" fill="#2e2e2e"/>
      <!-- Muzzle hole -->
      <circle cx="140" cy="136" r="3" fill="#181818"/>
      <!-- Trigger guard -->
      <rect x="131" y="139" width="14" height="6" rx="1.5" fill="#3a3a3a"/>
      <!-- Handle -->
      <rect x="131" y="143" width="10" height="23" rx="2.5" fill="#333333"/>
    </svg>
    <div class="potato-label">
      감스지기
      <span>카드 잔액 관리 중</span>
    </div>
  </div>

</div>

<!-- 삭제 확인 -->
<div class="confirm-overlay" id="confirm-overlay">
  <div class="confirm-box">
    <h3 id="confirm-title">정말 삭제할까요?</h3>
    <p id="confirm-body">이 작업은 되돌릴 수 없어요.</p>
    <div class="confirm-actions">
      <button class="confirm-cancel" onclick="closeConfirm()">취소</button>
      <button class="confirm-ok" id="confirm-ok-btn">삭제</button>
    </div>
  </div>
</div>

<script>
  const LS_KEY = 'gams_people';
  let _curIdx = -1;
  let _txType = 'out';
  let _pwCallback = null;
  let _deleteTxIdx = -1;

  function load() { try { return JSON.parse(localStorage.getItem(LS_KEY)) || []; } catch { return []; } }
  function save(d) { localStorage.setItem(LS_KEY, JSON.stringify(d)); }

  function go(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('screen-' + screenId).classList.add('active');
    window.scrollTo(0, 0);
  }

  function renderLeftList() {
    const people = load();
    const el = document.getElementById('left-people-list');
    if (!el) return;
    if (people.length === 0) {
      el.innerHTML = '<p style="color:#475569;font-size:12px;text-align:center;padding:8px 0">없음</p>';
      return;
    }
    el.innerHTML = people.map((p, i) => {
      const pos = p.balance >= 0;
      return `<div onclick="openPerson(${i})" style="cursor:pointer;padding:8px 10px;background:rgba(34,211,238,0.05);border:1px solid #164e63;border-radius:8px;transition:background 0.15s"
        onmouseover="this.style.background='rgba(34,211,238,0.12)'" onmouseout="this.style.background='rgba(34,211,238,0.05)'">
        <div style="font-size:13px;font-weight:700;color:#e2e8f0">${p.name}</div>
        <div style="font-size:12px;font-weight:700;color:${pos ? '#34d399' : '#f87171'}">${pos ? '+' : ''}${p.balance.toLocaleString()}원</div>
      </div>`;
    }).join('');
  }

  function renderMain() {
    const people = load();
    const list = document.getElementById('people-list');
    if (people.length === 0) {
      list.innerHTML = '<p class="empty-hint">아직 등록된 사람이 없어요</p>';
    } else {
      list.innerHTML = people.map((p, i) => {
        const pos = p.balance >= 0;
        return `<div class="person-card" onclick="openPerson(${i})">
          <span class="name">${p.name}</span>
          <span class="bal ${pos ? 'pos' : 'neg'}">${pos ? '+' : ''}${p.balance.toLocaleString()}원</span>
        </div>`;
      }).join('');
    }
    renderLeftList();
  }

  function goAddPerson() {
    go('add-person');
    const inp = document.getElementById('add-name-input');
    inp.value = '';
    setTimeout(() => inp.focus(), 80);
    inp.onkeydown = e => { if (e.key === 'Enter') confirmAddPerson(); };
  }

  function confirmAddPerson() {
    const name = (document.getElementById('add-name-input').value || '').trim();
    if (!name) return;
    const people = load();
    people.push({ name, balance: 0, transactions: [] });
    save(people);
    renderMain();
    go('main');
  }

  function openPerson(idx) {
    _curIdx = idx;
    goPersonScreen();
  }

  function goPersonScreen() {
    const people = load();
    const p = people[_curIdx];
    if (!p) { go('main'); return; }

    document.getElementById('person-title').textContent = p.name;
    const bal = p.balance;
    const inlineEl = document.getElementById('person-balance-inline');
    inlineEl.textContent = (bal >= 0 ? '+' : '') + bal.toLocaleString() + '원';
    inlineEl.style.color = bal >= 0 ? '#34d399' : '#f87171';

    const txList = document.getElementById('tx-list');
    const total = p.transactions.length;
    if (total === 0) {
      txList.innerHTML = '<p class="empty-hint" style="padding:20px 0">거래 내역이 없어요</p>';
    } else {
      txList.innerHTML = [...p.transactions].reverse().map((tx, ri) => {
        const origIdx = total - 1 - ri;
        const d = tx.ts ? new Date(tx.ts) : null;
        const ds = d
          ? `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`
          : '';
        return `<div class="tx-row">
          <div class="tx-left">
            <span class="tx-type ${tx.type}">${tx.type === 'in' ? '들어온 돈' : '나간 돈'}</span>
            ${tx.memo ? `<span class="tx-memo">${tx.memo}</span>` : ''}
          </div>
          <div class="tx-right" style="display:flex;align-items:center;gap:10px">
            <div>
              <div class="tx-amount ${tx.type}">${tx.type === 'in' ? '+' : '-'}${tx.amount.toLocaleString()}원</div>
              <div class="tx-date">${ds}</div>
            </div>
            <button onclick="askDeleteTx(${origIdx})" style="background:none;border:none;color:#475569;font-size:14px;cursor:pointer;padding:4px;line-height:1;border-radius:4px" onmouseover="this.style.color='#f87171'" onmouseout="this.style.color='#475569'">✕</button>
          </div>
        </div>`;
      }).join('');
    }
    go('person');
  }

  function openPwScreen(onSuccess, onCancel) {
    _pwCallback = onSuccess;
    const pwInput = document.getElementById('pw-input');
    const errEl = document.getElementById('pw-err');
    pwInput.value = '';
    errEl.textContent = '';
    document.getElementById('pw-back-btn').onclick = onCancel;
    document.getElementById('pw-cancel-btn').onclick = onCancel;
    go('pw');
    setTimeout(() => pwInput.focus(), 80);
    pwInput.onkeydown = e => { if (e.key === 'Enter') checkPw(); };
  }

  function goAddTx() {
    openPwScreen(goTxForm, goPersonScreen);
  }

  function checkPw() {
    const pw = document.getElementById('pw-input').value || '';
    if (pw !== '6718') {
      const err = document.getElementById('pw-err');
      err.textContent = '암호가 틀렸어요';
      setTimeout(() => { err.textContent = ''; }, 1500);
      return;
    }
    if (_pwCallback) { _pwCallback(); _pwCallback = null; }
  }

  function goTxForm() {
    _txType = 'out';
    document.getElementById('tx-amount').value = '';
    document.getElementById('tx-memo').value = '';
    updateTypeUI();
    go('tx');
    setTimeout(() => document.getElementById('tx-amount').focus(), 80);
  }

  function setTxType(type) {
    _txType = type;
    updateTypeUI();
  }

  function updateTypeUI() {
    document.getElementById('btn-out').className = 'type-btn ' + (_txType === 'out' ? 'out-active' : 'out-inactive');
    document.getElementById('btn-in').className  = 'type-btn ' + (_txType === 'in'  ? 'in-active'  : 'in-inactive');
  }

  function submitTx() {
    const amount = parseInt(document.getElementById('tx-amount').value || '0');
    if (!amount || amount <= 0) return;
    const memo = (document.getElementById('tx-memo').value || '').trim();
    const people = load();
    const p = people[_curIdx];
    if (!p) return;
    p.transactions.push({ type: _txType, amount, memo, ts: Date.now() });
    p.balance += _txType === 'in' ? amount : -amount;
    save(people);
    renderLeftList();
    goPersonScreen();
  }

  function askDeleteTx(origIdx) {
    _deleteTxIdx = origIdx;
    openPwScreen(doDeleteTx, goPersonScreen);
  }

  function doDeleteTx() {
    const people = load();
    const p = people[_curIdx];
    if (!p || _deleteTxIdx < 0 || _deleteTxIdx >= p.transactions.length) return;
    const tx = p.transactions[_deleteTxIdx];
    p.balance -= tx.type === 'in' ? tx.amount : -tx.amount;
    p.transactions.splice(_deleteTxIdx, 1);
    save(people);
    renderLeftList();
    goPersonScreen();
  }

  function askDeletePerson() {
    openPwScreen(() => {
      document.getElementById('confirm-title').textContent = `"${load()[_curIdx]?.name}" 삭제`;
      document.getElementById('confirm-body').textContent = '모든 거래 내역이 사라져요. 되돌릴 수 없어요.';
      document.getElementById('confirm-ok-btn').onclick = doDeletePerson;
      document.getElementById('confirm-overlay').classList.add('show');
    }, goPersonScreen);
  }

  function doDeletePerson() {
    const people = load();
    people.splice(_curIdx, 1);
    save(people);
    closeConfirm();
    renderMain();
    go('main');
  }

  function closeConfirm() {
    document.getElementById('confirm-overlay').classList.remove('show');
  }

  renderMain();
</script>
</body>
</html>
