<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🥔 감자 키우기</title>
<style>
* { margin:0;padding:0;box-sizing:border-box; }
body { overflow:hidden; font-family:'Malgun Gothic',sans-serif; }
canvas { display:block; }

#hud {
  position:fixed; top:0; left:0; right:0;
  display:flex; align-items:center; padding:9px 16px; gap:10px;
  background:rgba(0,0,0,.6); backdrop-filter:blur(4px); z-index:10; pointer-events:none;
}
#hud h1 { font-size:16px; color:#f5d060; }
#hud-name { font-size:13px; color:#bbb; }
#hud-coins { margin-left:auto; font-size:15px; color:#f5d060; font-weight:bold; }
#hud-wc { font-size:13px; color:#4af; }

#hint {
  position:fixed; bottom:70px; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,.82); color:#fff; padding:8px 22px;
  border-radius:22px; font-size:14px; border:1.5px solid rgba(255,255,255,.2);
  pointer-events:none; display:none; z-index:20; white-space:nowrap;
}
#hint kbd {
  display:inline-block; background:#444; border:1px solid #666;
  border-radius:4px; padding:1px 6px; font-size:12px; margin-right:4px;
}

#ctrl-hint {
  position:fixed; bottom:12px; left:50%; transform:translateX(-50%);
  color:rgba(255,255,255,.35); font-size:11px; pointer-events:none; z-index:10;
}

/* modal */
#mo {
  position:fixed; inset:0; background:rgba(0,0,0,.75);
  display:none; align-items:center; justify-content:center; z-index:50;
}
#mo.open { display:flex; }
#mp {
  background:#181200; border:2px solid #c8a050; border-radius:14px;
  padding:22px; min-width:300px; max-width:460px; width:90%;
  max-height:80vh; overflow-y:auto;
}
#mp h2 { color:#f5d060; margin-bottom:14px; font-size:17px; }
.pc {
  display:flex; align-items:center; gap:10px;
  padding:10px 12px; border:1px solid #333; border-radius:9px;
  cursor:pointer; margin-bottom:8px; transition:background .12s;
}
.pc:hover { background:#251800; border-color:#c8a050; }
.pcdot { width:26px; height:26px; border-radius:50%; flex-shrink:0; }
.pcn { font-size:13px; font-weight:bold; }
.pci { font-size:11px; color:#888; margin-top:2px; }
.mclose {
  margin-top:12px; padding:7px 22px; border:1px solid #444;
  border-radius:8px; background:#222; cursor:pointer; color:#aaa; font-size:13px;
}
.mclose:hover { color:#fff; }

#toast {
  position:fixed; bottom:52px; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,.88); color:#fff; padding:7px 18px;
  border-radius:20px; font-size:13px; pointer-events:none;
  opacity:0; transition:opacity .3s; z-index:99;
}
</style>
</head>

<div id="mo">

const COLL = 'potato_farms';

const PT = [
  {id:'common',  name:'일반 감자',    coin:5,    sec:10,    hex:'#c8a050', seed:0  },
  {id:'unusual', name:'특이한 감자',  coin:20,   sec:40,    hex:'#50c870', seed:8  },
  {id:'good',    name:'좋은 감자',    coin:50,   sec:100,   hex:'#5088ff', seed:20 },
  {id:'great',   name:'훌륭한 감자',  coin:100,  sec:200,   hex:'#b060ff', seed:40 },

  {id:'golden',  name:'황금 감자',    coin:1000, sec:2000,  hex:'#ffd700', seed:300},
];
const PTM = Object.fromEntries(PT.map(p=>[p.id,p]));
const WATER_SAVE = 0.25;

// ── LocalStorage ──
const LS = {nm:'pf2_name', co:'pf2_coins', wc:'pf2_wc'};

// ── State ──
let myId='';
const farmData={}, farmUnsub={};

const OTHER_SLOTS=['__s1','__s2','__s3','__s4','__s5'];
const slotRealId={}; // slot ID → 실제 Firebase ID
let nearTarget=null;

// ── Renderer ──
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x7ec8e3);
scene.fog=new THREE.Fog(0x7ec8e3,28,55);

const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,120);
camera.position.set(0,10,12);
renderer.setSize(innerWidth,innerHeight);

  camera.aspect=innerWidth/innerHeight;

// ── Lights ──
scene.add(new THREE.AmbientLight(0xfff0dd,.7));
const sun=new THREE.DirectionalLight(0xfff5cc,1.3);
sun.position.set(8,18,10); sun.castShadow=true;
sun.shadow.camera.left=sun.shadow.camera.bottom=-30;
sun.shadow.camera.right=sun.shadow.camera.top=30;
sun.shadow.camera.far=80; sun.shadow.mapSize.set(1024,1024);
scene.add(sun);
scene.add(new THREE.HemisphereLight(0x87ceeb,0x4a8820,.4));

// ── Ground ──
const gnd=new THREE.Mesh(new THREE.PlaneGeometry(120,120),
  new THREE.MeshLambertMaterial({color:0x4a8820}));
gnd.rotation.x=-Math.PI/2; gnd.receiveShadow=true; scene.add(gnd);

// ── Farm layout constants ──
const PW=2, PG=.32, COLS=3, ROWS=2;
const FW=COLS*(PW+PG), FD=ROWS*(PW+PG); // ~6.96 × 4.64

// World positions of 6 farms
const FARM_POS=[
  new THREE.Vector3(0,0,0),       // mine
  new THREE.Vector3(-14,0,1),     // other1
  new THREE.Vector3(14,0,1),      // other2
  new THREE.Vector3(0,0,-15),     // other3
  new THREE.Vector3(-14,0,-14),   // other4
  new THREE.Vector3(14,0,-14),    // other5
];
const SHOP_POS=new THREE.Vector3(11,0,-2);
const SHOP_INTERACT_R=3.0;
const PLOT_INTERACT_R=1.9;

const plotMeshes={}, plantGrps={}, farmGrps={};
let playerMesh=null;
let shopGroup=null;

// ── Helpers ──
function plotLP(i){
  return new THREE.Vector3(
    (i%COLS-(COLS-1)/2)*(PW+PG), 0,
    (Math.floor(i/COLS)-(ROWS-1)/2)*(PW+PG)
  );
}
function plotWP(fid,i){
  const fc=farmGrps[fid]?.position||new THREE.Vector3();
  const lp=plotLP(i);
  return new THREE.Vector3(fc.x+lp.x, 0, fc.z+lp.z);
}

// ── Build farm ──
function buildFarm(fid, center, isMe){
  if(farmGrps[fid]) return;
  const g=new THREE.Group(); g.position.copy(center); scene.add(g);
  farmGrps[fid]=g;

  // Grass pad
  const pad=new THREE.Mesh(new THREE.BoxGeometry(FW+1.2,0.15,FD+1.2),
    new THREE.MeshLambertMaterial({color:isMe?0x3d7018:0x2d5a10}));
  pad.position.y=-.08; pad.receiveShadow=true; g.add(pad);

  // Fence
  const pM=new THREE.MeshLambertMaterial({color:0x8a6030});
  const rM=new THREE.MeshLambertMaterial({color:0xb07840});
  const hw=FW/2+.5, hd=FD/2+.5;
  // corner + mid posts
  [[-hw,-hd],[0,-hd],[hw,-hd],[-hw,0],[hw,0],[-hw,hd],[0,hd],[hw,hd]]
    .forEach(([x,z])=>{
      const p=new THREE.Mesh(new THREE.BoxGeometry(.1,.7,.1),pM);
      p.position.set(x,.3,z); p.castShadow=true; g.add(p);
    });
  // rails
  [[0,-hd,FW+1,'x'],[0,hd,FW+1,'x'],[-hw,0,FD+1,'z'],[hw,0,FD+1,'z']]
    .forEach(([x,z,len,ax])=>{
      const r=new THREE.Mesh(new THREE.BoxGeometry(ax==='x'?len:.08,.07,ax==='z'?len:.08),rM);
      r.position.set(x,.48,z); g.add(r);
    });

  // Gate sign (my farm only)
  if(isMe){
    const sp=new THREE.Mesh(new THREE.BoxGeometry(.08,1,.08),pM);
    sp.position.set(-hw-.3,.5,-hd-.3); g.add(sp);
    const sb=new THREE.Mesh(new THREE.BoxGeometry(1.4,.4,.06),rM);
    sb.position.set(-hw-.3,.95,-hd-.3); g.add(sb);
    // Reset button hint post
    const rp=new THREE.Mesh(new THREE.BoxGeometry(.08,1,.08),pM);
    rp.position.set(hw+.3,.5,-hd-.3); g.add(rp);
  }

  // Plots
  const plots=[], plants=[];
  for(let i=0;i<6;i++){
    const lp=plotLP(i);
    const pm=new THREE.Mesh(new THREE.BoxGeometry(PW,.12,PW),
      new THREE.MeshLambertMaterial({color:0x7a4a18}));
    pm.position.set(lp.x,0,lp.z); pm.receiveShadow=true;
    pm.userData={fid,idx:i}; g.add(pm); plots.push(pm);

    const pg=new THREE.Group();
    pg.position.set(lp.x,.07,lp.z); g.add(pg); plants.push(pg);
  }
  plotMeshes[fid]=plots; plantGrps[fid]=plants;
}

// ── Build shop ──
function buildShop(){
  const g=new THREE.Group(); g.position.copy(SHOP_POS); scene.add(g);
  shopGroup=g;

  const flM=new THREE.MeshLambertMaterial({color:0x9a7848});
  const wM=new THREE.MeshLambertMaterial({color:0xb08050});
  const rM=new THREE.MeshLambertMaterial({color:0x7a3a10});

  // Floor
  const fl=new THREE.Mesh(new THREE.BoxGeometry(5,0.15,4.5),flM);
  fl.position.y=.07; fl.receiveShadow=true; g.add(fl);
  // Walls (3 sides, open front)
  [[-2.4,0,'z',4.5],[2.4,0,'z',4.5],[0,0,-2.1,'x',4.8]]
    .forEach(([x,y,z,ax,len])=>{
      if(len===undefined){len=z;z=undefined;}
      const w=new THREE.Mesh(
        new THREE.BoxGeometry(ax==='x'?len:.2,2.4,.2),wM);
      w.position.set(x,1.3,z??x); w.castShadow=true; g.add(w);
    });
  // Back wall
  const bw=new THREE.Mesh(new THREE.BoxGeometry(5,.2,2.4),wM);
  bw.rotation.z=Math.PI/2; bw.position.set(0,1.3,-2); g.add(bw);
  const bw2=new THREE.Mesh(new THREE.BoxGeometry(.2,2.4,4.5),wM);
  bw2.position.set(-2.4,1.3,0); g.add(bw2);
  const bw3=new THREE.Mesh(new THREE.BoxGeometry(.2,2.4,4.5),wM);
  bw3.position.set(2.4,1.3,0); g.add(bw3);
  const bw4=new THREE.Mesh(new THREE.BoxGeometry(5,.2,4.5),wM);
  bw4.position.set(0,2.5,-2.15); g.add(bw4);
  // Roof
  const roof=new THREE.Mesh(new THREE.ConeGeometry(3.8,1.6,4),rM);
  roof.position.y=3.4; roof.rotation.y=Math.PI/4; roof.castShadow=true; g.add(roof);
  // Counter
  const ct=new THREE.Mesh(new THREE.BoxGeometry(3.5,.7,.5),
    new THREE.MeshLambertMaterial({color:0xd0a060}));
  ct.position.set(0,.5,1.8); g.add(ct);
  // Sign board
  const sb=new THREE.Mesh(new THREE.BoxGeometry(2.5,.6,.08),
    new THREE.MeshLambertMaterial({color:0x4a1a00}));
  sb.position.set(0,2.6,2.1); g.add(sb);
  // 🛒 text represented by a bright stripe
  const st=new THREE.Mesh(new THREE.BoxGeometry(2,.1,.09),
    new THREE.MeshBasicMaterial({color:0xffd700}));
  st.position.set(0,2.9,2.11); g.add(st);
}

// ── Decorations ──
function addDeco(){
  const treeMat=new THREE.MeshLambertMaterial({color:0x1e6c0a});
  const trunkMat=new THREE.MeshLambertMaterial({color:0x6a3a10});
  const flowerMat=new THREE.MeshLambertMaterial({color:0xffaacc});
  const treePos=[
    [-9,0,-6],[-9,0,5],[9,0,-6],[9,0,5],[-5,0,8],[5,0,8],
    [-12,0,3],[12,0,3],[0,0,-8],[-7,0,-2],[7,0,-2],
    [-6,0,-10],[6,0,-10],[14,0,-8],[-14,0,-8],
  ];
  treePos.forEach(([x,,z])=>{
    const g=new THREE.Group();g.position.set(x,0,z);
    const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.14,.18,.9,6),trunkMat);
    trunk.position.y=.45; g.add(trunk);
    const crown=new THREE.Mesh(new THREE.SphereGeometry(.7+Math.random()*.5,7,6),treeMat);
    crown.position.y=1.5; g.add(crown);
    scene.add(g);
  });
  // Flowers
  for(let i=0;i<18;i++){
    const g=new THREE.Group();
    g.position.set((Math.random()-.5)*22,(0),(Math.random()-.5)*22);
    const stem=new THREE.Mesh(new THREE.CylinderGeometry(.02,.02,.3,4),
      new THREE.MeshLambertMaterial({color:0x3a8020}));
    stem.position.y=.15;g.add(stem);
    const fl=new THREE.Mesh(new THREE.SphereGeometry(.1,5,4),flowerMat);
    fl.position.y=.35;g.add(fl);
    scene.add(g);
  }
  // Path stones between farm and shop
  for(let i=0;i<6;i++){
    const t=i/5;
    const px=t*10, pz=0;
    const stone=new THREE.Mesh(new THREE.CylinderGeometry(.25+Math.random()*.1,.3,.05,7),
      new THREE.MeshLambertMaterial({color:0xaaa090}));
    stone.position.set(px+4,.01,pz); scene.add(stone);
  }
}

// ── Player model ──
let walkPhase=0;
function buildPlayerModel(){
  const g=new THREE.Group();
  const skinM=new THREE.MeshLambertMaterial({color:0xf5c080});
  const bodyM=new THREE.MeshLambertMaterial({color:0x3a7030}); // green shirt
  const pantsM=new THREE.MeshLambertMaterial({color:0x2a4ab0}); // blue pants
  const hatM=new THREE.MeshLambertMaterial({color:0xd4a040});

  // Legs
  [-0.1,0.1].forEach(x=>{
    const leg=new THREE.Mesh(new THREE.CylinderGeometry(.085,.085,.44,7),pantsM);
    leg.position.set(x,.22,0); leg.castShadow=true; g.add(leg);
  });
  // Body
  const body=new THREE.Mesh(new THREE.CylinderGeometry(.2,.24,.52,8),bodyM);
  body.position.y=.67; body.castShadow=true; g.add(body);
  // Arms
  [-0.27,0.27].forEach(x=>{
    const arm=new THREE.Mesh(new THREE.CylinderGeometry(.07,.07,.38,6),skinM);
    arm.position.set(x,.67,0); arm.rotation.z=x>0?.4:-.4;
    arm.castShadow=true; g.add(arm);
  });
  // Head — 감자 얼굴
  const potatoM=new THREE.MeshLambertMaterial({color:0xc8a050});
  const head=new THREE.Mesh(new THREE.SphereGeometry(.22,10,8),potatoM);
  head.scale.set(1,.95,1.1); // 약간 앞뒤로 납작한 감자형
  head.position.y=1.09; head.castShadow=true; g.add(head);
  // Potato bumps (눈 모양)
  const bumpM=new THREE.MeshLambertMaterial({color:0xa07830});
  [-.06,.06].forEach(x=>{
    const bump=new THREE.Mesh(new THREE.SphereGeometry(.05,6,5),bumpM);
    bump.position.set(x,1.14,.2); g.add(bump);
  });
  // Eyes (검은 눈동자)
  const eyeM=new THREE.MeshLambertMaterial({color:0x111111});
  [-.06,.06].forEach(x=>{
    const e=new THREE.Mesh(new THREE.SphereGeometry(.03,6,5),eyeM);
    e.position.set(x,1.16,.24); g.add(e);
    // shine
    const sh=new THREE.Mesh(new THREE.SphereGeometry(.012,5,4),
      new THREE.MeshBasicMaterial({color:0xffffff}));
    sh.position.set(x+.01,1.175,.268); g.add(sh);
  });
  // Mouth — 미소
  const mouthM=new THREE.MeshLambertMaterial({color:0x6a3a10});
  const mouthGeo=new THREE.TorusGeometry(.055,.012,5,10,Math.PI);
  const mouth=new THREE.Mesh(mouthGeo,mouthM);
  mouth.rotation.z=Math.PI; mouth.position.set(0,1.04,.24); g.add(mouth);
  // 감자 작은 돌기 (머리 위)
  [[-.05,.1,.06],[.07,.08,-.04],[0,.1,-.06]].forEach(([x,y,z])=>{
    const sp=new THREE.Mesh(new THREE.SphereGeometry(.03,5,4),bumpM);
    sp.position.set(x,1.3+y,z); g.add(sp);
  });
  // Hat brim
  const brim=new THREE.Mesh(new THREE.CylinderGeometry(.3,.32,.045,12),hatM);
  brim.position.y=1.28; g.add(brim);
  const hat=new THREE.Mesh(new THREE.CylinderGeometry(.17,.22,.22,10),hatM);
  hat.position.y=1.41; g.add(hat);

  g.position.set(0,.01,4);
  scene.add(g);
  playerMesh=g;
}

// ── Plant visuals ──
function clearPG(pg){
  while(pg.children.length){
    const c=pg.children[0];
    c.geometry?.dispose(); c.material?.dispose(); pg.remove(c);
  }
}

function rebuildPlant(fid,i){
  const pg=plantGrps[fid]?.[i]; if(!pg) return;
  clearPG(pg);
  const d=(farmData[fid]?.plots||[])[i];
  if(!d?.type||d?.harvested) return;
  const pt=PTM[d.type]; if(!pt) return;
  const prog=growProgress(d); if(prog<=0) return;

  const sc=.18+prog*.72;
  const col=pt.id==='rainbow'
    ? new THREE.Color().setHSL((Date.now()*.0004)%1,1,.55).getHex()
    : parseInt(pt.hex.replace('#',''),16);

  const bm=new THREE.MeshStandardMaterial({color:col, roughness:.6,
    metalness:pt.id==='golden'?.55:0,
    emissive:prog>=1?col:0, emissiveIntensity:prog>=1?.22:0});
  const body=new THREE.Mesh(new THREE.SphereGeometry(.27*sc,10,8),bm);
  body.position.y=.28*sc; body.castShadow=true; pg.add(body);

  if(prog>.28){
    const sm=new THREE.MeshLambertMaterial({color:0x2a8010});
    const stem=new THREE.Mesh(new THREE.CylinderGeometry(.04*sc,.06*sc,.36*sc,6),sm);
    stem.position.y=.6*sc; pg.add(stem);
    for(let j=0;j<4;j++){
      const a=(j/4)*Math.PI*2;
      const lm=new THREE.MeshLambertMaterial({color:0x1f9010,side:THREE.DoubleSide});
      const leaf=new THREE.Mesh(new THREE.ConeGeometry(.15*sc,.32*sc,5),lm);
      leaf.position.set(Math.cos(a)*.19*sc,.74*sc,Math.sin(a)*.19*sc);
      leaf.rotation.z=.65; leaf.rotation.y=a; pg.add(leaf);
    }
  }
  if(prog>=1){
    const rm=new THREE.MeshBasicMaterial({color:0xffee22,transparent:true,opacity:.7});
    const ring=new THREE.Mesh(new THREE.TorusGeometry(.38,.05,8,24),rm);
    ring.rotation.x=Math.PI/2; ring.position.y=.04; pg.add(ring);
    const pl=new THREE.PointLight(col,.9,2.4); pl.position.y=.6; pg.add(pl);
  }
}
function rebuildFarmPlants(fid){ for(let i=0;i<6;i++) rebuildPlant(fid,i); }

// ── Growth math ──
function growProgress(d){
  if(!d?.type||d?.harvested||!d?.plantedAt) return 0;
  const pt=PTM[d.type]; if(!pt) return 0;
  const base=pt.sec*1000;
  const saved=(d.waterBoost||0)*pt.sec*1000;
  return Math.min(1,(Date.now()-d.plantedAt)/Math.max(base-saved,base*.05));
}
function remainSec(d){
  const pt=PTM[d?.type]; if(!pt||!d?.plantedAt||d?.harvested) return 0;
  const base=pt.sec; const saved=(d.waterBoost||0)*pt.sec;
  return Math.max(0,Math.max(base-saved,base*.05)-(Date.now()-d.plantedAt)/1000);
}
function fmtS(s){ s=Math.ceil(s); return s<60?s+'초':s<3600?Math.floor(s/60)+'분'+(s%60?' '+s%60+'초':''):Math.floor(s/3600)+'시간'; }

// ── Firebase ──
function emptyFarm(n){ return {ownerName:n,lastActive:Date.now(),
  plots:Array.from({length:6},()=>({type:null,plantedAt:null,waterBoost:0,harvested:false}))}; }
async function ensureMyFarm(){
  const ref=doc(db,COLL,myId);
  const snap=await getDoc(ref);
  if(!snap.exists()) await setDoc(ref,emptyFarm(pName));
}
function subscribe(fid){
  if(farmUnsub[fid]) return;
  farmUnsub[fid]=onSnapshot(doc(db,COLL,fid),snap=>{
    farmData[fid]=snap.exists()?snap.data():null;
    rebuildFarmPlants(fid);
  });
}
async function saveF(fid,data){
  // fid 가 슬롯ID면 실제 Firebase ID로 변환
  const realId=slotRealId[fid]||fid;
  data.lastActive=Date.now();
  await setDoc(doc(db,COLL,realId),data);
}
async function loadOthers(){
  const snap=await getDocs(query(collection(db,COLL),orderBy('lastActive','desc'),limit(8)));
  const found=[];
  snap.forEach(d=>{ if(d.id!==myId&&found.length<5) found.push({id:d.id,data:d.data()}); });
  // 슬롯 업데이트 (실제 플레이어가 있으면 그 데이터로, 없으면 빈 농장 유지)
  OTHER_SLOTS.forEach((sid,i)=>{
    const real=found[i];
    if(real){
      slotRealId[sid]=real.id;
      farmData[sid]=real.data;
      rebuildFarmPlants(sid);
      // 실시간 업데이트: 실제 ID로 구독, 슬롯에 반영
      if(farmUnsub[sid]) farmUnsub[sid]();
      farmUnsub[sid]=onSnapshot(doc(db,COLL,real.id),snap=>{
        farmData[sid]=snap.exists()?snap.data():emptyFarm('');
        rebuildFarmPlants(sid);
      });
    }
  });
}
function addNamePlate(fid, pos){
  const g=new THREE.Group();
  g.position.set(pos.x, 0, pos.z+FD/2+1.5);
  const post=new THREE.Mesh(new THREE.BoxGeometry(.08,1.1,.08),
    new THREE.MeshLambertMaterial({color:0x8a6030}));
  post.position.y=.55; g.add(post);
  const board=new THREE.Mesh(new THREE.BoxGeometry(2,.5,.07),
    new THREE.MeshLambertMaterial({color:0xc09050}));
  board.position.y=1.05; g.add(board);
  scene.add(g);
}

// ── UI ──
function updateHUD(){
  document.getElementById('hud-coins').textContent=`🪙 ${coins}`;
  document.getElementById('hud-wc').textContent=wc>0?`💧×${wc}`:'';
}

// ── Modal helpers ──
function showModal(title,html){
  document.getElementById('mt').textContent=title;
  document.getElementById('mb').innerHTML=html;
  document.getElementById('mo').classList.add('open');
}
window.closeModal=()=>document.getElementById('mo').classList.remove('open');
document.getElementById('mo').addEventListener('click',e=>{ if(e.target===document.getElementById('mo')) closeModal(); });

let toastT;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.style.opacity='1';
  clearTimeout(toastT); toastT=setTimeout(()=>el.style.opacity='0',2500);
}

// ── Interaction ──
function checkNearby(){
  if(!playerMesh) return;
  const pp=playerMesh.position;
  nearTarget=null;

  // Plots (my farm first, then others)
  const allFarms=[myId,...OTHER_SLOTS];
  outer:for(const fid of allFarms){
    for(let i=0;i<6;i++){
      if(pp.distanceTo(plotWP(fid,i))<PLOT_INTERACT_R){
        nearTarget={type:'plot',fid,idx:i}; break outer;
      }
    }
  }
  // Shop
  if(!nearTarget && pp.distanceTo(SHOP_POS)<SHOP_INTERACT_R){
    nearTarget={type:'shop'};
  }

  // Update hint UI
  const hintEl=document.getElementById('hint');
  const hintTxt=document.getElementById('hint-text');
  if(nearTarget){
    hintEl.style.display='block';
    if(nearTarget.type==='shop'){
      hintTxt.textContent='상점 열기';
    } else {
      const {fid,idx}=nearTarget;
      const mine=fid===myId;
      const d=(farmData[fid]?.plots||[])[idx];
      if(!d?.type||d?.harvested){
        hintTxt.textContent=mine?'심기':'심기 (타인 농장)';
      } else if(growProgress(d)>=1){
        hintTxt.textContent=mine?'🥔 수확!':'수확 준비 완료 (내 농장에서만)';
      } else if(wc>0){
        hintTxt.textContent=`💧 물주기 (${wc}회)`;
      } else {
        hintEl.style.display='none'; nearTarget=null;
        // Show toast instead of hint for grow timer
        // (don't hide, just show timer)
        hintEl.style.display='block';
        hintTxt.textContent=`⏳ ${fmtS(remainSec(d))} 남음`;
      }
    }
  } else {
    hintEl.style.display='none';
  }
}

function doInteract(){
  if(document.getElementById('mo').classList.contains('open')){ closeModal(); return; }
  if(!nearTarget) return;

  if(nearTarget.type==='shop'){ openShop(); return; }

  const {fid,idx}=nearTarget;
  const fd=farmData[fid]; if(!fd||!fd.plots){ toast('로딩 중...'); return; }
  const p=fd.plots[idx];
  const mine=fid===myId;

  if(!p.type||p.harvested){
    if(!mine){ toast('관람만 가능합니다'); return; }
    openSeedModal(fid,idx); return;
  }
  if(growProgress(p)>=1){
    if(!mine){ toast('수확은 내 농장에서만 가능합니다'); return; }
    const pt=PTM[p.type];
    p.harvested=true; coins+=pt.coin; saveLS(); updateHUD();
    saveF(fid,fd);
    toast(`🥔 ${pt.name} 수확! +${pt.coin} 코인`); return;
  }
  // Still growing
  if(wc>0){
    const pt=PTM[p.type];
    if((p.waterBoost||0)>=.9){ toast('이미 물을 충분히 주었습니다'); return; }
    p.waterBoost=Math.min(.9,(p.waterBoost||0)+WATER_SAVE);
    wc--; saveLS(); updateHUD();
    saveF(fid,fd);
    toast(`💧 물을 주었습니다! (${wc}회 남음)`);
  } else {
    toast(`⏳ ${fmtS(remainSec(p))} 남음 · 상점에서 물뿌리개를 구매하세요`);
  }
}

function openSeedModal(fid,idx){
  showModal('🌱 감자 선택',
    PT.map(pt=>`
      <div class="pc" onclick="doPlant('${fid}',${idx},'${pt.id}')">
        <div class="pcdot" style="background:${pt.hex}"></div>
        <div><div class="pcn">${pt.name}</div>
        <div class="pci">수확 +${pt.coin}코인 · ${fmtS(pt.sec)} 성장${pt.seed?` · 씨앗 ${pt.seed}코인`:' · 무료'}</div></div>
      </div>`).join('')
  );
}
window.doPlant=(fid,idx,tid)=>{
  const pt=PTM[tid];
  if(pt.seed>0&&coins<pt.seed){ toast(`씨앗 비용 ${pt.seed}코인 부족`); return; }
  const fd=farmData[fid]; if(!fd) return;
  if(pt.seed>0){ coins-=pt.seed; saveLS(); updateHUD(); }
  fd.plots[idx]={type:tid,plantedAt:Date.now(),waterBoost:0,harvested:false};
  saveF(fid,fd); closeModal();
  toast(`🌱 ${pt.name} 심기 완료!`);
};

function openShop(){
  showModal('🛒 도구 상점',`
    <div class="pc" onclick="buyWC()">
      <div class="pcdot" style="background:#4af"></div>
      <div><div class="pcn">💧 물뿌리개</div>
      <div class="pci">50코인 · 10회 사용 · 감자 가까이서 E키로 물주기 · 성장 25% 단축</div></div>
    </div>
    <div class="pc" onclick="buySpkr()">
      <div class="pcdot" style="background:#447"></div>
      <div><div class="pcn">🌀 스프링클러</div>
      <div class="pci">30코인 · 내 농장 모든 칸에 즉시 물 뿌리기</div></div>
    </div>
    <div class="pc" onclick="doReset()">
      <div class="pcdot" style="background:#600"></div>
      <div><div class="pcn">🔄 내 농장 초기화</div>
      <div class="pci">심어진 감자 모두 제거</div></div>
    </div>
  `);
}
window.buyWC=()=>{
  if(coins<50){ toast('코인 부족'); return; }
  coins-=50; wc+=10; saveLS(); updateHUD();
  toast('💧 물뿌리개 구입! 10회 사용 가능'); closeModal();
};
window.buySpkr=()=>{
  if(coins<30){ toast('코인 부족'); return; }
  const fd=farmData[myId]; if(!fd){ toast('농장 로딩 중...'); return; }
  coins-=30; saveLS(); updateHUD();
  fd.plots.forEach(p=>{
    if(!PTM[p.type]||p.harvested||!p.plantedAt) return;
    p.waterBoost=Math.min(.9,(p.waterBoost||0)+WATER_SAVE);
  });
  saveF(myId,fd); closeModal();
  toast('🌀 스프링클러! 모든 칸에 물 뿌렸습니다');
};
window.doReset=()=>{
  if(!confirm('내 농장을 초기화할까요?')) return;
  const fd=emptyFarm(pName); farmData[myId]=fd; saveF(myId,fd);
  toast('농장 초기화 완료'); closeModal();
};

// ── Input ──
const keys={};
window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase(); keys[k]=true;
  if(k==='e') doInteract();
  if(['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d'].includes(k)) e.preventDefault();
});
window.addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; });

// ── Camera follow ──
const camTgt=new THREE.Vector3(0,0,0);
function updateCamera(){
  if(!playerMesh) return;
  const px=playerMesh.position.x, pz=playerMesh.position.z;
  camTgt.x+=( px-camTgt.x)*.1;
  camTgt.z+=( pz-camTgt.z)*.1;
  camera.position.x+=(camTgt.x       -camera.position.x)*.1;
  camera.position.y+=(10              -camera.position.y)*.1;
  camera.position.z+=(camTgt.z+11    -camera.position.z)*.1;
  camera.lookAt(camTgt.x,1,camTgt.z);
}

// ── Player movement ──
function movePlayer(){
  if(!playerMesh) return;
  if(document.getElementById('mo').classList.contains('open')) return;

  const spd=.1;
  let mx=0, mz=0;
  if(keys['w']||keys['arrowup'])    mz-=1;
  if(keys['s']||keys['arrowdown'])  mz+=1;
  if(keys['a']||keys['arrowleft'])  mx-=1;
  if(keys['d']||keys['arrowright']) mx+=1;

  if(mx||mz){
    const len=Math.hypot(mx,mz);
    mx=mx/len*spd; mz=mz/len*spd;
    playerMesh.position.x+=mx;
    playerMesh.position.z+=mz;
    playerMesh.position.x=Math.max(-28,Math.min(28,playerMesh.position.x));
    playerMesh.position.z=Math.max(-28,Math.min(28,playerMesh.position.z));

    // Smooth rotation toward movement direction
    const ta=Math.atan2(mx,mz);
    let da=ta-playerMesh.rotation.y;
    while(da>Math.PI) da-=Math.PI*2; while(da<-Math.PI) da+=Math.PI*2;
    playerMesh.rotation.y+=da*.22;

    // Walk bob
    walkPhase+=.2;
    playerMesh.position.y=Math.abs(Math.sin(walkPhase))*.07;
  } else {
    playerMesh.position.y*=.85; // settle down
  }
}

// ── Animate loop ──
let frame=0;
function animate(){
  requestAnimationFrame(animate); frame++;
  movePlayer();
  if(frame%2===0) checkNearby();
  updateCamera();
  // Rebuild plant visuals every 1.5s
  if(frame%90===0) Object.keys(farmData).forEach(rebuildFarmPlants);
  // Rainbow cycle
  if(frame%8===0){
    for(const fid of Object.keys(plantGrps)){
      (farmData[fid]?.plots||[]).forEach((p,i)=>{
        if(p.type!=='rainbow'||p.harvested) return;
        plantGrps[fid]?.[i]?.children.forEach(c=>{
          if(c.material?.color) c.material.color.setHSL((Date.now()*.0004+i*.2)%1,1,.55);
        });
      });
    }
  }
  renderer.render(scene,camera);
}

// ── Init ──
async function init(){
  let name=localStorage.getItem(LS.nm);
  if(!name){
    name=(prompt('닉네임을 입력하세요 (2~12자)')||'감자농부').trim().slice(0,12)||'감자농부';
    localStorage.setItem(LS.nm,name);
  }
  pName=name; myId=name;
  document.getElementById('hud-name').textContent=name;
  loadLS(); updateHUD();

  // Build world immediately
  buildPlayerModel();
  buildFarm(myId, FARM_POS[0], true);
  farmData[myId] = emptyFarm(pName); // pre-populate so interaction works before Firebase
  OTHER_SLOTS.forEach((sid,i) => {
    buildFarm(sid, FARM_POS[i+1], false);
    farmData[sid] = emptyFarm('');
  });
  buildShop();
  addDeco();
  animate();

  // Firebase in background
  try{
    await ensureMyFarm();
    subscribe(myId);
    await loadOthers();
  } catch(e){
    console.error(e); toast('⚠️ 네트워크 오류 - 오프라인');
  }
}
init().catch(console.error);
</script>
