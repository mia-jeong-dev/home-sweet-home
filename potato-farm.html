<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🥔 감자 키우기</title>
<style>
* { margin:0;padding:0;box-sizing:border-box; }
body { overflow:hidden; font-family:'Malgun Gothic',sans-serif; }
canvas { display:block; }

#hud {
  position:fixed; top:0; left:0; right:0;
  display:flex; align-items:center; padding:9px 16px; gap:10px;
  background:rgba(0,0,0,.6); backdrop-filter:blur(4px); z-index:10; pointer-events:none;
}
#hud h1 { font-size:16px; color:#f5d060; }
#hud-name { font-size:13px; color:#bbb; }
#hud-coins { margin-left:auto; font-size:15px; color:#f5d060; font-weight:bold; }
#hud-wc { font-size:13px; color:#4af; }

#hint {
  position:fixed; bottom:70px; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,.82); color:#fff; padding:8px 22px;
  border-radius:22px; font-size:14px; border:1.5px solid rgba(255,255,255,.2);
  pointer-events:none; display:none; z-index:20; white-space:nowrap;
}
#hint kbd {
  display:inline-block; background:#444; border:1px solid #666;
  border-radius:4px; padding:1px 6px; font-size:12px; margin-right:4px;
}
#ctrl-hint {
  position:fixed; bottom:12px; left:50%; transform:translateX(-50%);
  color:rgba(255,255,255,.35); font-size:11px; pointer-events:none; z-index:10;
}

#mo {
  position:fixed; inset:0; background:rgba(0,0,0,.75);
  display:none; align-items:center; justify-content:center; z-index:50;
}
#mo.open { display:flex; }
#mp {
  background:#181200; border:2px solid #c8a050; border-radius:14px;
  padding:22px; min-width:300px; max-width:460px; width:90%;
  max-height:80vh; overflow-y:auto;
}
#mp h2 { color:#f5d060; margin-bottom:14px; font-size:17px; }
.pc {
  display:flex; align-items:center; gap:10px;
  padding:10px 12px; border:1px solid #333; border-radius:9px;
  cursor:pointer; margin-bottom:8px; transition:background .12s;
}
.pc:hover { background:#251800; border-color:#c8a050; }
.pcdot { width:26px; height:26px; border-radius:50%; flex-shrink:0; }
.pcn { font-size:13px; font-weight:bold; }
.pci { font-size:11px; color:#888; margin-top:2px; }
.mclose {
  margin-top:12px; padding:7px 22px; border:1px solid #444;
  border-radius:8px; background:#222; cursor:pointer; color:#aaa; font-size:13px;
}
.mclose:hover { color:#fff; }

#toast {
  position:fixed; bottom:52px; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,.88); color:#fff; padding:7px 18px;
  border-radius:20px; font-size:13px; pointer-events:none;
  opacity:0; transition:opacity .3s; z-index:99;
}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <h1>🥔</h1>
  <span id="hud-name"></span>
  <span id="hud-coins">🪙 0</span>
  <span id="hud-wc"></span>
</div>
<div id="hint"><kbd>E</kbd><span id="hint-text">심기</span></div>
<div id="ctrl-hint">WASD 이동 &nbsp;·&nbsp; 마우스 드래그 각도 조절 &nbsp;·&nbsp; E 상호작용</div>

<div id="mo">
  <div id="mp">
    <h2 id="mt"></h2>
    <div id="mb"></div>
    <button class="mclose" onclick="closeModal()">닫기</button>
  </div>
</div>
<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, onSnapshot,

import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js";

// ── Firebase ──
const db = getFirestore(initializeApp({
  apiKey:"AIzaSyAoiB8frxNH4W2lTzoO9R3rZeyxypY6rgs",
  authDomain:"gams-db.firebaseapp.com", projectId:"gams-db",
  storageBucket:"gams-db.firebasestorage.app",
  messagingSenderId:"868598873850",
  appId:"1:868598873850:web:cd0007b105bdc1518d5343"
}));
const COLL = 'potato_farms';

// ── Potato types ──
const PT = [
  {id:'common',  name:'일반 감자',    coin:5,    sec:10,    hex:'#c8a050', seed:0  },
  {id:'unusual', name:'특이한 감자',  coin:20,   sec:40,    hex:'#50c870', seed:8  },
  {id:'good',    name:'좋은 감자',    coin:50,   sec:100,   hex:'#5088ff', seed:20 },
  {id:'great',   name:'훌륭한 감자',  coin:100,  sec:200,   hex:'#b060ff', seed:40 },
  {id:'king',    name:'대왕 감자',    coin:200,  sec:400,   hex:'#ff5555', seed:80 },
  {id:'rainbow', name:'레인보우 감자',coin:500,  sec:1000,  hex:'#ffffff', seed:150},
  {id:'golden',  name:'황금 감자',    coin:1000, sec:2000,  hex:'#ffd700', seed:300},
];
const PTM = Object.fromEntries(PT.map(p=>[p.id,p]));
const WATER_SAVE = 0.25;

// ── LocalStorage ──
const LS = {nm:'pf2_name', co:'pf2_coins', wc:'pf2_wc'};
let pName='', coins=0, wc=0;
function loadLS(){ coins=+(localStorage.getItem(LS.co)||0); wc=+(localStorage.getItem(LS.wc)||0); }
function saveLS(){ localStorage.setItem(LS.co,coins); localStorage.setItem(LS.wc,wc); }

// ── State ──
let myId='';
const farmData={}, farmUnsub={};
const OTHER_SLOTS=['__s1','__s2','__s3','__s4','__s5'];
const slotRealId={};
let nearTarget=null;

// ── Renderer ──
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x7ec8e3);
scene.fog=new THREE.Fog(0x7ec8e3,65,120);

const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,180);
camera.position.set(0,9,23);
renderer.setSize(innerWidth,innerHeight);
window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

// ── Lights ──
scene.add(new THREE.AmbientLight(0xfff0dd,.7));
const sun=new THREE.DirectionalLight(0xfff5cc,1.3);
sun.position.set(8,18,10); sun.castShadow=true;
sun.shadow.camera.left=sun.shadow.camera.bottom=-60;
sun.shadow.camera.right=sun.shadow.camera.top=60;
sun.shadow.camera.far=150; sun.shadow.mapSize.set(2048,2048);
scene.add(sun);
scene.add(new THREE.HemisphereLight(0x87ceeb,0x4a8820,.4));

// ── Ground ──
const gnd=new THREE.Mesh(new THREE.PlaneGeometry(240,240),
  new THREE.MeshLambertMaterial({color:0x4a8820}));
gnd.rotation.x=-Math.PI/2; gnd.receiveShadow=true; scene.add(gnd);

// ── Farm layout constants ──
const PW=3.5, PG=0.5, COLS=3, ROWS=2;
const FW=COLS*(PW+PG);   // 12
const FD=ROWS*(PW+PG);   // 8

// 6 farm positions – wide enough to avoid overlap (FW=12, FD=8 → ~14×10 footprint)
const FARM_POS=[
  new THREE.Vector3(  0, 0,   0),  // mine
  new THREE.Vector3(-28, 0,   0),  // other1
  new THREE.Vector3( 28, 0,   0),  // other2
  new THREE.Vector3(  0, 0, -28),  // other3
  new THREE.Vector3(-28, 0, -28),  // other4
  new THREE.Vector3( 28, 0, -28),  // other5
];
const SHOP_POS=new THREE.Vector3(0,0,18);  // clearly south of all farms
const SHOP_INTERACT_R=4.5;
const PLOT_INTERACT_R=3.0;

const plotMeshes={}, plantGrps={}, farmGrps={};
let playerMesh=null;

// ── Helpers ──
function plotLP(i){
  return new THREE.Vector3(
    (i%COLS-(COLS-1)/2)*(PW+PG), 0,
    (Math.floor(i/COLS)-(ROWS-1)/2)*(PW+PG)
  );
}
function plotWP(fid,i){
  const fp=farmGrps[fid]?.position;
  const lp=plotLP(i);
  return new THREE.Vector3(
    (fp?fp.x:0)+lp.x, 0,
    (fp?fp.z:0)+lp.z
  );
}

// ── Build farm ──
function buildFarm(fid,center,isMe){
  if(farmGrps[fid]) return;
  const g=new THREE.Group(); g.position.copy(center); scene.add(g);
  farmGrps[fid]=g;

  const pM=new THREE.MeshLambertMaterial({color:0x8a6030});
  const rM=new THREE.MeshLambertMaterial({color:0xb07840});
  const hw=FW/2+0.7, hd=FD/2+0.7;

  // Grass pad
  const pad=new THREE.Mesh(new THREE.BoxGeometry(FW+1.4,0.15,FD+1.4),
    new THREE.MeshLambertMaterial({color:isMe?0x3d7018:0x2d5a10}));
  pad.position.y=-0.08; pad.receiveShadow=true; g.add(pad);

  // Fence posts
  [[-hw,-hd],[-hw/2,-hd],[0,-hd],[hw/2,-hd],[hw,-hd],
   [-hw,0],[hw,0],
   [-hw,hd],[-hw/2,hd],[0,hd],[hw/2,hd],[hw,hd]].forEach(([x,z])=>{
    const p=new THREE.Mesh(new THREE.BoxGeometry(.12,.8,.12),pM);
    p.position.set(x,.35,z); p.castShadow=true; g.add(p);
  });
  // Fence rails
  [[0,-hd,FW+1.4,'x'],[0,hd,FW+1.4,'x'],[-hw,0,FD+1.4,'z'],[hw,0,FD+1.4,'z']]
    .forEach(([x,z,len,ax])=>{
      [[.5],[.25]].forEach(([h])=>{
        const r=new THREE.Mesh(new THREE.BoxGeometry(ax==='x'?len:.09,.07,ax==='z'?len:.09),rM);
        r.position.set(x,h,z); g.add(r);
      });
    });

  // Name sign post
  const sp=new THREE.Mesh(new THREE.BoxGeometry(.1,1.2,.1),pM);
  sp.position.set(0,.6,-hd-0.3); g.add(sp);
  const sb=new THREE.Mesh(new THREE.BoxGeometry(isMe?2.2:1.8,.45,.08),rM);
  sb.position.set(0,1.1,-hd-0.3); g.add(sb);

  // Plots
  const plots=[], plants=[];
  for(let i=0;i<6;i++){
    const lp=plotLP(i);
    const pm=new THREE.Mesh(new THREE.BoxGeometry(PW,.14,PW),
      new THREE.MeshLambertMaterial({color:0x7a4a18}));
    pm.position.set(lp.x,0,lp.z); pm.receiveShadow=true;
    pm.userData={fid,idx:i}; g.add(pm); plots.push(pm);
    const pg=new THREE.Group();
    pg.position.set(lp.x,.08,lp.z); g.add(pg); plants.push(pg);
  }
  plotMeshes[fid]=plots; plantGrps[fid]=plants;
}

// ── Build shop ──
function buildShop(){
  const g=new THREE.Group(); g.position.copy(SHOP_POS); scene.add(g);

  const wM=new THREE.MeshLambertMaterial({color:0xb08050});
  const flM=new THREE.MeshLambertMaterial({color:0x9a7848});
  const rM=new THREE.MeshLambertMaterial({color:0x7a3a10});

  // Floor
  const fl=new THREE.Mesh(new THREE.BoxGeometry(6,0.15,5.5),flM);
  fl.position.y=.07; fl.receiveShadow=true; g.add(fl);
  // Back wall
  const bw=new THREE.Mesh(new THREE.BoxGeometry(6,2.8,.2),wM);
  bw.position.set(0,1.5,-2.6); bw.castShadow=true; g.add(bw);
  // Side walls
  [-3,3].forEach(x=>{
    const sw=new THREE.Mesh(new THREE.BoxGeometry(.2,2.8,5.5),wM);
    sw.position.set(x,1.5,0); sw.castShadow=true; g.add(sw);
  });
  // Roof
  const roof=new THREE.Mesh(new THREE.ConeGeometry(4.8,2.0,4),rM);
  roof.position.y=3.8; roof.rotation.y=Math.PI/4; roof.castShadow=true; g.add(roof);
  // Counter
  const ct=new THREE.Mesh(new THREE.BoxGeometry(4.5,.7,.55),
    new THREE.MeshLambertMaterial({color:0xd0a060}));
  ct.position.set(0,.5,2.1); g.add(ct);
  // Sign board
  const sb=new THREE.Mesh(new THREE.BoxGeometry(3,.65,.1),
    new THREE.MeshLambertMaterial({color:0x4a1a00}));
  sb.position.set(0,2.9,2.5); g.add(sb);
  const st=new THREE.Mesh(new THREE.BoxGeometry(2.5,.13,.12),
    new THREE.MeshBasicMaterial({color:0xffd700}));
  st.position.set(0,3.25,2.52); g.add(st);
}

// ── Decorations ──
function addDeco(){
  const treeMat=new THREE.MeshLambertMaterial({color:0x1e6c0a});
  const trunkMat=new THREE.MeshLambertMaterial({color:0x6a3a10});
  const flowerMat=new THREE.MeshLambertMaterial({color:0xffaacc});
  // Trees placed to avoid the 6 farm positions (±28, 0 and ±28, -28)
  const treePos=[
    [-10,0,10],[-6,0,12],[6,0,12],[10,0,10],
    [-14,0,-8],[14,0,-8],[-8,0,-8],[8,0,-8],
    [-14,0,10],[14,0,10],[-20,0,12],[20,0,12],
    [-14,0,-16],[14,0,-16],
    [-40,0,5],[40,0,5],[-40,0,-14],[40,0,-14],
    [-40,0,-30],[40,0,-30],[0,0,-40],
    [-20,0,-8],[20,0,-8],
  ];
  treePos.forEach(([x,,z])=>{
    const g=new THREE.Group(); g.position.set(x,0,z);
    const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.16,.22,1.1,6),trunkMat);
    trunk.position.y=.55; g.add(trunk);
    const crown=new THREE.Mesh(new THREE.SphereGeometry(.85+Math.random()*.55,7,6),treeMat);
    crown.position.y=1.8; g.add(crown);
    scene.add(g);
  });
  // Flowers
  const flowerZones=[
    [5,14],[8,14],[12,14],[-5,14],[-8,14],[-12,14],
    [12,-4],[-12,-4],[12,-12],[-12,-12],
  ];
  flowerZones.forEach(([x,z])=>{
    const g=new THREE.Group(); g.position.set(x,0,z);
    const stem=new THREE.Mesh(new THREE.CylinderGeometry(.02,.02,.32,4),
      new THREE.MeshLambertMaterial({color:0x3a8020}));
    stem.position.y=.16; g.add(stem);
    const fl=new THREE.Mesh(new THREE.SphereGeometry(.1,5,4),flowerMat);
    fl.position.y=.38; g.add(fl);
    scene.add(g);
  });
  // Path stones: farm 0 → shop
  for(let i=0;i<8;i++){
    const t=i/7;
    const stone=new THREE.Mesh(new THREE.CylinderGeometry(.28+Math.random()*.1,.33,.06,7),
      new THREE.MeshLambertMaterial({color:0xaaa090}));
    stone.position.set((Math.random()-.5)*.6,.01,t*16+0.5+(Math.random()-.5)*.5);
    scene.add(stone);
  }
}

// ── Player model (감자신) ──
let walkPhase=0;
function buildPlayerModel(){
  const g=new THREE.Group();

  const potatoM  = new THREE.MeshLambertMaterial({color:0xb07838});
  const hlM      = new THREE.MeshLambertMaterial({color:0xd4963c});
  const bumpM    = new THREE.MeshLambertMaterial({color:0x5a2c08});
  const eyeM     = new THREE.MeshLambertMaterial({color:0x111111});
  const eyeShM   = new THREE.MeshBasicMaterial({color:0xffffff});
  const stemM    = new THREE.MeshLambertMaterial({color:0x2a8030});
  const leafM    = new THREE.MeshLambertMaterial({color:0x38c040,side:THREE.DoubleSide});
  const gunDarkM = new THREE.MeshLambertMaterial({color:0x2e2e2e});
  const gunMidM  = new THREE.MeshLambertMaterial({color:0x444444});

  // ── 감자 몸통 ──
  const body=new THREE.Mesh(new THREE.SphereGeometry(0.9,16,12),potatoM);
  body.scale.set(1.1,1.0,1.05);
  body.position.y=0.9; body.castShadow=true; g.add(body);

  // 하이라이트
  const hl=new THREE.Mesh(new THREE.SphereGeometry(0.55,10,8),hlM);
  hl.scale.set(0.9,0.55,0.32);
  hl.position.set(-0.24,1.14,0.78); g.add(hl);

  // 감자 점
  [[0.50,1.40,0.50],[-0.58,0.82,0.62],[0.18,0.52,0.80]].forEach(([x,y,z])=>{
    const sp=new THREE.Mesh(new THREE.SphereGeometry(0.11,6,5),bumpM);
    sp.position.set(x,y,z); g.add(sp);
  });

  // ── 눈 ──
  [[-0.30,0],[0.30,0]].forEach(([x])=>{
    const eye=new THREE.Mesh(new THREE.SphereGeometry(0.13,8,6),eyeM);
    eye.position.set(x,0.94,0.86); g.add(eye);
    const shine=new THREE.Mesh(new THREE.SphereGeometry(0.055,5,4),eyeShM);
    shine.position.set(x+0.04,0.99,0.92); g.add(shine);
  });

  // ── 줄기 ──
  const stem=new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.075,0.52,6),stemM);
  stem.position.set(0,1.76,0); g.add(stem);

  // ── 잎 3개 (fan) ──
  [-35,0,35].forEach(deg=>{
    const rad=THREE.MathUtils.degToRad(deg);
    const leaf=new THREE.Mesh(new THREE.CylinderGeometry(0.30,0.30,0.06,8),leafM);
    leaf.position.set(Math.sin(rad)*0.26, 2.02+Math.cos(rad)*0.18, 0);
    leaf.rotation.z=rad; g.add(leaf);
  });

  // ── 팔 ──
  const armGeo=new THREE.CylinderGeometry(0.08,0.09,0.60,6);
  // 오른팔 (총 들기)
  const rArm=new THREE.Mesh(armGeo,potatoM);
  rArm.rotation.z=-(Math.PI/2+0.28);
  rArm.position.set(1.08,0.88,0); rArm.castShadow=true; g.add(rArm);
  // 왼팔
  const lArm=new THREE.Mesh(armGeo,potatoM);
  lArm.rotation.z= (Math.PI/2+0.28);
  lArm.position.set(-1.08,0.88,0); lArm.castShadow=true; g.add(lArm);

  // ── 총 ──
  const gunG=new THREE.Group();
  gunG.position.set(1.52,0.80,0);
  // 총 본체
  const gBody=new THREE.Mesh(new THREE.BoxGeometry(0.38,0.19,0.14),gunDarkM);
  gBody.position.x=0.13; gunG.add(gBody);
  // 손잡이
  const gGrip=new THREE.Mesh(new THREE.BoxGeometry(0.14,0.34,0.14),gunDarkM);
  gGrip.position.set(0,-0.21,0); gunG.add(gGrip);
  // 총신
  const gBarrel=new THREE.Mesh(new THREE.BoxGeometry(0.28,0.12,0.11),gunMidM);
  gBarrel.position.set(0.38,0.03,0); gunG.add(gBarrel);
  // 총구
  const gTip=new THREE.Mesh(new THREE.BoxGeometry(0.09,0.12,0.11),gunDarkM);
  gTip.position.set(0.57,0.03,0); gunG.add(gTip);
  // 방아쇠
  const gGuard=new THREE.Mesh(new THREE.TorusGeometry(0.09,0.028,5,8,Math.PI),gunDarkM);
  gGuard.rotation.z=Math.PI/2;
  gGuard.position.set(0,-0.04,0); gunG.add(gGuard);
  g.add(gunG);

  g.position.set(0,.01,12);
  scene.add(g);
  playerMesh=g;
}

// ── Plant visuals ──
function clearPG(pg){
  while(pg.children.length){
    const c=pg.children[0]; c.geometry?.dispose(); c.material?.dispose(); pg.remove(c);
  }
}
function rebuildPlant(fid,i){
  const pg=plantGrps[fid]?.[i]; if(!pg) return;
  clearPG(pg);
  const d=(farmData[fid]?.plots||[])[i];
  if(!d?.type||d?.harvested) return;
  const pt=PTM[d.type]; if(!pt) return;
  const prog=growProgress(d); if(prog<=0) return;
  const sc=.2+prog*.8;
  const col=pt.id==='rainbow'
    ?new THREE.Color().setHSL((Date.now()*.0004)%1,1,.55).getHex()
    :parseInt(pt.hex.replace('#',''),16);
  const bm=new THREE.MeshStandardMaterial({color:col,roughness:.6,
    metalness:pt.id==='golden'?.55:0,
    emissive:prog>=1?col:0,emissiveIntensity:prog>=1?.22:0});
  const body=new THREE.Mesh(new THREE.SphereGeometry(.3*sc,10,8),bm);
  body.position.y=.32*sc; body.castShadow=true; pg.add(body);
  if(prog>.28){
    const sm=new THREE.MeshLambertMaterial({color:0x2a8010});
    const stem=new THREE.Mesh(new THREE.CylinderGeometry(.05*sc,.07*sc,.4*sc,6),sm);
    stem.position.y=.68*sc; pg.add(stem);
    for(let j=0;j<4;j++){
      const a=(j/4)*Math.PI*2;
      const lm=new THREE.MeshLambertMaterial({color:0x1f9010,side:THREE.DoubleSide});
      const leaf=new THREE.Mesh(new THREE.ConeGeometry(.17*sc,.36*sc,5),lm);
      leaf.position.set(Math.cos(a)*.22*sc,.84*sc,Math.sin(a)*.22*sc);
      leaf.rotation.z=.65; leaf.rotation.y=a; pg.add(leaf);
    }
  }
  if(prog>=1){
    const rm=new THREE.MeshBasicMaterial({color:0xffee22,transparent:true,opacity:.7});
    const ring=new THREE.Mesh(new THREE.TorusGeometry(.45,.06,8,24),rm);
    ring.rotation.x=Math.PI/2; ring.position.y=.04; pg.add(ring);
    const pl=new THREE.PointLight(col,.9,3.0); pl.position.y=.8; pg.add(pl);
  }
}
function rebuildFarmPlants(fid){ for(let i=0;i<6;i++) rebuildPlant(fid,i); }

// ── Growth math ──
function growProgress(d){
  if(!d?.type||d?.harvested||!d?.plantedAt) return 0;
  const pt=PTM[d.type]; if(!pt) return 0;
  const base=pt.sec*1000;
  const saved=(d.waterBoost||0)*pt.sec*1000;
  return Math.min(1,(Date.now()-d.plantedAt)/Math.max(base-saved,base*.05));
}
function remainSec(d){
  const pt=PTM[d?.type]; if(!pt||!d?.plantedAt||d?.harvested) return 0;
  const base=pt.sec; const saved=(d.waterBoost||0)*pt.sec;
  return Math.max(0,Math.max(base-saved,base*.05)-(Date.now()-d.plantedAt)/1000);
}
function fmtS(s){ s=Math.ceil(s); return s<60?s+'초':s<3600?Math.floor(s/60)+'분'+(s%60?' '+s%60+'초':''):Math.floor(s/3600)+'시간'; }

// ── Firebase ──
function emptyFarm(n){ return {ownerName:n,lastActive:Date.now(),
  plots:Array.from({length:6},()=>({type:null,plantedAt:null,waterBoost:0,harvested:false}))}; }
async function ensureMyFarm(){
  const ref=doc(db,COLL,myId);
  const snap=await getDoc(ref);
  if(!snap.exists()) await setDoc(ref,emptyFarm(pName));
}
function subscribe(fid){
  if(farmUnsub[fid]) return;
  farmUnsub[fid]=onSnapshot(doc(db,COLL,fid),snap=>{
    if(snap.exists()) farmData[fid]=snap.data(); // never overwrite with null
    rebuildFarmPlants(fid);
  });
}
async function saveF(fid,data){
  const realId=slotRealId[fid]||fid;
  data.lastActive=Date.now();
  await setDoc(doc(db,COLL,realId),data);
}
async function loadOthers(){
  const snap=await getDocs(query(collection(db,COLL),orderBy('lastActive','desc'),limit(8)));
  const found=[];
  snap.forEach(d=>{ if(d.id!==myId&&found.length<5) found.push({id:d.id,data:d.data()}); });
  OTHER_SLOTS.forEach((sid,i)=>{
    const real=found[i];
    if(real){
      slotRealId[sid]=real.id;
      farmData[sid]=real.data;
      rebuildFarmPlants(sid);
      if(farmUnsub[sid]) farmUnsub[sid]();
      farmUnsub[sid]=onSnapshot(doc(db,COLL,real.id),snap=>{
        if(snap.exists()) farmData[sid]=snap.data();
        rebuildFarmPlants(sid);
      });
    }
  });
}

// ── UI ──
function updateHUD(){
  document.getElementById('hud-coins').textContent=`🪙 ${coins}`;
  document.getElementById('hud-wc').textContent=wc>0?`💧×${wc}`:'';
}
function showModal(title,html){
  document.getElementById('mt').textContent=title;
  document.getElementById('mb').innerHTML=html;
  document.getElementById('mo').classList.add('open');
}
window.closeModal=()=>document.getElementById('mo').classList.remove('open');
document.getElementById('mo').addEventListener('click',e=>{
  if(e.target===document.getElementById('mo')) closeModal();
});
let toastT;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.style.opacity='1';
  clearTimeout(toastT); toastT=setTimeout(()=>el.style.opacity='0',2500);
}

// ── Interaction ──
function checkNearby(){
  if(!playerMesh) return;
  const px=playerMesh.position.x, pz=playerMesh.position.z;
  nearTarget=null;

  const PR2=PLOT_INTERACT_R*PLOT_INTERACT_R;
  const allFarms=[myId,...OTHER_SLOTS];
  outer:for(const fid of allFarms){
    for(let i=0;i<6;i++){
      const wp=plotWP(fid,i);
      const dx=px-wp.x, dz=pz-wp.z;
      if(dx*dx+dz*dz<PR2){ nearTarget={type:'plot',fid,idx:i}; break outer; }
    }
  }
  if(!nearTarget){
    const dx=px-SHOP_POS.x, dz=pz-SHOP_POS.z;
    if(dx*dx+dz*dz<SHOP_INTERACT_R*SHOP_INTERACT_R) nearTarget={type:'shop'};
  }

  const hintEl=document.getElementById('hint');
  const hintTxt=document.getElementById('hint-text');
  if(!nearTarget){ hintEl.style.display='none'; return; }

  hintEl.style.display='block';
  if(nearTarget.type==='shop'){ hintTxt.textContent='상점 열기'; return; }

  const {fid,idx}=nearTarget;
  const mine=fid===myId;
  const d=(farmData[fid]?.plots||[])[idx];
  if(!d?.type||d?.harvested){
    hintTxt.textContent=mine?'심기':'관람 중';
  } else if(growProgress(d)>=1){
    hintTxt.textContent=mine?'🥔 수확!':'수확 준비 완료';
  } else if(wc>0){
    hintTxt.textContent=`💧 물주기 (${wc}회)`;
  } else {
    hintTxt.textContent=`⏳ ${fmtS(remainSec(d))} 남음`;
  }
}

function doInteract(){
  if(document.getElementById('mo').classList.contains('open')){ closeModal(); return; }
  if(!nearTarget) return;
  if(nearTarget.type==='shop'){ openShop(); return; }

  const {fid,idx}=nearTarget;
  const fd=farmData[fid];
  if(!fd||!Array.isArray(fd.plots)){ toast('농장 로딩 중...'); return; }
  const p=fd.plots[idx];
  if(p===undefined||p===null){ toast('칸 정보 오류'); return; }
  const mine=fid===myId;

  if(!p.type||p.harvested){
    if(!mine){ toast('관람만 가능합니다'); return; }
    openSeedModal(fid,idx); return;
  }
  if(growProgress(p)>=1){
    if(!mine){ toast('수확은 내 농장에서만'); return; }
    const pt=PTM[p.type];
    p.harvested=true; coins+=pt.coin; saveLS(); updateHUD();
    saveF(fid,fd);
    toast(`🥔 ${pt.name} 수확! +${pt.coin} 코인`); return;
  }
  if(wc>0){
    if((p.waterBoost||0)>=.9){ toast('이미 물을 충분히 주었습니다'); return; }
    p.waterBoost=Math.min(.9,(p.waterBoost||0)+WATER_SAVE);
    wc--; saveLS(); updateHUD();
    saveF(fid,fd);
    toast(`💧 물을 주었습니다! (${wc}회 남음)`);
  } else {
    toast(`⏳ ${fmtS(remainSec(p))} 남음 · 상점에서 물뿌리개 구매`);
  }
}

function openSeedModal(fid,idx){
  showModal('🌱 감자 선택',
    PT.map(pt=>`
      <div class="pc" onclick="doPlant('${fid}',${idx},'${pt.id}')">
        <div class="pcdot" style="background:${pt.hex}"></div>
        <div><div class="pcn">${pt.name}</div>
        <div class="pci">수확 +${pt.coin}코인 · ${fmtS(pt.sec)} 성장${pt.seed?` · 씨앗 ${pt.seed}코인`:' · 무료'}</div></div>
      </div>`).join('')
  );
}
window.doPlant=(fid,idx,tid)=>{
  const pt=PTM[tid];
  if(pt.seed>0&&coins<pt.seed){ toast(`씨앗 비용 ${pt.seed}코인 부족`); return; }
  const fd=farmData[fid];
  if(!fd||!Array.isArray(fd.plots)){ toast('농장 로딩 중...'); return; }
  if(pt.seed>0){ coins-=pt.seed; saveLS(); updateHUD(); }
  fd.plots[idx]={type:tid,plantedAt:Date.now(),waterBoost:0,harvested:false};
  saveF(fid,fd); closeModal();
  toast(`🌱 ${pt.name} 심기 완료!`);
  rebuildPlant(fid,idx);
};

function openShop(){
  showModal('🛒 도구 상점',`
    <div class="pc" onclick="buyWC()">
      <div class="pcdot" style="background:#4af"></div>
      <div><div class="pcn">💧 물뿌리개</div>
      <div class="pci">50코인 · 10회 사용 · 감자 가까이서 E키로 물주기 · 성장 25% 단축</div></div>
    </div>
    <div class="pc" onclick="buySpkr()">
      <div class="pcdot" style="background:#447"></div>
      <div><div class="pcn">🌀 스프링클러</div>
      <div class="pci">30코인 · 내 농장 모든 칸에 즉시 물 뿌리기</div></div>
    </div>
    <div class="pc" onclick="doReset()">
      <div class="pcdot" style="background:#600"></div>
      <div><div class="pcn">🔄 내 농장 초기화</div>
      <div class="pci">심어진 감자 모두 제거</div></div>
    </div>
  `);
}
window.buyWC=()=>{
  if(coins<50){ toast('코인 부족'); return; }
  coins-=50; wc+=10; saveLS(); updateHUD();
  toast('💧 물뿌리개 구입! 10회 사용 가능'); closeModal();
};
window.buySpkr=()=>{
  if(coins<30){ toast('코인 부족'); return; }
  const fd=farmData[myId];
  if(!fd||!Array.isArray(fd.plots)){ toast('농장 로딩 중...'); return; }
  coins-=30; saveLS(); updateHUD();
  fd.plots.forEach(p=>{
    if(!PTM[p?.type]||p.harvested||!p.plantedAt) return;
    p.waterBoost=Math.min(.9,(p.waterBoost||0)+WATER_SAVE);
  });
  saveF(myId,fd); rebuildFarmPlants(myId); closeModal();
  toast('🌀 스프링클러! 모든 칸에 물 뿌렸습니다');
};
window.doReset=()=>{
  if(!confirm('내 농장을 초기화할까요?')) return;
  const fd=emptyFarm(pName); farmData[myId]=fd; saveF(myId,fd);
  rebuildFarmPlants(myId); toast('농장 초기화 완료'); closeModal();
};

// ── Input ──
const keys={};
window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase(); keys[k]=true;
  if(k==='e'){ checkNearby(); doInteract(); }
  if(['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d'].includes(k)) e.preventDefault();
});
window.addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; });

// ── Camera orbit (점프맵 방식) ──
let cameraYaw=0, cameraPitch=0.5;
const CAM_DIST=16;
let isDragging=false, lastMX=0, lastMY=0;

canvas.addEventListener('mousedown',e=>{
  isDragging=true; lastMX=e.clientX; lastMY=e.clientY; e.preventDefault();
});
window.addEventListener('mousemove',e=>{
  if(!isDragging) return;
  cameraYaw  -=(e.clientX-lastMX)*0.005;
  cameraPitch-=(e.clientY-lastMY)*0.005;
  cameraPitch=Math.max(-0.8,Math.min(1.0,cameraPitch));
  lastMX=e.clientX; lastMY=e.clientY;
});
window.addEventListener('mouseup',()=>isDragging=false);
canvas.addEventListener('contextmenu',e=>e.preventDefault());

function updateCamera(){
  if(!playerMesh) return;
  const px=playerMesh.position.x, py=playerMesh.position.y, pz=playerMesh.position.z;
  const cx=px+Math.sin(cameraYaw)*Math.cos(cameraPitch)*CAM_DIST;
  const cy=py+Math.sin(cameraPitch)*CAM_DIST+1;
  const cz=pz+Math.cos(cameraYaw)*Math.cos(cameraPitch)*CAM_DIST;
  camera.position.lerp(new THREE.Vector3(cx,cy,cz),0.12);
  camera.lookAt(px,py+0.5,pz);
}

// ── Player movement (카메라 방향 기준) ──
const _fwd=new THREE.Vector3(), _rgt=new THREE.Vector3();
function movePlayer(){
  if(!playerMesh) return;
  if(document.getElementById('mo').classList.contains('open')) return;
  const spd=.1;
  _fwd.set(-Math.sin(cameraYaw),0,-Math.cos(cameraYaw));
  _rgt.set( Math.cos(cameraYaw),0,-Math.sin(cameraYaw));
  let vx=0, vz=0;
  if(keys['w']||keys['arrowup'])    { vx+=_fwd.x; vz+=_fwd.z; }
  if(keys['s']||keys['arrowdown'])  { vx-=_fwd.x; vz-=_fwd.z; }
  if(keys['a']||keys['arrowleft'])  { vx-=_rgt.x; vz-=_rgt.z; }
  if(keys['d']||keys['arrowright']) { vx+=_rgt.x; vz+=_rgt.z; }
  if(vx||vz){
    const len=Math.hypot(vx,vz)||1;
    vx=vx/len*spd; vz=vz/len*spd;
    playerMesh.position.x+=vx;
    playerMesh.position.z+=vz;
    playerMesh.position.x=Math.max(-55,Math.min(55,playerMesh.position.x));
    playerMesh.position.z=Math.max(-55,Math.min(55,playerMesh.position.z));
    const tA=Math.atan2(vx,vz);
    let da=tA-playerMesh.rotation.y;
    while(da>Math.PI) da-=Math.PI*2; while(da<-Math.PI) da+=Math.PI*2;
    playerMesh.rotation.y+=da*.2;
    walkPhase+=.2;
    playerMesh.position.y=Math.abs(Math.sin(walkPhase))*.07;
  } else {
    playerMesh.position.y*=.85;
  }
}

// ── Animate ──
let frame=0;
function animate(){
  requestAnimationFrame(animate); frame++;
  movePlayer();
  if(frame%2===0) checkNearby();
  updateCamera();
  if(frame%90===0) Object.keys(farmData).forEach(rebuildFarmPlants);
  if(frame%8===0){
    for(const fid of Object.keys(plantGrps)){
      (farmData[fid]?.plots||[]).forEach((p,i)=>{
        if(p?.type!=='rainbow'||p.harvested) return;
        plantGrps[fid]?.[i]?.children.forEach(c=>{
          if(c.material?.color) c.material.color.setHSL((Date.now()*.0004+i*.2)%1,1,.55);
        });
      });
    }
  }
  renderer.render(scene,camera);
}

// ── Init ──
async function init(){
  let name=localStorage.getItem(LS.nm);
  if(!name){
    name=(prompt('닉네임을 입력하세요 (2~12자)')||'감자농부').trim().slice(0,12)||'감자농부';
    localStorage.setItem(LS.nm,name);
  }
  pName=name; myId=name;
  document.getElementById('hud-name').textContent=name;
  loadLS(); updateHUD();

  buildPlayerModel();
  buildFarm(myId,FARM_POS[0],true);
  farmData[myId]=emptyFarm(pName);
  OTHER_SLOTS.forEach((sid,i)=>{
    buildFarm(sid,FARM_POS[i+1],false);
    farmData[sid]=emptyFarm('');
  });
  buildShop();
  addDeco();
  animate();

  try{
    await ensureMyFarm();
    subscribe(myId);
    await loadOthers();
  } catch(e){
    console.error(e); toast('⚠️ 네트워크 오류 - 오프라인');
  }
}
init().catch(console.error);
</script>
