<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🥔 감자 키우기</title>
<style>
* { margin:0;padding:0;box-sizing:border-box; }
body { overflow:hidden; font-family:'Malgun Gothic',sans-serif; }
canvas { display:block; }

#hud {
  position:fixed; top:0; left:0; right:0;
  display:flex; align-items:center; padding:9px 16px; gap:10px;
  background:rgba(0,0,0,.6); backdrop-filter:blur(4px); z-index:10; pointer-events:none;
}
#hud h1 { font-size:16px; color:#f5d060; }
#hud-name { font-size:13px; color:#bbb; }
#hud-coins { margin-left:auto; font-size:15px; color:#f5d060; font-weight:bold; }
#hud-wc { font-size:13px; color:#4af; }
#hud-si { font-size:13px; color:#7ddc44; }
#hud-pi { font-size:13px; color:#f5a623; }

#hint {
  position:fixed; bottom:70px; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,.82); color:#fff; padding:8px 22px;
  border-radius:22px; font-size:14px; border:1.5px solid rgba(255,255,255,.2);
  pointer-events:none; display:none; z-index:20; white-space:nowrap;
}
#hint kbd {
  display:inline-block; background:#444; border:1px solid #666;
  border-radius:4px; padding:1px 6px; font-size:12px; margin-right:4px;
}
#ctrl-hint {
  position:fixed; bottom:12px; left:50%; transform:translateX(-50%);
  color:rgba(255,255,255,.35); font-size:11px; pointer-events:none; z-index:10;
}
#inv-btn {
  position:fixed; top:52px; right:16px;
  background:rgba(0,0,0,.72); border:1.5px solid #c8a050;
  border-radius:12px; padding:7px 14px; font-size:20px;
  cursor:pointer; z-index:20; transition:background .15s;
  backdrop-filter:blur(4px);
}
#inv-btn:hover { background:rgba(40,24,0,.9); }
#tut {
  position:fixed; top:58px; left:50%; transform:translateX(-50%);
  background:rgba(10,8,0,.93); border:2px solid #f5d060;
  border-radius:14px; padding:14px 22px 10px;
  z-index:30; max-width:330px; width:88%;
  text-align:center; backdrop-filter:blur(4px);
  box-shadow:0 4px 24px rgba(0,0,0,.6);
}
#tut-step { font-size:11px; color:#f5d060; margin-bottom:4px; letter-spacing:1px; }
#tut-msg { color:#fff; font-size:14px; line-height:1.65; white-space:pre-line; display:block; }
#tut-skip {
  margin-top:9px; background:none; border:1px solid #444;
  color:#666; font-size:11px; border-radius:6px;
  padding:3px 12px; cursor:pointer;
}
#tut-skip:hover { color:#999; border-color:#666; }

#mo {
  position:fixed; inset:0; background:rgba(0,0,0,.75);
  display:none; align-items:center; justify-content:center; z-index:50;
}
#mo.open { display:flex; }
#mp {
  background:#181200; border:2px solid #c8a050; border-radius:14px;
  padding:22px; min-width:300px; max-width:460px; width:90%;
  max-height:80vh; overflow-y:auto;
}
#mp h2 { color:#f5d060; margin-bottom:14px; font-size:17px; }
.pc {
  display:flex; align-items:center; gap:10px;
  padding:10px 12px; border:1px solid #333; border-radius:9px;
  cursor:pointer; margin-bottom:8px; transition:background .12s;
}
.pc:hover { background:#251800; border-color:#c8a050; }
.pcdot { width:26px; height:26px; border-radius:50%; flex-shrink:0; }
.pcn { font-size:13px; font-weight:bold; color:#fff; }
.pci { font-size:11px; color:#888; margin-top:2px; }
.mclose {
  margin-top:12px; padding:7px 22px; border:1px solid #444;
  border-radius:8px; background:#222; cursor:pointer; color:#aaa; font-size:13px;
}
.mclose:hover { color:#fff; }

#toast {
  position:fixed; bottom:52px; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,.88); color:#fff; padding:7px 18px;
  border-radius:20px; font-size:13px; pointer-events:none;
  opacity:0; transition:opacity .3s; z-index:99;
}
</style>
</head>

<script type="module">

// ── Firebase ──

const COLL = 'potato_farms';

// ── Potato types ──
const PT = [
  {id:'common',  name:'일반 감자',    coin:4,    sec:10,    hex:'#c8a050', seed:0  },
  {id:'unusual', name:'특이한 감자',  coin:15,   sec:40,    hex:'#50c870', seed:8  },
  {id:'good',    name:'좋은 감자',    coin:38,   sec:180,   hex:'#5088ff', seed:20 },
  {id:'great',   name:'훌륭한 감자',  coin:75,   sec:360,   hex:'#b060ff', seed:40 },
  {id:'king',    name:'대왕 감자',    coin:120,  sec:700,   hex:'#ff5555', seed:80 },
  {id:'rainbow', name:'레인보우 감자',coin:300,  sec:1800,  hex:'#ffffff', seed:150},
  {id:'golden',  name:'황금 감자',    coin:600,  sec:3600,  hex:'#ffd700', seed:300},
];
const PTM = Object.fromEntries(PT.map(p=>[p.id,p]));
const WATER_SAVE = 0.25;
// Stock prob for premium seeds (re-rolled each shop open)
const STOCK_PROB={king:1/3, rainbow:0.25, golden:0.15};
let shopStock={};

// ── Weather ──
const WEATHER_DEFS=[
  {id:'clear',   prob:0.62, emoji:'☀️',  label:'맑음',   sky:0x7ec8e3, fog:0x7ec8e3},
  {id:'rain',    prob:0.10, emoji:'🌧️', label:'비',     sky:0x445566, fog:0x445566},
  {id:'storm',   prob:0.08, emoji:'⛈️',  label:'폭풍우', sky:0x223344, fog:0x223344},
  {id:'snow',    prob:0.10, emoji:'🌨️', label:'눈',     sky:0x99aabb, fog:0x99aabb},
  {id:'aurora',  prob:0.05, emoji:'🌌',  label:'오로라', sky:0x000033, fog:0x001122},
  {id:'meteor',  prob:0.05, emoji:'🌠',  label:'별똥별', sky:0x000011, fog:0x000011},
];
const WEATHER_EFFECTS={
  rain:   [{name:'비',     prob:.10,  mult:1.25}],
  storm:  [{name:'비',     prob:.10,  mult:1.25},{name:'천둥',   prob:.05,  mult:2.25}],
  snow:   [{name:'눈꽃',   prob:.125, mult:1.15},{name:'동결',   prob:.075, mult:2.0}],
  aurora: [{name:'오로라', prob:.025, mult:6.0}],
  meteor: [{name:'별똥별', prob:.01,  mult:10.0}],
};
const EFFECT_MULT={'비':1.25,'천둥':2.25,'눈꽃':1.15,'동결':2.0,'오로라':6.0,'별똥별':10.0};
const EFFECT_COLOR={'비':0x4488ff,'천둥':0xffff00,'눈꽃':0xaaddff,'동결':0x88eeff,'오로라':0xff44ff,'별똥별':0xffffaa};
const WEATHER_DURATION=5*60*1000;
const LS_WEA='pf2_wea';
let currentWeather='clear';
let weatherVfx=null;
let pvx=0, pvz=0;

// ── LocalStorage ──
const LS = {nm:'pf2_name', co:'pf2_coins', wc:'pf2_wc', si:'pf2_seeds', pi:'pf2_potatoes', dl:'pf2_daily', sk:'pf2_stock', fd:'pf2_farm'};
const STOCK_TTL=10*60*1000;
let pName='', coins=0, wc=0, seedInv={}, potatoInv={}, dailyBuy={};
function loadLS(){
  coins=+(localStorage.getItem(LS.co)||0);
  wc=+(localStorage.getItem(LS.wc)||0);
  try{ seedInv=JSON.parse(localStorage.getItem(LS.si)||'{}'); }catch(e){ seedInv={}; }
  try{ potatoInv=JSON.parse(localStorage.getItem(LS.pi)||'{}'); }catch(e){ potatoInv={}; }
  try{ dailyBuy=JSON.parse(localStorage.getItem(LS.dl)||'{}'); }catch(e){ dailyBuy={}; }
}
function saveLS(){
  localStorage.setItem(LS.co,coins);
  localStorage.setItem(LS.wc,wc);
  localStorage.setItem(LS.si,JSON.stringify(seedInv));
  localStorage.setItem(LS.pi,JSON.stringify(potatoInv));
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function getDailyBuy(tid){
  if(!dailyBuy.date||dailyBuy.date!==todayStr()) dailyBuy={date:todayStr()};
  return dailyBuy[tid]||0;
}
function incDailyBuy(tid){
  if(!dailyBuy.date||dailyBuy.date!==todayStr()) dailyBuy={date:todayStr()};
  dailyBuy[tid]=(dailyBuy[tid]||0)+1;
  localStorage.setItem(LS.dl,JSON.stringify(dailyBuy));
}

// ── State ──
let myId='';
const farmData={}, farmUnsub={};
const OTHER_SLOTS=['__s1','__s2','__s3','__s4','__s5'];
const slotRealId={};
let nearTarget=null;

// ── Renderer ──
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x7ec8e3);
scene.fog=new THREE.Fog(0x7ec8e3,65,120);

const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,180);
camera.position.set(0,9,23);
renderer.setSize(innerWidth,innerHeight);
window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

// ── Lights ──
scene.add(new THREE.AmbientLight(0xfff0dd,.7));
const sun=new THREE.DirectionalLight(0xfff5cc,1.3);
sun.position.set(8,18,10); sun.castShadow=true;
sun.shadow.camera.left=sun.shadow.camera.bottom=-60;
sun.shadow.camera.right=sun.shadow.camera.top=60;
sun.shadow.camera.far=150; sun.shadow.mapSize.set(2048,2048);
scene.add(sun);
scene.add(new THREE.HemisphereLight(0x87ceeb,0x4a8820,.4));

// ── Ground ──
const gnd=new THREE.Mesh(new THREE.PlaneGeometry(240,240),
  new THREE.MeshLambertMaterial({color:0x4a8820}));
gnd.rotation.x=-Math.PI/2; gnd.receiveShadow=true; scene.add(gnd);

// ── Farm layout constants ──
const PW=3.5, PG=0.5, COLS=3, ROWS=2;
const FW=COLS*(PW+PG);   // 12
const FD=ROWS*(PW+PG);   // 8

// 6 farm positions – wide enough to avoid overlap (FW=12, FD=8 → ~14×10 footprint)
const FARM_POS=[
  new THREE.Vector3(  0, 0,   0),  // mine
  new THREE.Vector3(-28, 0,   0),  // other1
  new THREE.Vector3( 28, 0,   0),  // other2
  new THREE.Vector3(  0, 0, -28),  // other3
  new THREE.Vector3(-28, 0, -28),  // other4
  new THREE.Vector3( 28, 0, -28),  // other5
];
const SHOP_POS=new THREE.Vector3(0,0,18);
const MARKET_POS=new THREE.Vector3(18,0,18);
const GOLDEN_TREE_POS=new THREE.Vector3(0,0,-52);
const GOLDEN_TREE_R=3.5;
const LS_GTCD='pf2_gt_cd';
const TREE_PRESS_NEED=8;
const TREE_PRESS_WINDOW=2500;
let treePressCt=0, treePressTime=0;
const SHOP_INTERACT_R=4.5;
const MARKET_INTERACT_R=4.5;
const PLOT_INTERACT_R=3.0;
const MAX_PER_PLOT=4;

const plotMeshes={}, plantGrps={}, farmGrps={};
let playerMesh=null;

// ── Cached plot world coords (x,z only — no Vector3 allocation per frame) ──
const plotWC={}; // plotWC[fid][i] = {x,z}
function buildPlotWC(){
  [myId,...OTHER_SLOTS].forEach(fid=>{
    plotWC[fid]=[];
    const fp=farmGrps[fid]?.position||{x:0,z:0};
    for(let i=0;i<6;i++){
      const lx=(i%COLS-(COLS-1)/2)*(PW+PG);
      const lz=(Math.floor(i/COLS)-(ROWS-1)/2)*(PW+PG);
      plotWC[fid][i]={x:fp.x+lx, z:fp.z+lz};
    }
  });
}

// ── Helpers ──
function plotLP(i){
  return new THREE.Vector3(
    (i%COLS-(COLS-1)/2)*(PW+PG), 0,
    (Math.floor(i/COLS)-(ROWS-1)/2)*(PW+PG)
  );
}
function plotWP(fid,i){
  if(plotWC[fid]?.[i]) return plotWC[fid][i];
  const fp=farmGrps[fid]?.position;
  const lp=plotLP(i);
  return {x:(fp?fp.x:0)+lp.x, z:(fp?fp.z:0)+lp.z};
}

// ── Pre-created shared plant materials (never disposed) ──
const SM={
  stem: Object.assign(new THREE.MeshLambertMaterial({color:0x2a8010}),{_s:1}),
  leaf: Object.assign(new THREE.MeshLambertMaterial({color:0x1f9010,side:THREE.DoubleSide}),{_s:1}),
  ring: Object.assign(new THREE.MeshBasicMaterial({color:0xffee22,transparent:true,opacity:.7}),{_s:1}),
};
const PM={}; // body material per type × ready state
function initPM(){
  PT.forEach(pt=>{
    const c=parseInt(pt.hex.replace('#',''),16);
    PM[pt.id]    =Object.assign(new THREE.MeshLambertMaterial({color:c}),{_s:1});
    PM[pt.id+'r']=Object.assign(new THREE.MeshLambertMaterial({color:c,emissive:c,emissiveIntensity:.35}),{_s:1});
  });
}

// ── Cached DOM refs ──
const _moEl=()=>document.getElementById('mo');
const _hintEl=document.createElement('div'); // filled after DOM ready
let _hintElRef=null, _hintTxtRef=null;
function getHintEl(){ return _hintElRef||(_hintElRef=document.getElementById('hint')); }
function getHintTxt(){ return _hintTxtRef||(_hintTxtRef=document.getElementById('hint-text')); }

// ── Build farm ──
function buildFarm(fid,center,isMe){
  if(farmGrps[fid]) return;
  const g=new THREE.Group(); g.position.copy(center); scene.add(g);
  farmGrps[fid]=g;

  const pM=new THREE.MeshLambertMaterial({color:0x8a6030});
  const rM=new THREE.MeshLambertMaterial({color:0xb07840});
  const hw=FW/2+0.7, hd=FD/2+0.7;

  // Grass pad
  const pad=new THREE.Mesh(new THREE.BoxGeometry(FW+1.4,0.15,FD+1.4),
    new THREE.MeshLambertMaterial({color:isMe?0x3d7018:0x2d5a10}));
  pad.position.y=-0.08; pad.receiveShadow=true; g.add(pad);

  // Fence posts
  [[-hw,-hd],[-hw/2,-hd],[0,-hd],[hw/2,-hd],[hw,-hd],
   [-hw,0],[hw,0],
   [-hw,hd],[-hw/2,hd],[0,hd],[hw/2,hd],[hw,hd]].forEach(([x,z])=>{
    const p=new THREE.Mesh(new THREE.BoxGeometry(.12,.8,.12),pM);
    p.position.set(x,.35,z); p.castShadow=true; g.add(p);
  });
  // Fence rails
  [[0,-hd,FW+1.4,'x'],[0,hd,FW+1.4,'x'],[-hw,0,FD+1.4,'z'],[hw,0,FD+1.4,'z']]
    .forEach(([x,z,len,ax])=>{
      [[.5],[.25]].forEach(([h])=>{
        const r=new THREE.Mesh(new THREE.BoxGeometry(ax==='x'?len:.09,.07,ax==='z'?len:.09),rM);
        r.position.set(x,h,z); g.add(r);
      });
    });

  // Name sign post
  const sp=new THREE.Mesh(new THREE.BoxGeometry(.1,1.2,.1),pM);
  sp.position.set(0,.6,-hd-0.3); g.add(sp);
  const sb=new THREE.Mesh(new THREE.BoxGeometry(isMe?2.2:1.8,.45,.08),rM);
  sb.position.set(0,1.1,-hd-0.3); g.add(sb);

  // Plots
  const plots=[], plants=[];
  for(let i=0;i<6;i++){
    const lp=plotLP(i);
    const pm=new THREE.Mesh(new THREE.BoxGeometry(PW,.14,PW),
      new THREE.MeshLambertMaterial({color:0x7a4a18}));
    pm.position.set(lp.x,0,lp.z); pm.receiveShadow=true;
    pm.userData={fid,idx:i}; g.add(pm); plots.push(pm);
    const pg=new THREE.Group();
    pg.position.set(lp.x,.08,lp.z); g.add(pg); plants.push(pg);
  }
  plotMeshes[fid]=plots; plantGrps[fid]=plants;
}

// ── Farmer potato NPC ──
function buildFarmerNPC(g, x, y, z){
  const n=new THREE.Group(); n.position.set(x,y,z); n.rotation.y=Math.PI; n.scale.setScalar(1.5);
  const pM=new THREE.MeshLambertMaterial({color:0xb07838});
  const hlM=new THREE.MeshLambertMaterial({color:0xd4963c});
  const eyeM=new THREE.MeshLambertMaterial({color:0x111111});
  const eyeShM=new THREE.MeshBasicMaterial({color:0xffffff});
  const hatM=new THREE.MeshLambertMaterial({color:0x5a2e08});
  const hatBM=new THREE.MeshLambertMaterial({color:0x30160a});
  const bandM=new THREE.MeshLambertMaterial({color:0x9a5520});
  const stemM=new THREE.MeshLambertMaterial({color:0x2a8030});
  // Body
  const body=new THREE.Mesh(new THREE.SphereGeometry(.42,10,8),pM);
  body.scale.set(1.05,1.0,1.02); body.position.y=.42; n.add(body);
  // Highlight
  const hl=new THREE.Mesh(new THREE.SphereGeometry(.24,8,6),hlM);
  hl.scale.set(.88,.52,.3); hl.position.set(-.11,.55,.36); n.add(hl);
  // Bump spots
  [[.22,.62,.38],[-.26,.38,.42]].forEach(([bx,by,bz])=>{
    const sp=new THREE.Mesh(new THREE.SphereGeometry(.052,5,4),new THREE.MeshLambertMaterial({color:0x5a2c08}));
    sp.position.set(bx,by,bz); n.add(sp);
  });
  // Eyes
  [-.14,.14].forEach(ex=>{
    const eye=new THREE.Mesh(new THREE.SphereGeometry(.062,7,5),eyeM);
    eye.position.set(ex,.45,.38); n.add(eye);
    const sh=new THREE.Mesh(new THREE.SphereGeometry(.026,4,3),eyeShM);
    sh.position.set(ex+.02,.47,.41); n.add(sh);
  });
  // Stem
  const stem=new THREE.Mesh(new THREE.CylinderGeometry(.022,.036,.22,5),stemM);
  stem.position.set(0,.82,0); n.add(stem);
  // Hat brim
  const brim=new THREE.Mesh(new THREE.CylinderGeometry(.4,.4,.045,14),hatBM);
  brim.position.set(0,.88,0); n.add(brim);
  // Hat crown
  const crown=new THREE.Mesh(new THREE.CylinderGeometry(.19,.27,.32,9),hatM);
  crown.position.set(0,1.09,0); n.add(crown);
  // Hat band
  const band=new THREE.Mesh(new THREE.CylinderGeometry(.275,.275,.06,9),bandM);
  band.position.set(0,.93,0); n.add(band);
  // Arms
  const aG=new THREE.CylinderGeometry(.042,.048,.26,5);
  const rArm=new THREE.Mesh(aG,pM); rArm.rotation.z=-(Math.PI/2+.35); rArm.position.set(.5,.38,0); n.add(rArm);
  const lArm=new THREE.Mesh(aG,pM); lArm.rotation.z= (Math.PI/2+.35); lArm.position.set(-.5,.38,0); n.add(lArm);
  g.add(n);
}

// ── Build shop ──
function buildShop(){
  const g=new THREE.Group(); g.position.copy(SHOP_POS); scene.add(g);

  const wM=new THREE.MeshLambertMaterial({color:0xb08050});
  const flM=new THREE.MeshLambertMaterial({color:0x9a7848});
  const rM=new THREE.MeshLambertMaterial({color:0x7a3a10});

  // Floor
  const fl=new THREE.Mesh(new THREE.BoxGeometry(6,0.15,5.5),flM);
  fl.position.y=.07; fl.receiveShadow=true; g.add(fl);
  // Back wall (south side – open face is north toward farms)
  const bw=new THREE.Mesh(new THREE.BoxGeometry(6,2.8,.2),wM);
  bw.position.set(0,1.5,2.6); bw.castShadow=true; g.add(bw);
  // Side walls
  [-3,3].forEach(x=>{
    const sw=new THREE.Mesh(new THREE.BoxGeometry(.2,2.8,5.5),wM);
    sw.position.set(x,1.5,0); sw.castShadow=true; g.add(sw);
  });
  // Roof
  const roof=new THREE.Mesh(new THREE.ConeGeometry(4.8,2.0,4),rM);
  roof.position.y=3.8; roof.rotation.y=Math.PI/4; roof.castShadow=true; g.add(roof);

// ── Weather VFX ──
function buildWeatherVfx(wid){
  if(weatherVfx){ scene.remove(weatherVfx); weatherVfx=null; }
  if(wid==='clear') return;
  const g=new THREE.Group(); weatherVfx=g; scene.add(g);
  if(wid==='rain'||wid==='storm'){
    const n=wid==='storm'?1300:750;
    const pos=new Float32Array(n*3);
    for(let i=0;i<n;i++){ pos[i*3]=(Math.random()-.5)*90; pos[i*3+1]=Math.random()*36; pos[i*3+2]=(Math.random()-.5)*90; }
    const geo=new THREE.BufferGeometry(); geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
    const mat=new THREE.PointsMaterial({color:wid==='storm'?0x6688cc:0x88aaee,size:.18,transparent:true,opacity:.7});
    g._rain=new THREE.Points(geo,mat); g._rainSpd=wid==='storm'?.6:.35; g._ltTimer=wid==='storm'?200:null;
    g.add(g._rain);
  }
  if(wid==='snow'){
    const n=550; const pos=new Float32Array(n*3);
    for(let i=0;i<n;i++){ pos[i*3]=(Math.random()-.5)*90; pos[i*3+1]=Math.random()*30; pos[i*3+2]=(Math.random()-.5)*90; }
    const geo=new THREE.BufferGeometry(); geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
    g._snow=new THREE.Points(geo,new THREE.PointsMaterial({color:0xffffff,size:.28,transparent:true,opacity:.85}));
    g.add(g._snow);
  }
  if(wid==='aurora'){
    const cols=[0x00ff88,0x0066ff,0xff00cc,0x00ffcc,0x88ff00];
    for(let i=0;i<5;i++){
      const m=new THREE.Mesh(new THREE.PlaneGeometry(75,14+Math.random()*10),
        new THREE.MeshBasicMaterial({color:cols[i],transparent:true,opacity:.10+Math.random()*.08,side:THREE.DoubleSide,depthWrite:false}));
      m.position.set((i-2)*15,35+Math.random()*5,-8+Math.random()*6);
      m.rotation.x=-.22+Math.random()*.1; m.rotation.z=(Math.random()-.5)*.2;
      m._baseY=m.position.y; m._phase=Math.random()*Math.PI*2; g.add(m);
    }
  }
  if(wid==='meteor'){
    g._meteors=[]; g._nextMeteor=Date.now()+500+Math.random()*2500;
  }
}
function spawnMeteor(g){
  const m=new THREE.Mesh(new THREE.SphereGeometry(.25,5,4),
    new THREE.MeshBasicMaterial({color:0xffffff,transparent:true}));
  m.position.set((Math.random()-.5)*60,42+Math.random()*8,(Math.random()-.5)*50);
  m._vel=new THREE.Vector3(1.8+Math.random(),-.9-.5*Math.random(),.4+Math.random()*.4);
  m._life=1.0; g._meteors.push(m); g.add(m);
}
function tickWeatherVfx(){
  if(!weatherVfx) return;
  const g=weatherVfx;
  if(g._rain){
    const p=g._rain.geometry.attributes.position;
    for(let i=0;i<p.count;i++){
      p.setY(i,p.getY(i)-g._rainSpd);
      if(p.getY(i)<-1){ p.setY(i,35); p.setX(i,(Math.random()-.5)*90); p.setZ(i,(Math.random()-.5)*90); }
    }
    p.needsUpdate=true;
    if(g._ltTimer!==null){ g._ltTimer--;
      if(g._ltTimer<=0){ g._ltTimer=160+Math.floor(Math.random()*260);
        scene.background=new THREE.Color(0xccccff);
        setTimeout(()=>{ const wd=WEATHER_DEFS.find(d=>d.id===currentWeather); if(wd) scene.background=new THREE.Color(wd.sky); },90); }
    }
  }
  if(g._snow){
    const p=g._snow.geometry.attributes.position;
    for(let i=0;i<p.count;i++){
      p.setY(i,p.getY(i)-.055); p.setX(i,p.getX(i)+Math.sin(Date.now()*.0008+i)*.014);
      if(p.getY(i)<-1) p.setY(i,29);
    }
    p.needsUpdate=true;
  }
  g.children.forEach(c=>{ if(c._baseY!==undefined){ c.position.y=c._baseY+Math.sin(Date.now()*.0006+c._phase)*2; c.material.opacity=.07+Math.abs(Math.sin(Date.now()*.0004+c._phase))*.13; } });
  if(g._meteors){
    if(Date.now()>g._nextMeteor){ spawnMeteor(g); g._nextMeteor=Date.now()+2000+Math.random()*4000; }
    for(let i=g._meteors.length-1;i>=0;i--){ const m=g._meteors[i]; m.position.add(m._vel); m._life-=.022; m.material.opacity=m._life; if(m._life<=0||m.position.y<0){ g.remove(m); g._meteors.splice(i,1); } }
  }
}
function parsePotatoKey(key){
  let k=key, effect=null, mult=1, giant=false;
  for(const [en,em] of Object.entries(EFFECT_MULT)){
    if(k.endsWith('_'+en)){ effect=en; mult=em; k=k.slice(0,-(en.length+1)); break; }
  }
  if(k.endsWith('_g')){ giant=true; k=k.slice(0,-2); }
  return {type:k, giant, effect, mult, pt:PTM[k]||null};
}
function harvestKey(type,giant,effect){ return type+(giant?'_g':'')+(effect?'_'+effect:''); }
function rollWeather(){
  const r=Math.random(); let cum=0;
  for(const w of WEATHER_DEFS){ cum+=w.prob; if(r<cum){ setWeather(w.id); return; } }
  setWeather('clear');
}
function setWeather(id){
  currentWeather=id;
  localStorage.setItem(LS_WEA,JSON.stringify({id,t:Date.now()}));
  buildWeatherVfx(id);
  const wd=WEATHER_DEFS.find(d=>d.id===id);
  if(wd){ scene.background=new THREE.Color(wd.sky); scene.fog.color.set(wd.fog); }
  applyWeatherToFarm();
  document.getElementById('hud-weather').textContent=wd&&wd.id!=='clear'?wd.emoji+' '+wd.label:'';
  if(wd&&wd.id!=='clear') toast(wd.emoji+' '+wd.label+' 날씨가 시작됐습니다!');
}
function applyWeatherToFarm(){
  const effects=WEATHER_EFFECTS[currentWeather]; if(!effects) return;
  const fd=farmData[myId]; if(!fd||!Array.isArray(fd.plots)) return;
  let changed=false;
  fd.plots.forEach(plot=>{ if(!Array.isArray(plot)) return;
    plot.forEach(p=>{ if(!p||!p.type||p.harvested||p.weatherEffect) return;
      for(const eff of effects){ if(Math.random()<eff.prob){ p.weatherEffect=eff.name; p.weatherMult=eff.mult; changed=true; break; } }
    });
  });
  if(changed){ saveF(myId,fd); rebuildFarmPlants(myId); }
}
function loadWeather(){
  try{
    const d=JSON.parse(localStorage.getItem(LS_WEA)||'null');
    if(d&&Date.now()-d.t<WEATHER_DURATION){
      currentWeather=d.id;
      const wd=WEATHER_DEFS.find(w=>w.id===d.id);
      if(wd){ scene.background=new THREE.Color(wd.sky); scene.fog.color.set(wd.fog); }
      document.getElementById('hud-weather').textContent=wd&&wd.id!=='clear'?wd.emoji+' '+wd.label:'';
      buildWeatherVfx(d.id);
      const rem=WEATHER_DURATION-(Date.now()-d.t);
      setTimeout(()=>{ rollWeather(); setInterval(rollWeather,WEATHER_DURATION); },rem);
    } else { rollWeather(); setInterval(rollWeather,WEATHER_DURATION); }
  }catch(e){ rollWeather(); setInterval(rollWeather,WEATHER_DURATION); }
}

// ── Plant layout helpers ──
function plantOffsets(n){
  if(n<=1) return [[0,0]];
  if(n===2) return [[-0.65,0],[0.65,0]];
  if(n===3) return [[-0.65,-0.35],[0.65,-0.35],[0,0.6]];
  return [[-0.65,-0.5],[0.65,-0.5],[-0.65,0.5],[0.65,0.5]];
}

// ── Plant visuals ──
function clearPG(pg){
  while(pg.children.length){
    const c=pg.children[0];
    c.traverse(obj=>{
      obj.geometry?.dispose();
      const m=obj.material;
      if(!m||m._s) return; // skip shared materials
      if(Array.isArray(m)) m.forEach(x=>{ if(!x._s) x.dispose(); });
      else m.dispose();
    });
    pg.remove(c);
  }
}
function rebuildPlant(fid,i){
  const pg=plantGrps[fid]?.[i]; if(!pg) return;
  clearPG(pg);
  const raw=(farmData[fid]?.plots||[])[i];
  const allP=Array.isArray(raw)?raw:(raw?.type?[raw]:[]);
  const active=allP.filter(p=>p?.type&&!p?.harvested);
  if(!active.length) return;
  const offsets=plantOffsets(active.length);
  const scaleMul=active.length>2?0.72:active.length>1?0.82:1.0;
  active.forEach((d,ai)=>{
    const pt=PTM[d.type]; if(!pt) return;
    const prog=growProgress(d); if(prog<=0) return;
    const typeMul=pt.id==='king'?1.8:1.0;
    const giantMul=d.giant?2.0:1.0;
    const sc=scaleMul*typeMul*giantMul*(.2+prog*.8);
    const [ox,oz]=offsets[ai]||[0,0];
    const sub=new THREE.Group(); sub.position.set(ox,0,oz);
    // Body: Lambert (fast), shared material where possible
    let bm;
    if(pt.id==='rainbow'){
      const col=new THREE.Color().setHSL((Date.now()*.0004)%1,1,.55).getHex();
      bm=new THREE.MeshLambertMaterial({color:col,emissive:prog>=1?col:0,emissiveIntensity:prog>=1?.35:0});
    } else {
      bm=prog>=1?PM[pt.id+'r']:PM[pt.id];
    }
    const body=new THREE.Mesh(new THREE.SphereGeometry(.3*sc,8,6),bm);
    body.position.y=.32*sc; sub.add(body);
    if(prog>.28){
      const stem=new THREE.Mesh(new THREE.CylinderGeometry(.035*sc,.05*sc,.28*sc,5),SM.stem);
      stem.position.y=.62*sc; sub.add(stem);
      for(let j=0;j<4;j++){
        const a=(j/4)*Math.PI*2;
        const leaf=new THREE.Mesh(new THREE.ConeGeometry(.12*sc,.25*sc,4),SM.leaf);
        leaf.position.set(Math.cos(a)*.15*sc,.76*sc,Math.sin(a)*.15*sc);
        leaf.rotation.z=.65; leaf.rotation.y=a; sub.add(leaf);
      }
    }
    if(prog>=1){
      const ring=new THREE.Mesh(new THREE.TorusGeometry(.42*scaleMul,.06,6,16),SM.ring);
      ring.rotation.x=Math.PI/2; ring.position.y=.04; sub.add(ring);
    }
    if(d.weatherEffect){
      const ec=EFFECT_COLOR[d.weatherEffect]||0xffffff;
      const ering=new THREE.Mesh(new THREE.TorusGeometry(.48*scaleMul,.04,5,14),
        new THREE.MeshBasicMaterial({color:ec,transparent:true,opacity:.65}));
      ering.rotation.x=Math.PI/2; ering.position.y=.06; sub.add(ering);
    }
    pg.add(sub);
  });
}
function rebuildFarmPlants(fid){ for(let i=0;i<6;i++) rebuildPlant(fid,i); }

// ── Growth math ──
function growProgress(d){
  if(!d?.type||d?.harvested||!d?.plantedAt) return 0;
  const pt=PTM[d.type]; if(!pt) return 0;
  const base=pt.sec*1000;
  const saved=(d.waterBoost||0)*pt.sec*1000;
  return Math.min(1,(Date.now()-d.plantedAt)/Math.max(base-saved,base*.05));
}
function remainSec(d){
  const pt=PTM[d?.type]; if(!pt||!d?.plantedAt||d?.harvested) return 0;
  const base=pt.sec; const saved=(d.waterBoost||0)*pt.sec;
  return Math.max(0,Math.max(base-saved,base*.05)-(Date.now()-d.plantedAt)/1000);
}
function fmtS(s){ s=Math.ceil(s); return s<60?s+'초':s<3600?Math.floor(s/60)+'분'+(s%60?' '+s%60+'초':''):Math.floor(s/3600)+'시간'; }

// ── Firebase ──
function emptyFarm(n){ return {ownerName:n,lastActive:Date.now(),
  plots:Array.from({length:6},()=>[])}; }
function normalizePlots(fd){
  if(!fd||!Array.isArray(fd.plots)) return fd;
  fd.plots=fd.plots.map(p=>{
    if(Array.isArray(p)) return p;
    if(!p||!p.type) return [];
    return [p]; // wrap legacy single-plant object
  });
  return fd;
}
async function ensureMyFarm(){
  const ref=doc(db,COLL,myId);
  const snap=await getDoc(ref);
  if(!snap.exists()) await setDoc(ref,emptyFarm(pName));
}
function subscribe(fid){
  if(farmUnsub[fid]) return;
  farmUnsub[fid]=onSnapshot(doc(db,COLL,fid),snap=>{
    if(snap.exists()){ const d=snap.data(); normalizePlots(d); farmData[fid]=d; }
    rebuildFarmPlants(fid);
  });
}
async function saveF(fid,data){
  const realId=slotRealId[fid]||fid;
  data.lastActive=Date.now();
  if(fid===myId) try{ localStorage.setItem(LS.fd,JSON.stringify(data)); }catch(e){}
  await setDoc(doc(db,COLL,realId),data);
}
async function loadOthers(){
  const snap=await getDocs(query(collection(db,COLL),orderBy('lastActive','desc'),limit(8)));
  const found=[];
  snap.forEach(d=>{ if(d.id!==myId&&found.length<5) found.push({id:d.id,data:d.data()}); });
  OTHER_SLOTS.forEach((sid,i)=>{
    const real=found[i];
    if(real){
      slotRealId[sid]=real.id;
      normalizePlots(real.data); farmData[sid]=real.data;
      rebuildFarmPlants(sid);
      if(farmUnsub[sid]) farmUnsub[sid]();
      farmUnsub[sid]=onSnapshot(doc(db,COLL,real.id),snap=>{
        if(snap.exists()){ const d=snap.data(); normalizePlots(d); farmData[sid]=d; }
        rebuildFarmPlants(sid);
      });
    }
  });
}

// ── Interaction ──
const _allFarms=[]; // filled after init
function checkNearby(){
  if(!playerMesh) return;
  const px=playerMesh.position.x, pz=playerMesh.position.z;
  nearTarget=null;

  const PR2=PLOT_INTERACT_R*PLOT_INTERACT_R;
  outer:for(const fid of _allFarms){
    const wcs=plotWC[fid];
    if(!wcs) continue;
    for(let i=0;i<6;i++){
      const w=wcs[i]; if(!w) continue;
      const dx=px-w.x, dz=pz-w.z;
      if(dx*dx+dz*dz<PR2){ nearTarget={type:'plot',fid,idx:i}; break outer; }
    }
  }
  if(!nearTarget){
    const dx=px-SHOP_POS.x, dz=pz-SHOP_POS.z;
    if(dx*dx+dz*dz<SHOP_INTERACT_R*SHOP_INTERACT_R) nearTarget={type:'shop'};
  }
  if(!nearTarget){
    const dx=px-MARKET_POS.x, dz=pz-MARKET_POS.z;
    if(dx*dx+dz*dz<MARKET_INTERACT_R*MARKET_INTERACT_R) nearTarget={type:'market'};
  }

  const hintEl=getHintEl();
  const hintTxt=getHintTxt();
  if(!nearTarget){ hintEl.style.display='none'; return; }

  hintEl.style.display='block';
  if(nearTarget.type==='shop'){ hintTxt.textContent='🛒 상점'; return; }
  if(nearTarget.type==='market'){ hintTxt.textContent='🏪 판매소'; return; }

  const {fid,idx}=nearTarget;
  const mine=fid===myId;
  const raw=(farmData[fid]?.plots||[])[idx];
  const allP=Array.isArray(raw)?raw:(raw?.type?[raw]:[]);
  const active=allP.filter(p=>p?.type&&!p?.harvested);
  const ready=active.filter(p=>growProgress(p)>=1);
  const hasSeed=Object.values(seedInv).some(v=>v>0);
  const waterHint=mine&&wc>0&&active.some(p=>(p.waterBoost||0)<.9)?` · 💧W(${wc})`:'';
  if(ready.length>0){
    hintTxt.textContent=(mine?`🥔 수확 선택 (${ready.length}개 준비)`:'수확 준비 완료')+waterHint;
  } else if(active.length<MAX_PER_PLOT){
    hintTxt.textContent=(mine?(hasSeed?`🌱 심기 (${active.length}/${MAX_PER_PLOT})`:'상점에서 씨앗 구매'):'관람 중')+waterHint;
  } else if(active.length>0){
    const minR=Math.min(...active.filter(p=>growProgress(p)<1).map(p=>remainSec(p)));
    hintTxt.textContent=`⏳ ${fmtS(minR)} 남음`+waterHint;
  } else {
    hintTxt.textContent=(mine?(hasSeed?`🌱 심기 (0/${MAX_PER_PLOT})`:'상점에서 씨앗 구매'):'빈 농장')+waterHint;
  }
}

function handleTreePress(){
  const now=Date.now();
  if(now<+(localStorage.getItem(LS_GTCD)||0)) return;
  if(now-treePressTime>TREE_PRESS_WINDOW) treePressCt=0;
  treePressTime=now; treePressCt++;
  if(treePressCt<TREE_PRESS_NEED) return;
  treePressCt=0;
  localStorage.setItem(LS_GTCD, now+3600000);
  if(Math.random()<0.5){
    potatoInv['golden']=(potatoInv['golden']||0)+1;
    saveLS(); updateHUD();
    toast('✨ 황금 감자를 발견했다!');
  } else {
    seedInv['golden']=(seedInv['golden']||0)+1;
    saveLS(); updateHUD();
    toast('✨ 황금 감자 씨앗을 발견했다!');
  }
}
function doInteract(){
  if(_moEl().classList.contains('open')){ closeModal(); return; }
  if(!nearTarget){
    if(playerMesh){
      const px=playerMesh.position.x, pz=playerMesh.position.z;
      const dtx=px-GOLDEN_TREE_POS.x, dtz=pz-GOLDEN_TREE_POS.z;
      if(dtx*dtx+dtz*dtz<GOLDEN_TREE_R*GOLDEN_TREE_R) handleTreePress();
    }
    return;
  }
  if(nearTarget.type==='shop'){ openShop(); return; }
  if(nearTarget.type==='market'){ openMarket(); return; }

  const {fid,idx}=nearTarget;
  const fd=farmData[fid];
  if(!fd||!Array.isArray(fd.plots)){ toast('농장 로딩 중...'); return; }
  if(!Array.isArray(fd.plots[idx])) fd.plots[idx]=[];
  const plots=fd.plots[idx];
  const mine=fid===myId;
  const active=plots.filter(p=>p?.type&&!p?.harvested);
  const ready=active.filter(p=>growProgress(p)>=1);

  if(ready.length>0){
    if(!mine){ toast('수확은 내 농장에서만'); return; }
    openHarvestModal(fid,idx); return;
  }
  if(active.length<MAX_PER_PLOT){
    if(!mine){ toast('관람만 가능합니다'); return; }
    openSeedModal(fid,idx); return;
  }
}
function doWater(){
  if(!nearTarget||nearTarget.type!=='plot') return;
  const {fid,idx}=nearTarget;
  if(fid!==myId){ return; }
  if(wc<=0){ toast('물뿌리개가 없습니다 · 상점에서 구매'); return; }
  const fd=farmData[fid]; if(!fd) return;
  const plots=Array.isArray(fd.plots?.[idx])?fd.plots[idx]:[];
  const growable=plots.filter(p=>p?.type&&!p?.harvested&&(p.waterBoost||0)<.9);
  if(!growable.length){ toast('이미 물을 충분히 주었습니다'); return; }
  growable.forEach(p=>{ p.waterBoost=Math.min(.9,(p.waterBoost||0)+WATER_SAVE); });
  wc--; saveLS(); updateHUD(); saveF(fid,fd); checkNearby();
  toast(`💧 물을 주었습니다! (${wc}회 남음)`);
}

function openHarvestModal(fid,idx){
  const fd=farmData[fid];
  if(!fd) return;
  const raw=fd.plots?.[idx];
  const arr=Array.isArray(raw)?raw:[];
  const readyItems=arr.map((p,pi)=>({p,pi})).filter(({p})=>p?.type&&!p?.harvested&&growProgress(p)>=1);
  showModal('🥔 수확할 감자 선택',
    readyItems.map(({p,pi})=>{
      const pt=PTM[p.type];
      const giantTag=p.giant?`<span style="color:#ffd700;margin-left:6px">🌟 거대</span>`:'';
      const effCol=p.weatherEffect?('#'+EFFECT_COLOR[p.weatherEffect]?.toString(16).padStart(6,'0')):'';
      const effTag=p.weatherEffect?`<span style="color:${effCol||'#adf'};margin-left:6px">${p.weatherEffect} ×${p.weatherMult||EFFECT_MULT[p.weatherEffect]}</span>`:'';
      const baseMult=(p.giant?2:1)*(p.weatherMult||1);
      return `<div class="pc" onclick="doHarvest('${fid}',${idx},${pi})">

      </div>`;
    }).join('')
  );
}
window.doHarvest=(fid,idx,pi)=>{
  const fd=farmData[fid]; if(!fd) return;
  const p=fd.plots?.[idx]?.[pi];
  if(!p||p.harvested||growProgress(p)<1){ toast('수확할 수 없습니다'); return; }
  const isGiant=!!p.giant;
  const effect=p.weatherEffect||null;
  const key=harvestKey(p.type,isGiant,effect);
  potatoInv[key]=(potatoInv[key]||0)+1;
  p.harvested=true;
  saveLS(); updateHUD(); saveF(fid,fd); rebuildPlant(fid,idx); closeModal();
  const effTag=effect?` [${effect}]`:'';
  if(isGiant) toast(`🌟 거대한 ${PTM[p.type].name}${effTag}! 인벤토리에 저장됨`);
  else toast(`🥔 ${PTM[p.type].name}${effTag} 수확! 인벤토리에 저장됨`);
  advanceTutorial('harvested');
};

function openSeedModal(fid,idx){
  const raw=farmData[fid]?.plots?.[idx];
  const cur=Array.isArray(raw)?raw.filter(p=>p?.type&&!p?.harvested).length:0;
  const mySeeds=PT.filter(pt=>(seedInv[pt.id]||0)>0);
  if(mySeeds.length===0){ toast('상점에서 씨앗을 먼저 구매하세요 🌱'); return; }
  showModal(`🌱 감자 심기 (${cur}/${MAX_PER_PLOT})`,
    mySeeds.map(pt=>`
      <div class="pc" onclick="doPlant('${fid}',${idx},'${pt.id}')">
        <div class="pcdot" style="background:${pt.hex}"></div>
        <div><div class="pcn">${pt.name} <span style="color:#7ddc44">×${seedInv[pt.id]}</span></div>
        <div class="pci">수확 인벤토리 저장 · ${fmtS(pt.sec)} 성장</div></div>
      </div>`).join('')
  );
}
window.doPlant=(fid,idx,tid)=>{
  if(!(seedInv[tid]||0)){ toast('씨앗이 없습니다'); return; }
  const fd=farmData[fid];
  if(!fd||!Array.isArray(fd.plots)){ toast('농장 로딩 중...'); return; }
  if(!Array.isArray(fd.plots[idx])) fd.plots[idx]=[];
  const active=fd.plots[idx].filter(p=>p?.type&&!p?.harvested).length;
  if(active>=MAX_PER_PLOT){ toast(`한 칸에 최대 ${MAX_PER_PLOT}개까지 심을 수 있습니다`); return; }
  seedInv[tid]--; if(seedInv[tid]<=0) delete seedInv[tid];
  saveLS(); updateHUD();
  const newPlant={type:tid,plantedAt:Date.now(),waterBoost:0,harvested:false,giant:Math.random()<0.1};
  const si=fd.plots[idx].findIndex(p=>!p?.type||p?.harvested);
  if(si>=0) fd.plots[idx][si]=newPlant;
  else fd.plots[idx].push(newPlant);
  saveF(fid,fd); closeModal();
  toast(`🌱 ${PTM[tid].name} 심기 완료! (${active+1}/${MAX_PER_PLOT})`);
  rebuildPlant(fid,idx);
  advanceTutorial('planted');
};

function openMarket(){
  const items=[];
  for(const [key,cnt] of Object.entries(potatoInv)){
    if(!cnt) continue;
    const {type,giant,effect,mult,pt}=parsePotatoKey(key); if(!pt) continue;
    const price=Math.round(pt.coin*(giant?2:1)*mult);
    const effCol=effect?('#'+((EFFECT_COLOR[effect]||0xffffff).toString(16).padStart(6,'0'))):'';
    const name=(effect?`<span style="color:${effCol}">[${effect}]</span> `:'')+( giant?'🌟 거대한 ':'')+pt.name;
    items.push({key,name,hex:pt.hex,count:cnt,price,giant,effect,effCol});
  }
  items.sort((a,b)=>b.price-a.price);
  const total=items.reduce((s,it)=>s+it.count*it.price,0);
  showModal('🏪 판매소', items.length===0
    ? '<div style="color:#888;text-align:center;padding:20px">판매할 감자가 없습니다<br><small>농장에서 감자를 수확하세요</small></div>'
    : `<div style="font-size:12px;color:#f5d060;margin-bottom:8px">수확한 감자를 여기서 팔 수 있습니다</div>
    ${items.map(it=>`
      <div class="pc" onclick="sellPotato('${it.key}')">
        <div class="pcdot" style="background:${it.hex};${it.giant?'box-shadow:0 0 7px gold':''}${it.effect?';outline:2px solid '+(it.effCol||'#adf'):''}"></div>
        <div><div class="pcn">${it.name} ×${it.count}</div>
        <div class="pci">개당 ${it.price}코인 · 합계 ${it.count*it.price}코인</div></div>
      </div>`).join('')}
    <div class="pc" onclick="sellAll()" style="border-color:#f5d060;margin-top:4px">
      <div class="pcdot" style="background:#f5d060"></div>
      <div><div class="pcn">🪙 전부 팔기</div>
      <div class="pci">합계 ${total}코인 획득</div></div>
    </div>`
  );
}
window.sellPotato=(key)=>{
  const cnt=potatoInv[key]||0; if(!cnt){ toast('없습니다'); return; }
  const {type,giant,effect,mult,pt}=parsePotatoKey(key); if(!pt) return;
  const price=Math.round(pt.coin*(giant?2:1)*mult);
  potatoInv[key]--; if(potatoInv[key]<=0) delete potatoInv[key];
  coins+=price; saveLS(); updateHUD();
  const effTag=effect?` [${effect}]`:'';
  toast(`🪙 ${giant?'거대한 ':''}${pt.name}${effTag} 판매! +${price}코인`);
  advanceTutorial('sold'); openMarket();
};
window.sellAll=()=>{
  let total=0;
  for(const [key,cnt] of Object.entries(potatoInv)){
    if(!cnt) continue;
    const {type,giant,effect,mult,pt}=parsePotatoKey(key); if(!pt) continue;
    total+=cnt*Math.round(pt.coin*(giant?2:1)*mult);
  }
  if(!total){ toast('팔 감자가 없습니다'); closeModal(); return; }
  Object.keys(potatoInv).forEach(k=>delete potatoInv[k]);
  coins+=total; saveLS(); updateHUD();
  toast(`🪙 전부 판매! +${total}코인`);
  advanceTutorial('sold'); closeModal();
};

// ── Tutorial ──
const TUT=[
  '🌱 상점 근처에서 Space를 눌러\n씨앗을 사고 농장 칸에 심어보세요!',
  '🌿 잘했어요! 감자가 자라고 있어요.\n다 자라면 Space로 수확하세요 🥔',
  '🏪 수확했어요!\n판매소에 가서 감자를 팔아보세요!',
  '🛒 멋져요! 상점에서\n새로운 씨앗을 구매해보세요!',
];
let tutStep=0;
function loadTut(){ tutStep=+(localStorage.getItem('pf2_tut')||0); }
function saveTut(){ localStorage.setItem('pf2_tut',tutStep); }
const TUT_TARGETS=[
  new THREE.Vector3(0,0,18),   // step 0: shop
  new THREE.Vector3(0,0,0),    // step 1: farm
  new THREE.Vector3(18,0,18),  // step 2: market
  new THREE.Vector3(0,0,18),   // step 3: shop
];
let tutArrow=null;
function buildTutArrow(){
  const g=new THREE.Group();
  const mat=new THREE.MeshLambertMaterial({color:0xffee00,emissive:0xffcc00,emissiveIntensity:.6});
  const cone=new THREE.Mesh(new THREE.ConeGeometry(.4,.9,6),mat);
  cone.rotation.z=Math.PI; cone.position.y=0; g.add(cone);
  const shaft=new THREE.Mesh(new THREE.CylinderGeometry(.14,.14,.8,6),mat);
  shaft.position.y=.85; g.add(shaft);
  g.visible=false;
  scene.add(g);
  tutArrow=g;
}
function updateTutArrow(){
  if(!tutArrow) return;
  if(tutStep>=TUT.length||tutStep>=TUT_TARGETS.length){ tutArrow.visible=false; return; }
  const t=TUT_TARGETS[tutStep];
  tutArrow.position.x=t.x;
  tutArrow.position.z=t.z;
  tutArrow.visible=true;
}
function updateTutUI(){
  const el=document.getElementById('tut');
  if(tutStep>=TUT.length){ el.style.display='none'; updateTutArrow(); return; }
  el.style.display='block';
  document.getElementById('tut-step').textContent=`STEP ${tutStep+1} / ${TUT.length}`;
  document.getElementById('tut-msg').textContent=TUT[tutStep];
  updateTutArrow();
}
function advanceTutorial(ev){
  if(tutStep>=TUT.length) return;
  const map={planted:0, harvested:1, sold:2, bought_seed:3};
  if(map[ev]===tutStep){ tutStep++; saveTut(); updateTutUI();
    if(tutStep>=TUT.length) toast('🎉 튜토리얼 완료! 이제 감자 농부!'); }
}
window.skipTutorial=()=>{ tutStep=TUT.length; saveTut(); updateTutUI(); };

function openInventory(){
  const seedRows=PT.filter(pt=>(seedInv[pt.id]||0)>0).map(pt=>`
    <div class="pc" style="cursor:default">
      <div class="pcdot" style="background:${pt.hex}"></div>
      <div><div class="pcn">🌱 ${pt.name} 씨앗</div>
      <div class="pci">×${seedInv[pt.id]} · ${fmtS(pt.sec)} 성장</div></div>
    </div>`).join('');
  const potatoRows=PT.flatMap(pt=>{
    const rows=[];
    if(potatoInv[pt.id]>0) rows.push(`
      <div class="pc" onclick="openMarket()" title="판매소에서 판매">
        <div class="pcdot" style="background:${pt.hex}"></div>
        <div><div class="pcn">${pt.name}</div>
        <div class="pci">×${potatoInv[pt.id]} · 개당 ${pt.coin}코인 · 판매소에서 팔기</div></div>
      </div>`);
    if(potatoInv[pt.id+'_g']>0) rows.push(`
      <div class="pc" onclick="openMarket()" title="판매소에서 판매">
        <div class="pcdot" style="background:${pt.hex};box-shadow:0 0 7px gold"></div>
        <div><div class="pcn">🌟 거대한 ${pt.name}</div>
        <div class="pci">×${potatoInv[pt.id+'_g']} · 개당 ${pt.coin*2}코인 · 판매소에서 팔기</div></div>
      </div>`);
    return rows;
  }).join('');
  const totSeeds=Object.values(seedInv).reduce((a,b)=>a+b,0);
  const totPotato=Object.values(potatoInv).reduce((a,b)=>a+b,0);
  showModal('🎒 인벤토리',`
    <div style="font-size:12px;color:#f5d060;margin-bottom:8px;font-weight:bold">🌱 씨앗 (${totSeeds}개)</div>
    ${seedRows||'<div style="color:#555;font-size:12px;padding:4px 0 8px">없음</div>'}
    <div style="font-size:12px;color:#f5a623;margin:10px 0 8px;font-weight:bold">🥔 수확한 감자 (${totPotato}개)</div>
    ${potatoRows||'<div style="color:#555;font-size:12px;padding:4px 0 8px">없음</div>'}
  `);
}
window.openInventory=openInventory;

// ── Input ──
const keys={};
window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase(); keys[k]=true;
  if(k===' '){ checkNearby(); doInteract(); e.preventDefault(); }
  if((k==='w'||k==='ㅈ')&&!e.repeat) doWater();
  if(['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d'].includes(k)) e.preventDefault();
});
window.addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; });

// ── Camera orbit (점프맵 방식) ──
let cameraYaw=Math.PI, cameraPitch=0.5;
const CAM_DIST=16;
let isDragging=false, lastMX=0, lastMY=0;

canvas.addEventListener('mousedown',e=>{
  isDragging=true; lastMX=e.clientX; lastMY=e.clientY; e.preventDefault();
});
window.addEventListener('mousemove',e=>{
  if(!isDragging) return;
  cameraYaw  -=(e.clientX-lastMX)*0.005;
  cameraPitch-=(e.clientY-lastMY)*0.005;
  cameraPitch=Math.max(-0.8,Math.min(1.0,cameraPitch));
  lastMX=e.clientX; lastMY=e.clientY;
});
window.addEventListener('mouseup',()=>isDragging=false);
canvas.addEventListener('contextmenu',e=>e.preventDefault());

const _camTgt=new THREE.Vector3();
function updateCamera(){
  if(!playerMesh) return;
  const px=playerMesh.position.x, py=playerMesh.position.y, pz=playerMesh.position.z;
  _camTgt.set(
    px+Math.sin(cameraYaw)*Math.cos(cameraPitch)*CAM_DIST,
    py+Math.sin(cameraPitch)*CAM_DIST+1,
    pz+Math.cos(cameraYaw)*Math.cos(cameraPitch)*CAM_DIST
  );
  camera.position.lerp(_camTgt,0.12);
  camera.lookAt(px,py+0.5,pz);
}

// ── Player movement (카메라 방향 기준) ──
const _fwd=new THREE.Vector3(), _rgt=new THREE.Vector3();
function collideBldg(nx, nz){
  if(nx>-2.7&&nx<2.7&&nz>15.7&&nz<21.0) return true;  // shop interior
  if(nx>15.3&&nx<20.7&&nz>15.9&&nz<21.0) return true;  // market interior
  return false;
}

function movePlayer(){
  if(!playerMesh) return;
  if(_moEl().classList.contains('open')) return;
  const spd=.1;
  _fwd.set(-Math.sin(cameraYaw),0,-Math.cos(cameraYaw));
  _rgt.set( Math.cos(cameraYaw),0,-Math.sin(cameraYaw));
  let vx=0, vz=0;
  if(keys['w']||keys['arrowup'])    { vx+=_fwd.x; vz+=_fwd.z; }
  if(keys['s']||keys['arrowdown'])  { vx-=_fwd.x; vz-=_fwd.z; }
  if(keys['a']||keys['arrowleft'])  { vx-=_rgt.x; vz-=_rgt.z; }
  if(keys['d']||keys['arrowright']) { vx+=_rgt.x; vz+=_rgt.z; }
  const isSnow=currentWeather==='snow';
  if(vx||vz){
    const len=Math.hypot(vx,vz)||1;
    vx=vx/len*spd; vz=vz/len*spd;
    if(isSnow){ pvx=pvx*.65+vx*.35; pvz=pvz*.65+vz*.35; } else { pvx=vx; pvz=vz; }
  } else {
    if(isSnow){ pvx*=.90; pvz*=.90; if(Math.abs(pvx)<.001) pvx=0; if(Math.abs(pvz)<.001) pvz=0; }
    else { pvx=0; pvz=0; }
  }
  if(pvx||pvz){
    const cx=playerMesh.position.x, cz=playerMesh.position.z;
    const nx=Math.max(-55,Math.min(55,cx+pvx));
    const nz=Math.max(-55,Math.min(55,cz+pvz));
    if(!collideBldg(nx,nz)){
      playerMesh.position.x=nx; playerMesh.position.z=nz;
    } else if(!collideBldg(nx,cz)){
      playerMesh.position.x=nx;
    } else if(!collideBldg(cx,nz)){
      playerMesh.position.z=nz;
    }
    const tA=Math.atan2(pvx,pvz);
    let da=tA-playerMesh.rotation.y;
    while(da>Math.PI) da-=Math.PI*2; while(da<-Math.PI) da+=Math.PI*2;
    playerMesh.rotation.y+=da*.2;
    walkPhase+=.2;
    playerMesh.position.y=Math.abs(Math.sin(walkPhase))*.07;
  } else {
    playerMesh.position.y*=.85;
  }
}

// ── Animate ──
let frame=0;
function animate(){
  requestAnimationFrame(animate); frame++;
  movePlayer();
  if(frame%6===0) checkNearby();
  updateCamera();
  if(frame%240===0) Object.keys(farmData).forEach(rebuildFarmPlants);
  if(frame%24===0){
    for(const fid of Object.keys(plantGrps)){
      (farmData[fid]?.plots||[]).forEach((raw,i)=>{
        const arr=Array.isArray(raw)?raw:[];
        for(let ai=0;ai<arr.length;ai++){
          const p=arr[ai];
          if(!p||p.type!=='rainbow'||p.harvested) continue;
          const sub=plantGrps[fid]?.[i]?.children[ai];
          if(!sub) continue;
          const hsl=(Date.now()*.0004+i*.2)%1;
          for(let ci=0;ci<sub.children.length;ci++){
            const c=sub.children[ci];
            if(c.material&&!c.material._s&&c.material.color)
              c.material.color.setHSL(hsl,1,.55);
          }
        }
      });
    }
  }
  tickWeatherVfx();
  if(tutArrow&&tutArrow.visible){
    tutArrow.position.y=4+Math.sin(Date.now()*.003)*.35;
    tutArrow.rotation.y+=.025;
  }
  renderer.render(scene,camera);
}

// ── Init ──
async function init(){
  let name=localStorage.getItem(LS.nm);
  if(!name){
    name=(prompt('닉네임을 입력하세요 (2~12자)')||'감자농부').trim().slice(0,12)||'감자농부';
    localStorage.setItem(LS.nm,name);
  }
  pName=name; myId=name;
  document.getElementById('hud-name').textContent=name;
  loadLS(); loadTut(); loadShopStock(); loadWeather();
  if(Object.keys(seedInv).length===0){ seedInv.common=3; saveLS(); }
  updateHUD(); updateTutUI();
  initPM();

  buildPlayerModel();
  buildFarm(myId,FARM_POS[0],true);
  try{
    const cached=JSON.parse(localStorage.getItem(LS.fd)||'null');
    if(cached){ normalizePlots(cached); farmData[myId]=cached; }
    else farmData[myId]=emptyFarm(pName);
  }catch(e){ farmData[myId]=emptyFarm(pName); }
  rebuildFarmPlants(myId);
  OTHER_SLOTS.forEach((sid,i)=>{
    buildFarm(sid,FARM_POS[i+1],false);
    farmData[sid]=emptyFarm('');
  });
  buildShop();
  buildMarket();
  addDeco();
  buildTutArrow();
  _allFarms.push(myId,...OTHER_SLOTS);
  buildPlotWC();
  animate();

  try{
    await ensureMyFarm();
    subscribe(myId);
    await loadOthers();
  } catch(e){
    console.error(e); toast('⚠️ 네트워크 오류 - 오프라인');
  }
}
init().catch(console.error);
</script>
