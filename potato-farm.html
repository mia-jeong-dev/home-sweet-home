<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>감자 키우기</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0e1a04; color:#fff; font-family:'Malgun Gothic',sans-serif; overflow:hidden; }
#c { display:block; width:100vw; height:100vh; cursor:crosshair; }

#header {
  position:fixed; top:0; left:0; right:0;
  display:flex; align-items:center; gap:10px; padding:8px 14px;
  background:rgba(0,0,0,0.72); backdrop-filter:blur(4px); z-index:10;
}
#header h1 { font-size:17px; color:#f5d060; letter-spacing:-0.5px; }
#name-disp { font-size:13px; color:#aaa; }
#coins-disp { margin-left:auto; font-size:15px; color:#f5d060; font-weight:bold; }

#farm-tabs {
  position:fixed; top:44px; left:0; right:0;
  display:flex; gap:5px; padding:6px 12px;
  background:rgba(0,0,0,0.6); z-index:10; overflow-x:auto;
}
.farm-tab {
  padding:4px 12px; border-radius:5px; border:1.5px solid #444;
  background:#1a1a1a; cursor:pointer; font-size:12px; white-space:nowrap;
  transition:all .15s; color:#ccc;
}
.farm-tab.me { border-color:#c8a050; color:#f5d060; }
.farm-tab.active { background:#2a1e00; border-color:#f5d060; color:#fff; }
.farm-tab:hover:not(.active) { border-color:#888; color:#fff; }

#tools-bar {
  position:fixed; bottom:0; left:0; right:0;
  display:flex; gap:6px; padding:8px 14px; align-items:center;
  background:rgba(0,0,0,0.72); backdrop-filter:blur(4px); z-index:10;
}
.tbtn {
  padding:6px 13px; border-radius:7px; border:1.5px solid #444;
  background:#1a1a1a; cursor:pointer; font-size:13px; color:#ccc;
  transition:all .15s;
}
.tbtn.active { border-color:#4af; background:#001b2e; color:#4df; }
.tbtn:hover:not(.active) { border-color:#888; color:#fff; }
#info-bar { margin-left:auto; font-size:11px; color:#888; }

/* modal */
#moverlay {
  position:fixed; inset:0; background:rgba(0,0,0,0.75);
  display:none; align-items:center; justify-content:center; z-index:50;
}
#moverlay.open { display:flex; }
#mpanel {
  background:#181200; border:2px solid #c8a050; border-radius:12px;
  padding:20px; min-width:290px; max-width:460px; width:90%;
  max-height:80vh; overflow-y:auto;
}
#mpanel h2 { color:#f5d060; margin-bottom:14px; font-size:16px; }
.pc {
  display:flex; align-items:center; gap:10px;
  padding:9px 10px; border:1px solid #333; border-radius:8px;
  cursor:pointer; margin-bottom:7px; transition:background .12s;
}
.pc:hover { background:#251800; border-color:#c8a050; }
.pc-dot { width:24px; height:24px; border-radius:50%; flex-shrink:0; }
.pc-name { font-size:13px; font-weight:bold; }
.pc-info { font-size:11px; color:#888; margin-top:2px; }
.mcancel {
  margin-top:10px; padding:7px 20px; border:1px solid #444;
  border-radius:7px; background:#222; cursor:pointer; color:#aaa; font-size:13px;
}
.mcancel:hover { color:#fff; }

#toast {
  position:fixed; bottom:62px; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,0.88); color:#fff; padding:7px 18px;
  border-radius:20px; font-size:13px; pointer-events:none;
  opacity:0; transition:opacity .3s; z-index:99; white-space:nowrap;
}

#reset-btn {
  position:fixed; top:50px; right:10px; padding:5px 10px;
  background:#3a0000; border:1px solid #f44; border-radius:5px;
  cursor:pointer; font-size:11px; color:#f88; z-index:11;
}
#reset-btn:hover { background:#5a0000; }

.grow-bar-wrap {
  position:fixed; bottom:52px; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,0.7); border-radius:8px; padding:4px 12px;
  font-size:11px; color:#aaa; z-index:11; pointer-events:none;
  display:none;
}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="header">
  <h1>🥔 감자 키우기</h1>
  <span id="name-disp"></span>
  <span id="coins-disp">🪙 0</span>
</div>
<div id="farm-tabs"></div>

<div id="tools-bar">
  <button class="tbtn" id="tbtn-plant"   onclick="setTool('plant')">🌱 심기</button>
  <button class="tbtn" id="tbtn-water"   onclick="setTool('water')">💧 물주기 <span id="wc-cnt"></span></button>
  <button class="tbtn" id="tbtn-harvest" onclick="setTool('harvest')">🥔 캐기</button>
  <button class="tbtn" id="tbtn-shop"    onclick="openShop()">🛒 상점</button>
  <div id="info-bar">캐기 모드</div>
</div>

<div id="moverlay" onclick="e=>e.target===this&&closeModal()">
  <div id="mpanel">
    <h2 id="mtitle"></h2>
    <div id="mbody"></div>
    <button class="mcancel" onclick="closeModal()">닫기</button>
  </div>
</div>
<div id="toast"></div>
<button id="reset-btn" onclick="doReset()">🔄 내 농장 초기화</button>

<script type="module">
import { initializeApp }   from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, onSnapshot,
         collection, query, orderBy, limit, getDocs }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js";

// ── Firebase ──
const FB_CFG = {
  apiKey:"AIzaSyAoiB8frxNH4W2lTzoO9R3rZeyxypY6rgs",
  authDomain:"gams-db.firebaseapp.com", projectId:"gams-db",
  storageBucket:"gams-db.firebasestorage.app",
  messagingSenderId:"868598873850",
  appId:"1:868598873850:web:cd0007b105bdc1518d5343"
};
const db = getFirestore(initializeApp(FB_CFG));
const COLL = 'potato_farms';

// ── Potato types (base: 5 coins, 10s) ──
const PT = [
  { id:'common',  name:'일반 감자',    coin:5,    sec:10,    hex:'#c8a050', seed:0   },
  { id:'unusual', name:'특이한 감자',  coin:20,   sec:40,    hex:'#50c870', seed:8   },
  { id:'good',    name:'좋은 감자',    coin:50,   sec:100,   hex:'#5088ff', seed:20  },
  { id:'great',   name:'훌륭한 감자',  coin:100,  sec:200,   hex:'#b060ff', seed:40  },
  { id:'king',    name:'대왕 감자',    coin:200,  sec:400,   hex:'#ff5555', seed:80  },
  { id:'rainbow', name:'레인보우 감자',coin:500,  sec:1000,  hex:'#ffffff', seed:150 },
  { id:'golden',  name:'황금 감자',    coin:1000, sec:2000,  hex:'#ffd700', seed:300 },
];
const PT_MAP = Object.fromEntries(PT.map(p=>[p.id,p]));
const WATER_SAVE = 0.25; // each water saves 25% of base grow time

// ── LocalStorage ──
const LS = { name:'pf_name', coins:'pf_coins', wc:'pf_wc' };
let playerName='', coins=0, wc=0;
function loadLS() {
  coins = parseInt(localStorage.getItem(LS.coins)||'0');
  wc    = parseInt(localStorage.getItem(LS.wc)||'0');
}
function saveLS() {
  localStorage.setItem(LS.coins, String(coins));
  localStorage.setItem(LS.wc, String(wc));
}

// ── State ──
let myId='', curFarmId='';
let farmData={}, farmUnsub={};
let otherIds=[];
let activeTool='harvest';
let hoverPlot=null; // {farmId, idx}

// ── THREE scene ──
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e1a04);
scene.fog = new THREE.FogExp2(0x0e1a04, 0.035);

const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 80);
camera.position.set(0, 11, 11);
camera.lookAt(0,0,0);
renderer.setSize(innerWidth, innerHeight);
window.addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// Lights
scene.add(new THREE.AmbientLight(0xffeedd, 0.55));
const sun = new THREE.DirectionalLight(0xfff5cc, 1.3);
sun.position.set(6,12,8); sun.castShadow=true;
sun.shadow.camera.near=1; sun.shadow.camera.far=60;
sun.shadow.camera.left=-20; sun.shadow.camera.right=20;
sun.shadow.camera.top=20; sun.shadow.camera.bottom=-20;
sun.shadow.mapSize.set(1024,1024);
scene.add(sun);

// Ground
const gnd = new THREE.Mesh(
  new THREE.PlaneGeometry(60,60),
  new THREE.MeshLambertMaterial({color:0x162808})
);
gnd.rotation.x=-Math.PI/2; gnd.receiveShadow=true; scene.add(gnd);

// ── Farm geometry ──
const PW=1.8, PG=0.3; // plot width, gap
const COLS=3, ROWS=2;
const FW=(COLS*(PW+PG)); const FD=(ROWS*(PW+PG)); // farm width/depth

// 6 farm world positions: mine=0, others=1..5
const FPOS = [
  new THREE.Vector3(0,0,0),
  new THREE.Vector3(-10,0,-2), new THREE.Vector3(10,0,-2),
  new THREE.Vector3(-10,0,6),  new THREE.Vector3(10,0,6),
  new THREE.Vector3(0,0,-10),
];

const plotMeshes={}, plantGroups={}, farmGroups={};

function plotLocalPos(i) {
  const col=i%COLS, row=Math.floor(i/COLS);
  return new THREE.Vector3(
    (col-(COLS-1)/2)*(PW+PG), 0,
    (row-(ROWS-1)/2)*(PW+PG)
  );
}

function buildFarm(fid, worldPos, isMe) {
  const g=new THREE.Group(); g.position.copy(worldPos); scene.add(g);
  farmGroups[fid]=g;

  // Fence/base
  const base=new THREE.Mesh(
    new THREE.BoxGeometry(FW+0.6, 0.18, FD+0.6),
    new THREE.MeshLambertMaterial({color: isMe?0x2a5c10:0x1e4008})
  );
  base.position.y=-0.09; base.receiveShadow=true; g.add(base);

  // Corner posts
  const postMat=new THREE.MeshLambertMaterial({color:0x7a4a1a});
  const postGeo=new THREE.BoxGeometry(0.12,0.55,0.12);
  [[-1,-1],[-1,1],[1,-1],[1,1]].forEach(([sx,sz])=>{
    const p=new THREE.Mesh(postGeo,postMat);
    p.position.set(sx*(FW/2+0.22), 0.18, sz*(FD/2+0.22)); p.castShadow=true; g.add(p);
  });

  const plots=[], plants=[];
  for(let i=0;i<6;i++){
    const lp=plotLocalPos(i);
    const pm=new THREE.Mesh(
      new THREE.BoxGeometry(PW,0.12,PW),
      new THREE.MeshLambertMaterial({color:0x7a4a1a})
    );
    pm.position.set(lp.x,0,lp.z); pm.receiveShadow=true;
    pm.userData={fid,idx:i};
    g.add(pm); plots.push(pm);

    const pg2=new THREE.Group();
    pg2.position.set(lp.x,0.06,lp.z); g.add(pg2); plants.push(pg2);
  }
  plotMeshes[fid]=plots; plantGroups[fid]=plants;
}

// ── Plant visuals ──
function plantColor(typeId) {
  if(typeId==='rainbow') return new THREE.Color().setHSL((Date.now()*.0004)%1,1,.55).getHex();
  return parseInt(PT_MAP[typeId]?.hex.replace('#','0x')||'0xc8a050');
}

function rebuildPlant(fid, idx) {
  const pg=plantGroups[fid]?.[idx]; if(!pg) return;
  while(pg.children.length){ const c=pg.children[0]; c.geometry?.dispose(); c.material?.dispose(); pg.remove(c); }

  const d=(farmData[fid]?.plots||[])[idx]; if(!d||!d.type||d.harvested) return;
  const pt=PT_MAP[d.type]; if(!pt) return;
  const prog=growProgress(d); if(prog<=0) return;

  const sc=0.18+prog*0.62;
  const col=plantColor(d.type);

  // Potato body (underground lump)
  const bMat=new THREE.MeshStandardMaterial({color:col, roughness:.65, metalness: d.type==='golden'?.5:0,
    emissive: prog>=1 ? col : 0, emissiveIntensity: prog>=1?.25:0});
  const body=new THREE.Mesh(new THREE.SphereGeometry(.28*sc,10,8),bMat);
  body.position.y=.28*sc; body.castShadow=true; pg.add(body);

  if(prog>.25){
    // Stem
    const sMat=new THREE.MeshLambertMaterial({color:0x2a7a10});
    const stem=new THREE.Mesh(new THREE.CylinderGeometry(.04*sc,.06*sc,.4*sc,6),sMat);
    stem.position.y=.56*sc+.2*sc; pg.add(stem);
    // Leaves
    for(let i=0;i<4;i++){
      const a=(i/4)*Math.PI*2;
      const lMat=new THREE.MeshLambertMaterial({color:0x259820, side:THREE.DoubleSide});
      const leaf=new THREE.Mesh(new THREE.ConeGeometry(.18*sc,.38*sc,5),lMat);
      leaf.position.set(Math.cos(a)*.22*sc, .56*sc+.32*sc, Math.sin(a)*.22*sc);
      leaf.rotation.z=.7; leaf.rotation.y=a; pg.add(leaf);
    }
  }

  // Ready glow ring
  if(prog>=1){
    const ringMat=new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.65});
    const ring=new THREE.Mesh(new THREE.TorusGeometry(.42,0.045,8,28),ringMat);
    ring.rotation.x=Math.PI/2; ring.position.y=.04; pg.add(ring);
    // point light
    const pl=new THREE.PointLight(col,.6,1.8);
    pl.position.y=.5; pg.add(pl);
  }
}

function rebuildAllPlants(fid){
  for(let i=0;i<6;i++) rebuildPlant(fid,i);
}

// ── Growth ──
function growProgress(d){
  if(!d||!d.type||d.harvested||!d.plantedAt) return 0;
  const pt=PT_MAP[d.type]; if(!pt) return 0;
  const baseSec=pt.sec;
  const saved=(d.waterBoost||0)*baseSec;
  const effectSec=Math.max(baseSec-saved, baseSec*.05);
  return Math.min(1,(Date.now()-d.plantedAt)/(effectSec*1000));
}
function remainSec(d){
  const pt=PT_MAP[d?.type]; if(!pt||!d?.plantedAt||d?.harvested) return 0;
  const saved=(d.waterBoost||0)*pt.sec;
  const effectSec=Math.max(pt.sec-saved,pt.sec*.05);
  return Math.max(0,(effectSec-(Date.now()-d.plantedAt)/1000));
}
function fmtSec(s){
  s=Math.ceil(s);
  if(s<60) return s+'초';
  if(s<3600) return Math.floor(s/60)+'분'+(s%60?` ${s%60}초`:'');
  return Math.floor(s/3600)+'시간';
}

// ── Firebase ──
function emptyFarm(name){ return {
  ownerName:name, lastActive:Date.now(),
  plots:Array.from({length:6},()=>({type:null,plantedAt:null,waterBoost:0,harvested:false}))
};}

async function ensureMyFarm(){
  const ref=doc(db,COLL,myId);
  const snap=await getDoc(ref);
  if(!snap.exists()) await setDoc(ref,emptyFarm(playerName));
}

function subscribeFarm(fid){
  if(farmUnsub[fid]) return;
  farmUnsub[fid]=onSnapshot(doc(db,COLL,fid),snap=>{
    farmData[fid]=snap.exists()?snap.data():null;
    rebuildAllPlants(fid);
    refreshTab(fid);
  });
}

async function save(fid,data){
  data.lastActive=Date.now();
  await setDoc(doc(db,COLL,fid),data);
}

async function loadOthers(){
  const snap=await getDocs(query(collection(db,COLL),orderBy('lastActive','desc'),limit(8)));
  otherIds=[];
  snap.forEach(d=>{ if(d.id!==myId&&otherIds.length<5) otherIds.push(d.id); });
  layoutFarms();
}

function layoutFarms(){
  const all=[myId,...otherIds];
  // Remove stale groups
  Object.keys(farmGroups).forEach(fid=>{
    if(!all.includes(fid)){ scene.remove(farmGroups[fid]); delete farmGroups[fid]; delete plotMeshes[fid]; delete plantGroups[fid]; }
  });
  all.forEach((fid,i)=>{
    if(!farmGroups[fid]) buildFarm(fid, FPOS[i]||new THREE.Vector3((i-2)*12,0,10), fid===myId);
    subscribeFarm(fid);
  });
  buildTabs();
}

// ── Tabs ──
function buildTabs(){
  const el=document.getElementById('farm-tabs'); el.innerHTML='';
  const all=[myId,...otherIds];
  all.forEach(fid=>{
    const b=document.createElement('button');
    b.className='farm-tab'+(fid===myId?' me':'')+(fid===curFarmId?' active':'');
    b.textContent=(fid===myId?'🏠 내 농장':`👤 ${fid}`);
    b.onclick=()=>switchFarm(fid);
    el.appendChild(b);
  });
}
function refreshTab(fid){ /* update if needed */ buildTabs(); }

function switchFarm(fid){
  curFarmId=fid;
  const gp=farmGroups[fid]?.position;
  if(gp) camTarget.set(gp.x,0,gp.z);
  buildTabs();
}

// ── UI updates ──
function updateUI(){
  document.getElementById('coins-disp').textContent=`🪙 ${coins}`;
  document.getElementById('wc-cnt').textContent=wc>0?`(${wc})`:'';
}

// ── Tool system ──
window.setTool = t=>{
  activeTool=t;
  document.querySelectorAll('.tbtn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tbtn-'+t)?.classList.add('active');
  const msg={plant:'심을 빈 칸 클릭',water:`물뿌리개 ${wc}회 남음 · 클릭으로 물주기`,harvest:'수확할 칸 클릭'};
  document.getElementById('info-bar').textContent=msg[t]||'';
};

window.openShop = ()=>{
  showModal('🛒 도구 상점',`
    <div class="pc" onclick="buyWC()">
      <div class="pc-dot" style="background:#4af"></div>
      <div><div class="pc-name">💧 물뿌리개</div>
      <div class="pc-info">50코인 · 10회 사용 · 원하는 칸에 물 뿌리기 (성장 25% 단축)</div></div>
    </div>
    <div class="pc" onclick="buySpkr()">
      <div class="pc-dot" style="background:#22d"></div>
      <div><div class="pc-name">🌀 스프링클러</div>
      <div class="pc-info">30코인 · 내 농장 모든 칸에 즉시 물 뿌리기</div></div>
    </div>
  `);
};

window.buyWC=()=>{
  if(coins<50){toast('코인이 부족합니다!');return;}
  coins-=50; wc+=10; saveLS(); updateUI();
  toast('💧 물뿌리개 구입! 10회 사용 가능'); closeModal();
};
window.buySpkr=()=>{
  if(curFarmId!==myId){toast('내 농장에서만 사용 가능');return;}
  if(coins<30){toast('코인이 부족합니다!');return;}
  const fd=farmData[myId]; if(!fd){toast('농장 데이터 없음');return;}
  coins-=30; saveLS(); updateUI();
  fd.plots.forEach(p=>{
    const pt=PT_MAP[p.type]; if(!pt||p.harvested||!p.plantedAt) return;
    const maxSave=pt.sec*.9;
    p.waterBoost=Math.min(maxSave/pt.sec,((p.waterBoost||0))+WATER_SAVE);
  });
  save(myId,fd);
  toast('🌀 스프링클러! 모든 칸에 물을 뿌렸습니다'); closeModal();
};

// ── Plot click ──
function onPlot(fid,idx){
  const fd=farmData[fid]; if(!fd) return;
  const p=fd.plots[idx];
  const mine=fid===myId;

  if(activeTool==='plant'){
    if(!mine){toast('내 농장에서만 심을 수 있습니다');return;}
    if(p.type&&!p.harvested){toast('이미 심어진 칸입니다');return;}
    openPlantModal(fid,idx); return;
  }
  if(activeTool==='water'){
    if(!p.type||p.harvested){toast('심어진 감자가 없습니다');return;}
    if(wc<=0){toast('물뿌리개가 없습니다. 상점에서 구매하세요!');return;}
    const pt=PT_MAP[p.type];
    const maxBoost=0.9; // max 90% save
    if((p.waterBoost||0)>=maxBoost){toast('이미 충분히 물을 주었습니다');return;}
    p.waterBoost=Math.min(maxBoost,(p.waterBoost||0)+WATER_SAVE);
    wc--; saveLS(); updateUI();
    setTool('water'); // refresh count display
    save(fid,fd);
    toast('💧 물을 주었습니다!'); return;
  }
  if(activeTool==='harvest'){
    if(!p.type||p.harvested){toast('수확할 감자가 없습니다');return;}
    if(!mine){toast('자신의 농장에서만 수확 가능합니다');return;}
    const prog=growProgress(p);
    if(prog<1){toast(`🌱 아직 자라는 중... ${fmtSec(remainSec(p))} 남음`);return;}
    const pt=PT_MAP[p.type];
    p.harvested=true; coins+=pt.coin; saveLS(); updateUI();
    save(fid,fd);
    toast(`🥔 ${pt.name} 수확! +${pt.coin} 코인`); return;
  }
}

function openPlantModal(fid,idx){
  const rows=PT.map(pt=>`
    <div class="pc" onclick="doPlant('${fid}',${idx},'${pt.id}')">
      <div class="pc-dot" style="background:${pt.hex}"></div>
      <div><div class="pc-name">${pt.name}</div>
      <div class="pc-info">수확 +${pt.coin}코인 · ${fmtSec(pt.sec)} 성장${pt.seed?` · 씨앗비용 ${pt.seed}코인`:' · 무료'}</div></div>
    </div>`).join('');
  showModal('🌱 감자 선택', rows);
  window._pp={fid,idx};
}

window.doPlant=(fid,idx,tid)=>{
  const pt=PT_MAP[tid];
  if(pt.seed>0&&coins<pt.seed){toast(`씨앗 비용 ${pt.seed}코인 부족`);return;}
  const fd=farmData[fid]; if(!fd) return;
  if(pt.seed>0){coins-=pt.seed; saveLS(); updateUI();}
  fd.plots[idx]={type:tid,plantedAt:Date.now(),waterBoost:0,harvested:false};
  save(fid,fd);
  closeModal(); toast(`🌱 ${pt.name} 심기 완료!`);
};

window.doReset=()=>{
  if(!confirm('내 농장을 초기화할까요? 심은 감자가 모두 사라집니다.')) return;
  const fd=emptyFarm(playerName);
  farmData[myId]=fd; save(myId,fd);
  toast('농장이 초기화되었습니다');
};

// ── Modal ──
function showModal(title, html){
  document.getElementById('mtitle').textContent=title;
  document.getElementById('mbody').innerHTML=html;
  document.getElementById('moverlay').classList.add('open');
}
window.closeModal=()=>document.getElementById('moverlay').classList.remove('open');
document.getElementById('moverlay').addEventListener('click',e=>{
  if(e.target===document.getElementById('moverlay')) closeModal();
});

// ── Toast ──
let toastT;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.style.opacity='1';
  clearTimeout(toastT); toastT=setTimeout(()=>el.style.opacity='0',2400);
}

// ── Raycasting ──
const rc=new THREE.Raycaster(); const ms=new THREE.Vector2();
canvas.addEventListener('click',e=>{
  if(document.getElementById('moverlay').classList.contains('open')) return;
  ms.x=(e.clientX/innerWidth)*2-1; ms.y=-(e.clientY/innerHeight)*2+1;
  rc.setFromCamera(ms,camera);
  const allPlots=Object.values(plotMeshes).flat();
  const hits=rc.intersectObjects(allPlots);
  if(hits.length) onPlot(hits[0].object.userData.fid, hits[0].object.userData.idx);
});

// Hover highlight
canvas.addEventListener('mousemove',e=>{
  ms.x=(e.clientX/innerWidth)*2-1; ms.y=-(e.clientY/innerHeight)*2+1;
  rc.setFromCamera(ms,camera);
  const allPlots=Object.values(plotMeshes).flat();
  const hits=rc.intersectObjects(allPlots);
  // reset all
  allPlots.forEach(pm=>pm.material.emissive?.setHex(0x000000));
  if(hits.length){
    const pm=hits[0].object;
    pm.material.emissive?.setHex(0x442200);
    hoverPlot={fid:pm.userData.fid,idx:pm.userData.idx};
  } else hoverPlot=null;
});

// ── Camera orbit ──
const camTarget=new THREE.Vector3(0,0,0);
let camTheta=0, camPhi=.55, camR=14;
let drag=false, lmx=0, lmy=0;
canvas.addEventListener('mousedown',e=>{drag=true;lmx=e.clientX;lmy=e.clientY;});
window.addEventListener('mouseup',()=>drag=false);
canvas.addEventListener('mousemove',e=>{
  if(!drag) return;
  camTheta-=(e.clientX-lmx)*.012; lmx=e.clientX;
  camPhi=Math.max(.18,Math.min(1.35,camPhi+(e.clientY-lmy)*.012)); lmy=e.clientY;
});
canvas.addEventListener('wheel',e=>{ camR=Math.max(5,Math.min(26,camR+e.deltaY*.022)); },{passive:true});
// Touch
let tl=null;
canvas.addEventListener('touchstart',e=>{if(e.touches.length===1){drag=true;lmx=e.touches[0].clientX;lmy=e.touches[0].clientY;}},{passive:true});
canvas.addEventListener('touchend',()=>drag=false);
canvas.addEventListener('touchmove',e=>{
  if(!drag||e.touches.length!==1) return;
  camTheta-=(e.touches[0].clientX-lmx)*.012; lmx=e.touches[0].clientX;
  camPhi=Math.max(.18,Math.min(1.35,camPhi+(e.touches[0].clientY-lmy)*.012)); lmy=e.touches[0].clientY;
},{passive:true});

function updateCamera(){
  const x=camTarget.x+camR*Math.sin(camPhi)*Math.sin(camTheta);
  const y=camTarget.y+camR*Math.cos(camPhi);
  const z=camTarget.z+camR*Math.sin(camPhi)*Math.cos(camTheta);
  camera.position.set(x,y,z); camera.lookAt(camTarget);
}

// ── Animate ──
let frame=0;
function animate(){
  requestAnimationFrame(animate); frame++;
  updateCamera();
  // Rebuild plant visuals periodically (growth animation)
  if(frame%90===0){
    Object.keys(farmData).forEach(fid=>rebuildAllPlants(fid));
  }
  // Rainbow pulse
  if(frame%6===0){
    Object.keys(plantGroups).forEach(fid=>{
      const fd=farmData[fid]; if(!fd) return;
      (fd.plots||[]).forEach((p,i)=>{
        if(p.type==='rainbow'&&!p.harvested){
          const pg=plantGroups[fid]?.[i];
          pg?.children.forEach(c=>{
            if(c.material?.color) c.material.color.setHSL((Date.now()*.0004+i*.15)%1,1,.55);
          });
        }
      });
    });
  }
  renderer.render(scene,camera);
}

// ── Init ──
async function init(){
  let name=localStorage.getItem(LS.name);
  if(!name||name.length<1){
    name=(prompt('닉네임을 입력하세요 (2~10자)')||'감자농부').trim().slice(0,10)||'감자농부';
    localStorage.setItem(LS.name,name);
  }
  playerName=name; myId=name; curFarmId=name;
  document.getElementById('name-disp').textContent=name;
  loadLS(); updateUI();

  // 씬 즉시 구성 + 렌더 루프 시작 (Firebase 대기 안 함)
  buildFarm(myId,FPOS[0],true);
  buildTabs();
  setTool('harvest');
  animate();

  // Firebase는 백그라운드에서 로드
  try {
    await ensureMyFarm();
    subscribeFarm(myId);
    await loadOthers();
  } catch(e) {
    console.error('Firebase error:', e);
    toast('⚠️ 네트워크 오류 (농장 저장 불가)');
  }
}
init().catch(console.error);
</script>
